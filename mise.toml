[settings]
# mise.lock pins every tool's version, download URL and checksum for these
# platforms (CI/knowhere: linux-x64, Macs: macos-arm64). Keep it at format
# version 1 until every machine runs mise >= 2026.11 (older mise ignores and
# rewrites a newer format). After a pin change run `mise lock`; CI installs
# with --locked and fails on a stale lock.
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[tools]
# pv-migrate: operator tool for PV migrations, not used by CI or scripts.
# Pinned like the other tools instead of "latest" (reproducible installs);
# Renovate's mise manager bumps github: backend pins.
"github:utkuozdemir/pv-migrate" = "3.7.0"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
# yq: JSON for scripts/check_hogwarts_drill.py (CI job hogwarts-drill); also
# reads the kustomization graph in scripts/validate_manifests.sh
"aqua:mikefarah/yq" = "4.54.2"
# helm: kustomize's helmCharts inflator shells out to the helm CLI. v4.3.0 validated 2026-10-21: byte-identical kustomize --enable-helm output vs v3.22.0 for all helmCharts dirs
"aqua:helm/helm" = "4.3.1"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:stackrox/kube-linter" = "0.8.3"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0"
"pipx:yamllint" = "1.38.0"
"github:prometheus/prometheus" = "3.15.1"
