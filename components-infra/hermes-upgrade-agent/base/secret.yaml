# Same pattern as components-infra/hermes-infra-agent/base/secret.yaml:
# a legacy-style long-lived service-account token secret (the annotation
# triggers the controller to auto-populate data.token/data.ca.crt; this
# manifest carries no secret value itself). Intended to be synced out to
# Doppler (a new HERMES_UPGRADE_<CLUSTER>_KUBECONFIG-style key, separate
# from the existing HERMES_SAKAAR_KUBECONFIG/HERMES_ALTUS_KUBECONFIG which
# are built from hermes-infra-agent's token, not this one) as a manual step
# -- Heimdall cannot write Doppler secret values itself.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-upgrade-agent-token
  namespace: hermes-infra
  annotations:
    kubernetes.io/service-account.name: hermes-upgrade-agent
type: kubernetes.io/service-account-token
