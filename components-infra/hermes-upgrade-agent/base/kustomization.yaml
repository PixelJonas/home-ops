apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately does NOT include a namespace.yaml of its own -- reuses the
# `hermes-infra` namespace already created by
# components-infra/hermes-infra-agent/base/namespace.yaml, which is
# guaranteed to sync first (both components are wave 11 on both clusters,
# and Namespace/ServiceAccount/RBAC objects are inherently safe to
# reconcile in any relative order within the same wave since none of them
# depend on the others existing yet -- ArgoCD's sync-wave only orders
# across waves, not within one).
resources:
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - secret.yaml
