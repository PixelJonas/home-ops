# Same pattern as components-infra/hermes-argocd-agent/base/secret.yaml: a
# legacy-style long-lived service-account token secret (the annotation
# triggers the controller to auto-populate data.token/data.ca.crt; this
# manifest carries no secret value itself). Intended to be synced out to
# Doppler as new HERMES_VOLSYNC_ALTUS_KUBECONFIG / HERMES_VOLSYNC_SAKAAR_KUBECONFIG
# keys, as a manual step -- Heimdall cannot write Doppler secret values itself.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-volsync-agent-token
  namespace: hermes-infra
  annotations:
    kubernetes.io/service-account.name: hermes-volsync-agent
type: kubernetes.io/service-account-token
