# Bootstrap-only cloud-init for Hogwarts (knowhere pattern: cloud-init does
# bootstrap, Ansible in infra-ops does configuration). No secret values: the
# template only carries the two account names and the admin account's public
# key, all from Doppler homelab/home (the project the doppler-cluster
# ClusterSecretStore reads):
#   HOGWARTS_SSH_USER       admin account, Ansible login (copy of the
#                           infra-ops/prd value of the same name)
#   HOGWARTS_PRIMARY_USER   Julia's account, owns Hermes and its profiles
#                           (copy of the infra-ops/prd value of the same name)
#   HOGWARTS_SSH_PUBLIC_KEY Jonas's admin public key (copy of the infra-ops
#                           value, like KNOWHERE_SSH_PUBLIC_KEY)
#
# Two accounts per decision D1 (b) (spec section 2.2):
# - admin account: Jonas's admin key is its only authorized_keys entry,
#   password locked, passwordless sudo. Ansible and every hogwarts:* task log
#   in as this account.
# - Julia's account: no sudo at all (no sudoers entry, no sudo/admin group),
#   no authorized_keys, password locked. sshd lets only the admin account in.
# UIDs are pinned (1000/1001) so a rebuilt root disk recreates both accounts
# with the same owners as the files already on the persistent /home disk.
# Both ids are free in the pinned image (release-20261017, checked from its
# squashfs): /etc/passwd and /etc/group hold nothing from 1000 up except
# nobody/nogroup, and the image's default user (ubuntu, uid 1000 in
# /etc/cloud/cloud.cfg) is not created because the users list below has no
# "default" entry. First-boot check: `getent passwd 1000 1001` names exactly
# the two accounts, `id ubuntu` fails. Recheck when bumping the image.
#
# /home lives on the data disk from the first boot: cloud-init's disk_setup
# (fs_setup) and mounts modules run before users_groups in the init stage, so
# the homes are created on the mounted disk. fs_setup must use
# partition: auto (never "none"): with "auto" cloud-init reuses a disk that
# already carries ext4 labelled "home" and formats only a blank one, while
# "none" skips that check and runs mkfs -F on every new instance, i.e. a
# rebuilt root disk would wipe /home (cloud-init 26.1 cc_disk_setup.mkfs).
# overwrite: false on top. The fstab entry has no nofail on
# purpose: if the disk is missing, the boot stops instead of silently putting
# Julia's state on the disposable root disk.
#
# zram (4 GiB zstd, #278), unattended-upgrades, ufw, Tailscale, the sshd
# hardening beyond AllowUsers and everything else come from the infra-ops
# roles (#453/#461), not from here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hogwarts-cloudinit
  namespace: hogwarts
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: hogwarts-cloudinit
    template:
      engineVersion: v2
      data:
        userData: |
          #cloud-config
          hostname: hogwarts
          fs_setup:
            - label: home
              filesystem: ext4
              device: /dev/disk/by-id/virtio-homedisk
              partition: auto
              overwrite: false
          mounts:
            - ["/dev/disk/by-id/virtio-homedisk", "/home", "ext4", "defaults,x-systemd.device-timeout=60s", "0", "2"]
          users:
            - name: "{{ .sshUser }}"
              uid: 1000
              shell: /bin/bash
              lock_passwd: true
              sudo: "ALL=(ALL) NOPASSWD:ALL"
              ssh_authorized_keys:
                - "{{ .sshPublicKey }}"
            - name: "{{ .primaryUser }}"
              uid: 1001
              shell: /bin/bash
              lock_passwd: true
          disable_root: true
          ssh_pwauth: false
          write_files:
            - path: /etc/ssh/sshd_config.d/10-hogwarts-allowusers.conf
              owner: root:root
              permissions: "0644"
              content: |
                AllowUsers {{ .sshUser }}
          package_update: true
          packages:
            - qemu-guest-agent
            - python3
          runcmd:
            - systemctl enable --now qemu-guest-agent
  data:
    - secretKey: sshUser
      remoteRef:
        key: HOGWARTS_SSH_USER
    - secretKey: primaryUser
      remoteRef:
        key: HOGWARTS_PRIMARY_USER
    - secretKey: sshPublicKey
      remoteRef:
        key: HOGWARTS_SSH_PUBLIC_KEY
