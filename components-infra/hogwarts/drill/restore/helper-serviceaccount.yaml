# Helper identity for the two drill Jobs (fix-owner, revert-copy): they must
# chown disk.img to qemu (107:107), which needs root in the pod, i.e. the
# anyuid SCC (runbook part A step 5, volsync-restore.md "Helper pods and
# SCCs"). The grant is a RoleBinding in the scratch namespace only and goes
# away with it; the Jobs pin openshift.io/required-scc: anyuid.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drill-helper
  namespace: hogwarts-restore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drill-helper-anyuid
  namespace: hogwarts-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: drill-helper
    namespace: hogwarts-restore
