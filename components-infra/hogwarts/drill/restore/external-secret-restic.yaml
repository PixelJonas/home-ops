# The restic repository of Julia's /home, recreated from Doppler in the
# scratch namespace (never a copy of the live Secret). Same keys as
# ../../base/backup/home: the rest-server repo of hogwarts-home and the shared
# RESTIC_PASSWORD. The rest-server admits this namespace's VolSync movers
# (components-infra/restic-rest-server/networkpolicy.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-external-restic-config
  namespace: hogwarts-restore
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: restic-config-home
  data:
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: HOGWARTS_HOME_REST_REPO_LOCAL
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
