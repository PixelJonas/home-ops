apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: TAILSCALE_OPERATOR_OAUTH_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: TAILSCALE_OPERATOR_OAUTH_CLIENT_SECRET
