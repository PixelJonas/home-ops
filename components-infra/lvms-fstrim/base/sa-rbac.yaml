apiVersion: v1
kind: ServiceAccount
metadata:
  name: lvms-fstrim
---
# fstrim runs in the host's mount namespace (hostPID + nsenter), which needs
# the privileged SCC. The SA has no API permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lvms-fstrim-privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: lvms-fstrim
