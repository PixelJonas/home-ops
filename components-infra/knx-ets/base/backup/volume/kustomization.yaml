apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# In-cluster restic REST server only — no Backblaze B2 template here.
# Local-only backup by decision (2026-10-11): B2 is reserved for
# mission-critical data; the KNX ETS VM image is re-restorable from the
# NAS tar.
namePrefix: volume-
namespace: knx-ets

resources:
  - ../../../../../templates/volsync/rest

patches:
  - target:
      group: volsync.backube
      version: v1alpha1
      kind: ReplicationSource
      name: backup
    path: local.yaml
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: external-restic-config
    path: local-secret.yaml
