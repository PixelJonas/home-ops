# Mordo, the OpenShift/GitOps Hermes agent on knowhere (infra-ops
# docs/agents/mordo-openshift-agent-2026-11-06.md). Scoped rights, not
# cluster-admin: read everything but secrets, operate workloads, never
# delete data or change RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mordo
  namespace: mordo-admin
