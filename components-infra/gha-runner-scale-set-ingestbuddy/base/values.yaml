githubConfigUrl: "https://github.com/PixelJonas/ingestbuddy"
githubConfigSecret: gha-runners-github-secret
runnerScaleSetName: "arc-runner-set-ingestbuddy"
minRunners: 0
maxRunners: 10
controllerServiceAccount:
  namespace: actions-runner-system
  name: arc-gha-rs-controller
containerMode: {}
template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/pixeljonas/sakaar-gha-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: RUNNER_ALLOW_RUNASROOT
            value: "1"
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
          - name: containers-storage
            mountPath: /var/lib/containers/storage
    volumes:
      - name: containers-storage
        # The shared runner image uses podman's overlay driver (#935); overlay
        # can't nest on the container's own overlayfs root, so the graphroot
        # needs a real filesystem. emptyDir: ephemeral per runner pod, no cache.
        emptyDir: {}
