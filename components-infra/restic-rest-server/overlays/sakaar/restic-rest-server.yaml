apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: restic-rest-server-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: restic-rest
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.3.0
    helm:
      values: |-

        controllers:
          restic-rest-server:
            containers:
              restic-rest-server:
                image:
                  repository: restic/rest-server
                  tag: 0.14.0
                  pullPolicy: IfNotPresent
                env:
                  # Image entrypoint passes this to --htpasswd-file. Whole-volume
                  # mount (no subPath) so a rotated Secret reaches the file.
                  PASSWORD_FILE: /etc/rest-server/.htpasswd
                  # Each user may only open the repo named after it.
                  OPTIONS: "--private-repos"

        persistence:
          data:
            globalMounts:
              - path: /data
            storageClass: lvms-vg1
            accessMode: ReadWriteOnce
            size: 200Gi
          htpasswd:
            type: secret
            name: restic-rest-server-htpasswd
            globalMounts:
              - path: /etc/rest-server
                readOnly: true

        service:
          restic-rest:
            controller: restic-rest-server
            annotations:
              tailscale.com/expose: "true"
              tailscale.com/hostname: "restic-rest-server"
              # Own tailnet tag (infra-ops stacks/tailscale/acl.tf), not the
              # operator default tag:k8s, so the generic grants don't reach
              # this backup server (defence in depth on top of htpasswd).
              tailscale.com/tags: "tag:sakaar-restic"
            ports:
              http:
                port: 8000

  project: cluster-config
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
