# rest-server users (htpasswd, bcrypt). One user per client, each limited to
# its own repo by --private-repos (user name = first path segment). The value
# is generated outside the cluster and stored in Doppler infra-ops/prd, hence
# the doppler-infra store (Sakaar only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-rest-server-htpasswd
  namespace: restic-rest
  annotations:
    argocd.argoproj.io/sync-wave: "110"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-infra
  target:
    name: restic-rest-server-htpasswd
  data:
    - secretKey: .htpasswd
      remoteRef:
        key: SAKAAR_RESTIC_REST_HTPASSWD
