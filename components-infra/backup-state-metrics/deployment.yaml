---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-state-metrics
  labels:
    app.kubernetes.io/name: backup-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-state-metrics
    spec:
      serviceAccountName: backup-state-metrics
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          args:
            - --custom-resource-state-only=true
            - --custom-resource-state-config-file=/etc/backup-state-metrics/config.yaml
            - --port=8080
            - --telemetry-port=8081
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/backup-state-metrics
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: backup-state-metrics-config
