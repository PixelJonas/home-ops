apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-backup-provisioner
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: cluster-config
  source:
    repoURL: "https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/"
    chart: nfs-subdir-external-provisioner
    targetRevision: 4.0.18
    helm:
      values: |-

        nfs:
          server: 10.10.10.40
          path: /volume1/pmb-backup
          reclaimPolicy: Retain
          mountOptions:
            - "nfsvers=4"
            - "noac"

        storageClass:
          defaultClass: false
          name: pmb-backup
          onDelete: retain
          pathPattern: "${.PVC.namespace}-${.PVC.name}"
          accessModes: ReadWriteMany

        # Altus is single-node OpenShift; this Deployment runs replicaCount: 1
        # with strategyType: Recreate, so leader election protects against a
        # multi-writer scenario that can never occur here. With it on, a brief
        # kube-apiserver restart (which happens on every control-plane update
        # on a single-node cluster) makes the pod fail to renew its lease and
        # exit fatally ("Leaderelection lost"), crash-looping for no benefit.
        leaderElection:
          enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: nfs-provisioner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
