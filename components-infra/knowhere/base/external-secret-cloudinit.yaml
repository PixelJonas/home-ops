# Bootstrap-only cloud-init: creates the admin user, authorizes SSH, and
# installs just enough (qemu-guest-agent, python3) for Ansible to take over.
# Everything else (herdr, Claude Code, Kimi Code, mounts, tailscale) is
# configured by stacks/knowhere/ansible/ in infra-ops — this is deliberately
# thin, matching the "cloud-init does bootstrap, Ansible does configuration"
# split used nowhere else in this repo (closest precedent is the Ansible-only
# stacks/nidavellir host_base role).
#
# KNOWHERE_SSH_PUBLIC_KEY lives in the homelab/home Doppler project (the
# project this cluster's ClusterSecretStore reads from) — copied there from
# PERSONAL_SSH_PUBLIC_KEY in infra-ops/prd, a project this ClusterSecretStore
# has no access to.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: knowhere-cloudinit
  namespace: knowhere
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: knowhere-cloudinit
    template:
      engineVersion: v2
      data:
        userData: |
          #cloud-config
          hostname: knowhere
          users:
            - name: jonas
              groups: [sudo]
              shell: /bin/bash
              sudo: "ALL=(ALL) NOPASSWD:ALL"
              ssh_authorized_keys:
                - "{{ .sshPublicKey }}"
          package_update: true
          packages:
            - qemu-guest-agent
            - python3
          runcmd:
            - systemctl enable --now qemu-guest-agent
        networkData: |
          network:
            version: 2
            ethernets:
              enp1s0:
                dhcp4: true
              enp2s0:
                addresses:
                  - 10.10.10.51/24
  data:
    - secretKey: sshPublicKey
      remoteRef:
        key: KNOWHERE_SSH_PUBLIC_KEY
