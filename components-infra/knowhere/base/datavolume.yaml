# Ubuntu 24.04 LTS, deliberately not NixOS: the whole point of this VM is that
# agents can `curl | sh` and `apt install` arbitrary tools. NixOS has no FHS,
# so every dynamically-linked binary (including herdr's own installer) needs
# patchelf/nix-ld first — wrong tool for a playground.
#
# Blank Block target for the offline qcow2 restore. Do not use an HTTP source:
# if ArgoCD recreates this DataVolume, it must not download a fresh OS image
# over or instead of the restored disk.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: knowhere-rootdisk
  namespace: knowhere
  annotations:
    # The CDI CRDs come from the openshift-virtualization operator
    # (components-infra/openshift-virtualization), which may not have
    # reconciled yet on ArgoCD's first pass over this Application.
    # Prune=false: never garbage-collect the VM disk if this manifest is ever
    # dropped from git. Delete=false: keep it if the Application is deleted.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "0"
spec:
  source:
    blank: {}
  storage:
    accessModes:
      - ReadWriteOnce
    volumeMode: Block
    resources:
      requests:
        storage: 300Gi
    storageClassName: lvms-knowhere
