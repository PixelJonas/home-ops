githubConfigUrl: "https://github.com/PixelJonas/devland-2027"
githubConfigSecret: gha-runners-github-secret
runnerScaleSetName: "arc-runner-set-devland"
minRunners: 0
maxRunners: 3
controllerServiceAccount:
  namespace: actions-runner-system
  name: arc-gha-rs-controller
containerMode: {}
template:
  spec:
    containers:
      - name: runner
        # Pinned, not :latest, so an image change rolls out pool by pool via PR.
        image: ghcr.io/pixeljonas/sakaar-gha-runner:sha-2c49caa
        command: ["/home/runner/run.sh"]
        env:
          - name: RUNNER_ALLOW_RUNASROOT
            value: "1"
        securityContext:
          privileged: true
          runAsUser: 0
        resources:
          # Disk is the scarce resource on sakaar's single node: the request
          # lets the scheduler queue runners instead of the kubelet evicting
          # them under DiskPressure; the limit evicts only a runaway job.
          requests:
            ephemeral-storage: 4Gi
          limits:
            ephemeral-storage: 20Gi
        volumeMounts:
          - name: containers-storage
            mountPath: /var/lib/containers/storage
    volumes:
      - name: containers-storage
        # The runner image uses podman's overlay driver, which can't nest on
        # the container's own overlayfs root, so the graphroot needs a real
        # filesystem. Per-pod emptyDir, never shared: a graphroot shared by
        # concurrent pods corrupts podman's container DB (each pod has its
        # own runroot) and lets parallel runs overwrite each other's tags.
        emptyDir: {}
