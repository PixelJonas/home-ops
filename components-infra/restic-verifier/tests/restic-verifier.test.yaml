---
# promtool unit tests. Sample every minute or less often than the 5m lookback.
rule_files:
  - rules.generated.yaml
evaluation_interval: 1m
tests:
  - interval: 5m
    input_series:
      - series: kube_cronjob_status_last_successful_time{namespace="restic-verifier",cronjob="restic-verifier"}
        values: 0x2600
    alert_rule_test:
      - alertname: ResticCheckStale
        eval_time: 7d
        exp_alerts: []
      - alertname: ResticCheckStale
        eval_time: 9d
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: restic-verifier
              cronjob: restic-verifier
            exp_annotations:
              summary: restic-verifier has not succeeded for over 8 days
              description: >-
                Repository integrity is unchecked. Check the CronJob in restic-verifier; a
                failed run's log names the repositories.
  # Scheduled at t=0 (kube-state-metrics then reports the next tick, 7d on),
  # never succeeded: quiet while the first run may still be going, fires once
  # the run is a day old and the 1h `for` has passed.
  - interval: 5m
    input_series:
      - series: kube_cronjob_status_last_schedule_time{namespace="restic-verifier",cronjob="restic-verifier"}
        values: 0x2600
      - series: kube_cronjob_next_schedule_time{namespace="restic-verifier",cronjob="restic-verifier"}
        values: 604800x2600
    alert_rule_test:
      - alertname: ResticCheckNeverSucceeded
        eval_time: 1d
        exp_alerts: []
      - alertname: ResticCheckNeverSucceeded
        eval_time: 1d30m
        exp_alerts: []
      - alertname: ResticCheckNeverSucceeded
        eval_time: 1d2h
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: restic-verifier
              cronjob: restic-verifier
            exp_annotations:
              summary: restic-verifier has never succeeded
              description: >-
                The CronJob's first scheduled run is over a day past and no run has
                succeeded. Check the CronJob and its Jobs in restic-verifier.
  # Never scheduled (status.lastScheduleTime unset, e.g. the controller missed
  # the tick): next_schedule_time stays at the first tick after creation (1h).
  - interval: 5m
    input_series:
      - series: kube_cronjob_next_schedule_time{namespace="restic-verifier",cronjob="restic-verifier"}
        values: 3600x2600
    alert_rule_test:
      - alertname: ResticCheckNeverSucceeded
        eval_time: 1d
        exp_alerts: []
      - alertname: ResticCheckNeverSucceeded
        eval_time: 2d
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: restic-verifier
              cronjob: restic-verifier
            exp_annotations:
              summary: restic-verifier has never succeeded
              description: >-
                The CronJob's first scheduled run is over a day past and no run has
                succeeded. Check the CronJob and its Jobs in restic-verifier.
  # A run that already succeeded isn't "never succeeded".
  - interval: 5m
    input_series:
      - series: kube_cronjob_status_last_schedule_time{namespace="restic-verifier",cronjob="restic-verifier"}
        values: 0x2600
      - series: kube_cronjob_next_schedule_time{namespace="restic-verifier",cronjob="restic-verifier"}
        values: 604800x2600
      - series: kube_cronjob_status_last_successful_time{namespace="restic-verifier",cronjob="restic-verifier"}
        values: 7000x2600
    alert_rule_test:
      - alertname: ResticCheckNeverSucceeded
        eval_time: 2d
        exp_alerts: []
  # Suspended and never scheduled: kube-state-metrics drops next_schedule_time,
  # nothing is due, so no alert.
  - interval: 5m
    input_series:
      - series: kube_cronjob_spec_suspend{namespace="restic-verifier",cronjob="restic-verifier"}
        values: 1x2600
    alert_rule_test:
      - alertname: ResticCheckNeverSucceeded
        eval_time: 9d
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: kube_job_failed{namespace="restic-verifier",job_name="restic-verifier-1",condition="true"}
        values: 1x10
      - series: kube_job_failed{namespace="restic-verifier",job_name="restic-verifier-2",condition="true"}
        values: 0x10
    alert_rule_test:
      - alertname: ResticCheckFailed
        eval_time: 5m
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: restic-verifier
              job_name: restic-verifier-1
              condition: "true"
            exp_annotations:
              summary: "restic check failed: restic-verifier-1"
              description: >-
                A repository failed its check, stopped receiving backups, or wasn't reached in
                time. The Job's log names which. Delete the Job once handled to clear this.
