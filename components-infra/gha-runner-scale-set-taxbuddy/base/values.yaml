githubConfigUrl: "https://github.com/PixelJonas/taxbuddy"
githubConfigSecret: gha-runners-github-secret
runnerScaleSetName: "arc-runner-set-taxbuddy"
minRunners: 0
# sakaar's root SSD (shared with etcd) saturates under concurrent runner IO:
# 12-23 parallel runners stalled etcd for seconds and hit DiskPressure on
# 2026-11-10. Caps total 16 across the five scale sets (infra-ops
# docs/agents/sakaar-runner-disk-io-2026-11-10.md).
maxRunners: 4
controllerServiceAccount:
  namespace: actions-runner-system
  name: arc-gha-rs-controller
containerMode: {}
template:
  spec:
    containers:
      - name: runner
        # Pinned, not :latest, so an image change rolls out pool by pool via PR.
        image: ghcr.io/pixeljonas/sakaar-gha-runner:sha-2c49caa
        command: ["/home/runner/run.sh"]
        env:
          - name: RUNNER_ALLOW_RUNASROOT
            value: "1"
        securityContext:
          privileged: true
          runAsUser: 0
        resources:
          # Disk is the scarce resource on sakaar's single node: the request
          # lets the scheduler queue runners instead of the kubelet evicting
          # them under DiskPressure; the limit evicts only a runaway job.
          # memory: ~p90 working set (0.67 GiB peak over 7 days), so the runners
          # are Burstable and the scheduler counts them. No CPU request: the
          # node's CPU requests are ~85-94 % while real use is ~18 %, so one
          # would park runners in Pending below maxRunners.
          requests:
            ephemeral-storage: 4Gi
            memory: 512Mi
          limits:
            ephemeral-storage: 20Gi
        volumeMounts:
          - name: containers-storage
            mountPath: /var/lib/containers/storage
    volumes:
      - name: containers-storage
        # The runner image uses podman's overlay driver, which can't nest on
        # the container's own overlayfs root, so the graphroot needs a real
        # filesystem. Per-pod emptyDir, never shared: a graphroot shared by
        # concurrent pods corrupts podman's container DB (each pod has its
        # own runroot) and lets parallel runs overwrite each other's tags.
        emptyDir: {}
