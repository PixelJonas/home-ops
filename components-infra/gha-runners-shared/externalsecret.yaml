apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gha-runners-github-secret
  namespace: arc-runners
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: gha-runners-github-secret
  data:
    - secretKey: github_app_id
      remoteRef:
        key: GHA_RUNNERS_APP_ID
    - secretKey: github_app_installation_id
      remoteRef:
        key: GHA_RUNNERS_INSTALLATION_ID
    - secretKey: github_app_private_key
      remoteRef:
        key: GHA_RUNNERS_PRIVATE_KEY
