apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
data:
  config.yaml: |
    prometheus:
      # Default is 24h; VolSyncBackupStale needs >26h of history (offset
      # guard + 26h window). 7d keeps a week of headroom on the 40Gi PVC.
      retention: 7d
      volumeClaimTemplate:
        spec:
          storageClassName: lvms-vg1
          resources:
            requests:
              storage: 40Gi
    thanosRuler:
      volumeClaimTemplate:
        spec:
          storageClassName: lvms-vg1
          resources:
            requests:
              storage: 40Gi
