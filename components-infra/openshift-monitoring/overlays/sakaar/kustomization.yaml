apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sakaar-only subset of the openshift-monitoring base: just the pieces
# needed for cross-cluster Thanos read access (Grafana's ntfy-alerting
# bridge) and fleet-wide VolSync backup coverage, plus a sakaar-sized
# cluster-monitoring-config (own file, not the base's). Deliberately excludes
# the base's configmap-cluster-monitoring.yaml (Altus-sized, sets
# enableUserWorkload) and configmap-user-workload-monitoring.yaml: user
# workload monitoring is NOT running on sakaar, so enableUserWorkload is
# intentionally left unset. Also excludes node-temperature-rule.yaml/
# pending-csr-rule.yaml (Altus-hardware- and bare-metal-specific, not
# applicable to sakaar's Hetzner VPS).
#
# Files below (except configmap-cluster-monitoring.yaml, which is
# sakaar-specific) are COPIES of the matching ../../base/*.yaml, not references
# — kustomize's default load restrictor blocks a resource path escaping an
# overlay's own directory tree (see .claude/rules/kubernetes-argocd.md
# equivalent gotcha in infra-ops for the sibling case). Keep both copies in
# sync by hand if either changes.
resources:
  - service-account.yaml
  - token-secret.yaml
  - monitoring-role-binding.yaml
  - volsync-backup-rule.yaml
  - configmap-cluster-monitoring.yaml
  - thanos-querier-tailnet-service.yaml
