apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: altus-no-turbo
  namespace: openshift-cluster-node-tuning-operator
spec:
  profile:
    - name: openshift-control-plane-no-turbo
      data: |
        [main]
        summary=Control-plane profile with Intel turbo disabled (thermal/VRM mitigation on altus) and power-saving CPU policy
        include=openshift-control-plane

        # no_turbo: thermal/VRM mitigation on altus.
        # Power saving: the parent throughput-performance pins governor
        # performance, EPP performance and min_perf_pct=100 (3.6 GHz on every
        # core). Let HWP scale down at low load. min_perf_pct is a percentage
        # of the max turbo P-state (5.0 GHz), 20 = 1.0 GHz floor.
        # Applied live by NTO (no reboot); revert = git revert.
        [cpu]
        no_turbo=1
        governor=powersave
        energy_performance_preference=balance_power
        energy_perf_bias=normal
        min_perf_pct=20

        # Cap dirty page cache so bulk writers (image pulls, VolSync/restic) can't
        # build up GBs of writeback that stalls etcd fsyncs on the shared disk.
        # *_bytes override the *_ratio defaults. Applied live by NTO (no reboot).
        [sysctl]
        vm.dirty_background_bytes=134217728
        vm.dirty_bytes=536870912
  recommend:
    - match:
        - label: kubernetes.io/hostname
          value: altus
      priority: 15
      profile: openshift-control-plane-no-turbo
