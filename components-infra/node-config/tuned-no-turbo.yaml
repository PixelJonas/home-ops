apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: default
  namespace: openshift-cluster-node-tuning-operator
spec:
  profile:
    - data: |
        [main]
        summary=Optimize systems running OpenShift (provider specific parent profile)
        include=-provider-${f:exec:cat:/var/lib/ocp-tuned/provider},openshift
      name: openshift
    - name: openshift-control-plane-no-turbo
      data: |
        [main]
        summary=Control-plane profile with Intel turbo disabled (thermal/VRM mitigation on altus)
        include=openshift-control-plane

        [cpu]
        no_turbo=1
  recommend:
    - match:
        - label: kubernetes.io/hostname
          value: altus
      priority: 15
      profile: openshift-control-plane-no-turbo
    - match:
        - label: node-role.kubernetes.io/control-plane
        - label: node-role.kubernetes.io/infra
      operand:
        tunedConfig: {}
      priority: 30
      profile: openshift-control-plane
    - operand:
        tunedConfig: {}
      priority: 40
      profile: openshift-node
