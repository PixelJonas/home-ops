apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: altus-no-turbo
  namespace: openshift-cluster-node-tuning-operator
spec:
  profile:
    - name: openshift-control-plane-no-turbo
      data: |
        [main]
        summary=Control-plane profile with Intel turbo disabled (thermal/VRM mitigation on altus)
        include=openshift-control-plane

        [cpu]
        no_turbo=1

        # Cap dirty page cache so bulk writers (image pulls, VolSync/restic) can't
        # build up GBs of writeback that stalls etcd fsyncs on the shared disk.
        # *_bytes override the *_ratio defaults. Applied live by NTO (no reboot).
        [sysctl]
        vm.dirty_background_bytes=134217728
        vm.dirty_bytes=536870912
  recommend:
    - match:
        - label: kubernetes.io/hostname
          value: altus
      priority: 15
      profile: openshift-control-plane-no-turbo
