apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "111"
  name: volsync-operator
  namespace: openshift-gitops
spec:
  destination:
    namespace: volsync-system
    server: "https://kubernetes.default.svc"
  source:
    repoURL: https://backube.github.io/helm-charts/
    targetRevision: 0.16.0
    chart: volsync
    helm:
      values: |-

        manageCRDs: true
        metrics:
          disableAuth: true
        # Explicit, non-empty override so the chart skips its own
        # `.Capabilities.APIVersions.Has "security.openshift.io/v1/..."`
        # auto-detection entirely (unreliable via ArgoCD's repo-server on
        # a freshly-bootstrapped cluster - it otherwise falls through to
        # a hardcoded runAsUser/runAsGroup: 65534 meant for non-OpenShift
        # clusters, which every OpenShift SCC rejects).
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

  project: cluster-config
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
