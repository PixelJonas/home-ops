name: build-vehicle-pipeline-image
on:
  push:
    branches: [main]
    paths:
      - "containers/vehicle-pipeline/**"
      - ".github/workflows/build-vehicle-pipeline-image.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          SHA_SHORT: ${{ steps.meta.outputs.sha_short }}
        run: |
          docker build -f containers/vehicle-pipeline/Containerfile \
            -t "ghcr.io/pixeljonas/vehicle-pipeline:sha-${SHA_SHORT}" \
            -t ghcr.io/pixeljonas/vehicle-pipeline:latest \
            containers/vehicle-pipeline
          docker push --all-tags ghcr.io/pixeljonas/vehicle-pipeline
