name: build-vehicle-pipeline-image
on:
  push:
    branches: [main]
    paths:
      - "containers/vehicle-pipeline/**"
      - ".github/workflows/build-vehicle-pipeline-image.yaml"
  pull_request:
    paths:
      - "containers/vehicle-pipeline/**"
      - ".github/workflows/build-vehicle-pipeline-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # Runs inside the same python base image the app ships on, via the
      # runner's docker daemon (dind on Gitea Actions) -- no setup-python
      # download, and the build context is streamed, so no bind mount of
      # the job workspace into dind is needed. DB integration tests skip
      # (no INTEGRATION_DATABASE_URL).
      - name: Run tests
        run: |
          docker build --pull -f - containers/vehicle-pipeline <<'EOF'
          FROM python:3.14-slim
          WORKDIR /app
          COPY pyproject.toml .
          COPY src/ src/
          RUN pip install --no-cache-dir '.[dev]'
          COPY tests/ tests/
          COPY scripts/ scripts/
          RUN python -m pytest -q -p no:cacheprovider
          EOF

  build:
    name: build and push
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          SHA_SHORT: ${{ steps.meta.outputs.sha_short }}
        run: |
          docker build -f containers/vehicle-pipeline/Containerfile \
            -t "ghcr.io/pixeljonas/vehicle-pipeline:sha-${SHA_SHORT}" \
            -t ghcr.io/pixeljonas/vehicle-pipeline:latest \
            containers/vehicle-pipeline
          docker push --all-tags ghcr.io/pixeljonas/vehicle-pipeline
