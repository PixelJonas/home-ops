name: build-gha-runner-image
on:
  push:
    branches: [main]
    paths:
      - "containers/gha-runner/**"
      - ".github/workflows/build-gha-runner-image.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN gets permission_denied: write_package for packages
          # owned by the user account but not linked to this repo; GHCR_TOKEN
          # (classic PAT, write:packages) covers those.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          SHA_SHORT: ${{ steps.meta.outputs.sha_short }}
        run: |
          docker build -f containers/gha-runner/Containerfile \
            -t "ghcr.io/pixeljonas/sakaar-gha-runner:sha-${SHA_SHORT}" \
            -t ghcr.io/pixeljonas/sakaar-gha-runner:latest \
            containers/gha-runner
          docker push --all-tags ghcr.io/pixeljonas/sakaar-gha-runner
