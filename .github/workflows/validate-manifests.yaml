name: Validate Manifests

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full run: validate-manifests builds every kustomization directory
  # (--all) and the renovate config is validated without a change filter.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  # The event name keeps a nightly or manual run on main and a push run on
  # main from cancelling each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          cache: true
      - name: yamllint
        run: mise exec -- yamllint .

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          cache: true
      - name: actionlint
        run: mise exec -- actionlint .github/workflows/*.yaml

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          cache: true
      - name: zizmor
        run: mise exec -- zizmor .github/workflows/

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          cache: true
      - name: gitleaks
        run: mise exec -- gitleaks git --redact --config .gitleaks.toml .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          cache: true
      - name: shellcheck
        run: mise exec -- shellcheck scripts/*.sh bootstrap.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          cache: true
      - name: hadolint
        run: mise exec -- hadolint containers/gha-runner/Containerfile

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          cache: true
      # yamllint has its own job. Pushes and PRs build the top-level
      # kustomizations only (included ones are rendered through them);
      # nightly and manual runs build every directory.
      - name: Validate Manifests
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--skip-yamllint)
          case "$EVENT_NAME" in
            schedule | workflow_dispatch) args+=(--all) ;;
          esac
          mise exec -- ./scripts/validate_manifests.sh "${args[@]}"

  hogwarts-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          cache: true
      - name: Hogwarts restore-drill guard rails
        run: mise exec -- ./scripts/test_hogwarts_drill.sh

  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          cache: true
      - name: Test Prometheus rules
        run: mise exec -- ./scripts/test_prometheus_rules.sh

  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check for renovate config changes
        id: changes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # The workflow file carries RENOVATE_VERSION, so a bump runs the
          # validator too.
          filters: |
            renovate:
              - ".github/renovate.json5"
              - ".github/renovate/**"
              - ".github/workflows/validate-manifests.yaml"
      - name: Set up Node
        id: node
        if: steps.changes.outputs.renovate == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Validate renovate config
        if: steps.node.outcome == 'success'
        env:
          # Pinned instead of whatever npm serves today (supply chain); Renovate
          # bumps it via the customManagers:githubActionsVersions preset.
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.198.3
        # The shared preset is validated as a file too: the repo config only
        # extends it from main, so a broken preset would otherwise pass CI.
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator --strict .github/renovate.json5 .github/renovate/base.json5
