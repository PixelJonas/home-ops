name: build-taxbuddy-hermes-tools-image
on:
  push:
    branches: [main]
    paths:
      - "containers/taxbuddy-hermes-tools/**"
      - ".github/workflows/build-taxbuddy-hermes-tools-image.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          SHA_SHORT: ${{ steps.meta.outputs.sha_short }}
          GH_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          docker build -f containers/taxbuddy-hermes-tools/Containerfile \
            --secret id=github_token,env=GH_TOKEN \
            -t "ghcr.io/pixeljonas/taxbuddy-hermes-tools:sha-${SHA_SHORT}" \
            -t ghcr.io/pixeljonas/taxbuddy-hermes-tools:latest \
            containers/taxbuddy-hermes-tools
          docker push --all-tags ghcr.io/pixeljonas/taxbuddy-hermes-tools
