apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: backup
  annotations:
    argocd.argoproj.io/sync-wave: "200"
spec:
  sourcePVC: syno-template-backup
  trigger:
    # Placeholder only: every consumer patches its own slot (UTC) from
    # docs/volsync-schedules.md. Synology iSCSI clone sources sit on a 4-minute grid,
    # all others on odd minutes, b2 legs after the rest legs. All RSes on
    # one time overloaded the Synology CSI on 05.11.2026 (CreateVolume
    # DeadlineExceeded, stuck movers). An RS still showing this value has
    # no slot yet.
    schedule: "2 7 * * *"
  restic:
    pruneIntervalDays: 14
    repository: restic-config-database
    cacheStorageClassName: lvms-vg1
    # Retention: tier B (default). Tier A apps add the
    # templates/volsync/retain-tier-a component instead.
    # within: 3d keeps every snapshot of the last 3 days, so manual or
    # migration syncs don't rotate out a scheduled one.
    retain:
      within: 3d
      daily: 7
      weekly: 6
      monthly: 6
    copyMethod: Direct
