apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: backup
  annotations:
    argocd.argoproj.io/sync-wave: "200"
spec:
  sourcePVC: syno-template-backup
  trigger:
    schedule: "0 5 * * *"
  restic:
    pruneIntervalDays: 14
    repository: restic-config-database
    cacheStorageClassName: lvms-vg1
    # Retention: tier B (default). Tier A apps add the
    # templates/volsync/retain-tier-a component instead.
    # within: 3d keeps every snapshot of the last 3 days, so manual or
    # migration syncs don't rotate out a scheduled one.
    retain:
      within: 3d
      daily: 7
      weekly: 6
      monthly: 6
    copyMethod: Direct
