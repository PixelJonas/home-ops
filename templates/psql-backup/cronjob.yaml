apiVersion: batch/v1
kind: CronJob
metadata:
  name: psql-backup
  namespace: template
  annotations:
    argocd.argoproj.io/sync-wave: "200"
spec:
  schedule: "0 3 * * *"
  # Never overlap a still-running dump with the next night's run, and
  # keep the last three failed Jobs (and their pod logs) as evidence.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Slowest route (ingestbuddy, ~9 GB) takes 3-5 minutes; 20 minutes
      # leaves room for growth and a slow NAS without letting a hung dump
      # run into the VolSync window.
      activeDeadlineSeconds: 1200
      # One retry for transient failures (connection reset, pod eviction).
      backoffLimit: 1
      # A rejected candidate (65), too little free space (73) or a client
      # older than the server (78) won't fix itself on a retry: fail the
      # Job at once instead of dumping again.
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: pg-dump
              operator: In
              values: [65, 73, 78]
      template:
        spec:
          serviceAccountName: database-psql-backup
          # The dump talks to the DB Service only; no Kubernetes API access.
          automountServiceAccountToken: false
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: syno-template-db-backup
          containers:
            - name: pg-dump
              env:
                - name: POSTGRES_USER
                  value: template
                - name: POSTGRES_POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: template-pguser-postgres
                      key: password
              volumeMounts:
                - name: backup
                  mountPath: /backup
              image: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie
              command: ["/bin/bash", "-c"]
              args:
                - |-
                  set -Eeuo pipefail

                  # Exit codes (sysexits.h), so a failed Job says why:
                  #   65 candidate dump rejected by structural validation
                  #   69 SYNC_DIR handshake: maintenance mode not enabled (no dump taken)
                  #   73 not enough free space on the dump PVC
                  #   78 server major version newer than the client
                  #   other: connection or pg_dumpall failure (retried once)
                  # In every failure case the previous backup.sql stays.
                  backup_dir="${BACKUP_DIR:-/backup}"
                  # Optional handshake with a sidecar (e.g. Nextcloud
                  # maintenance mode). Off unless SYNC_DIR is set.
                  sync_dir="${SYNC_DIR:-}"

                  export PGHOST="${POSTGRES_HOST:-${POSTGRES_USER}-db-rw}"
                  export PGUSER="$POSTGRES_USER"
                  export PGPASSWORD="$POSTGRES_POSTGRES_PASSWORD"
                  export PGCONNECT_TIMEOUT=15

                  tmp=
                  cleanup() {
                    rc=$?
                    trap - EXIT HUP INT TERM
                    if [[ -n "${tmp:-}" ]]; then
                      rm -f -- "$tmp"
                    fi
                    if [[ -n "$sync_dir" ]]; then
                      echo "$rc" > "$sync_dir/dump-done.tmp"
                      mv -f -- "$sync_dir/dump-done.tmp" "$sync_dir/dump-done"
                    fi
                    exit "$rc"
                  }
                  trap cleanup EXIT
                  trap 'exit 129' HUP
                  trap 'exit 130' INT
                  trap 'exit 143' TERM

                  # Preflight 1: a SIGKILLed, OOM-killed or evicted run skips
                  # the EXIT trap and leaks its temp file. concurrencyPolicy:
                  # Forbid means no other run can own one, so sweep them.
                  stale="$(find "$backup_dir" -maxdepth 1 -type f \( -name 'backup.sql.*.tmp' -o -name 'backup.sql.tmp' \) -print -delete | wc -l)"
                  echo "Preflight: removed $stale stale temp file(s)"

                  # Preflight 2: the new dump is written next to the old one,
                  # so require 1.5x the last accepted size in free space.
                  last_size=0
                  if [[ -f "$backup_dir/backup.sql" ]]; then
                    last_size="$(stat -c %s -- "$backup_dir/backup.sql")"
                  fi
                  need=$(( last_size * 3 / 2 ))
                  avail="$(df -P -B1 -- "$backup_dir" | awk 'NR == 2 { print $4 }')"
                  if (( avail < need )); then
                    echo "Preflight failed (exit 73): ${avail} bytes free on the dump PVC, need ${need} (1.5x the last accepted ${last_size} bytes)" >&2
                    exit 73
                  fi
                  echo "Preflight: ${avail} bytes free, need ${need}"

                  # Preflight 3: pg_dumpall refuses a newer server major anyway;
                  # this makes the reason explicit.
                  client_major="$(pg_dumpall --version | sed -E 's/^[^0-9]*([0-9]+).*/\1/')"
                  if ! server_num="$(psql -XAtq -d postgres -c 'SHOW server_version_num' 2>/dev/null)"; then
                    server_num="$(psql -XAtq -d template1 -c 'SHOW server_version_num')" || {
                      rc=$?
                      echo "Preflight failed (exit $rc): cannot connect to $PGHOST" >&2
                      exit "$rc"
                    }
                  fi
                  server_major=$(( server_num / 10000 ))
                  if (( server_major > client_major )); then
                    echo "Preflight failed (exit 78): server major $server_major is newer than client major $client_major" >&2
                    exit 78
                  fi
                  echo "Preflight: server major $server_major, client major $client_major"

                  if [[ -n "$sync_dir" ]]; then
                    touch "$sync_dir/preflight-ok"
                    echo "Waiting for maintenance mode"
                    for _ in $(seq 1 150); do
                      [[ -f "$sync_dir/maintenance-on" || -f "$sync_dir/maintenance-failed" ]] && break
                      sleep 2
                    done
                    if [[ ! -f "$sync_dir/maintenance-on" ]]; then
                      echo "Maintenance mode not enabled (exit 69); no dump taken" >&2
                      exit 69
                    fi
                  fi

                  echo "Starting direct-Service PostgreSQL dump"
                  tmp="$(mktemp "$backup_dir/backup.sql.XXXXXXXXXX.tmp")"
                  pg_dumpall --no-role-passwords --file="$tmp"
                  chmod 0644 "$tmp"
                  sync "$tmp"

                  set +e
                  perl -Mstrict -Mwarnings -MEncode=decode,FB_CROAK - "$tmp" <<'PERL'
                  my $path = shift @ARGV;
                  die "backup validation failed: no dump path supplied\n" unless defined $path;

                  sub reject {
                    my ($message, $line) = @_;
                    if (defined $line) {
                      print STDERR "backup validation failed at line $line: $message\n";
                    } else {
                      print STDERR "backup validation failed: $message\n";
                    }
                    exit 65;
                  }

                  sub column_count {
                    my ($text, $line) = @_;
                    my $length = length $text;
                    my $pos = 0;
                    my $count = 0;

                    while (1) {
                      $pos++ while $pos < $length && substr($text, $pos, 1) =~ /\s/;
                      reject("empty column in COPY declaration", $line) if $pos >= $length;

                      if (substr($text, $pos, 1) eq '"') {
                        my $closed = 0;
                        $pos++;
                        while ($pos < $length) {
                          if (substr($text, $pos, 1) eq '"') {
                            if ($pos + 1 < $length && substr($text, $pos + 1, 1) eq '"') {
                              $pos += 2;
                              next;
                            }
                            $pos++;
                            $closed = 1;
                            last;
                          }
                          $pos++;
                        }
                        reject("unterminated quoted column in COPY declaration", $line) unless $closed;
                      } else {
                        my $start = $pos;
                        while ($pos < $length) {
                          my $char = substr($text, $pos, 1);
                          last if $char eq ',' || $char =~ /\s/;
                          reject("unexpected quote in COPY column", $line) if $char eq '"';
                          $pos++;
                        }
                        reject("invalid column in COPY declaration", $line) if $pos == $start;
                      }

                      $count++;
                      $pos++ while $pos < $length && substr($text, $pos, 1) =~ /\s/;
                      return $count if $pos >= $length;
                      reject("invalid COPY column separator", $line) unless substr($text, $pos, 1) eq ',';
                      $pos++;
                    }
                  }

                  open my $fh, '<', $path or reject("cannot open dump");
                  binmode $fh or reject("cannot set dump to binary mode");

                  my $line_number = 0;
                  my $last_ended_newline = 0;
                  my $header_seen = 0;
                  my $footer_seen = 0;
                  my $saw_sql = 0;
                  my $in_copy = 0;
                  my $expected_fields = 0;
                  my $copy_blocks = 0;

                  while (1) {
                    $! = 0;
                    my $raw = <$fh>;
                    if (!defined $raw) {
                      reject("dump read failure") if $!;
                      last;
                    }

                    $line_number++;
                    $last_ended_newline = $raw =~ /\n\z/;
                    reject("NUL byte in dump", $line_number) if index($raw, "\0") >= 0;
                    reject("carriage return in direct-Linux dump", $line_number) if index($raw, "\r") >= 0;

                    my $text;
                    my $bytes = $raw;
                    eval {
                      $text = decode('UTF-8', $bytes, FB_CROAK);
                      1;
                    } or reject("invalid UTF-8", $line_number);

                    if ($footer_seen) {
                      reject("SQL after final cluster footer", $line_number)
                        unless $text =~ /^\s*\z/ || $text =~ /^--[^\n]*\n?\z/;
                      next;
                    }

                    if ($in_copy) {
                      if ($raw eq "\\.\n") {
                        $in_copy = 0;
                        $expected_fields = 0;
                        $copy_blocks++;
                        next;
                      }

                      my $fields = 1 + (() = $raw =~ /\t/g);
                      reject("COPY row field count mismatch", $line_number)
                        unless $fields == $expected_fields;
                      next;
                    }

                    reject("control byte outside COPY data", $line_number)
                      if $raw =~ /[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/;

                    if ($text eq "-- PostgreSQL database cluster dump\n") {
                      $header_seen = 1;
                      next;
                    }
                    if ($text eq "-- PostgreSQL database cluster dump complete\n") {
                      $footer_seen = 1;
                      next;
                    }
                    next if $text =~ /^\s*\z/ || $text =~ /^--[^\n]*\n?\z/;

                    $saw_sql = 1;
                    if ($text =~ /^COPY\b/) {
                      my ($columns) = $text =~ /^COPY\s+(?:"(?:[^"]|"")*"|[^\s.(]+)(?:\s*\.\s*(?:"(?:[^"]|"")*"|[^\s.(]+))*\s*\((.*)\)\s+FROM\s+stdin;\n\z/;
                      reject("invalid or unsupported COPY statement", $line_number) unless defined $columns;
                      $expected_fields = column_count($columns, $line_number);
                      $in_copy = 1;
                    }
                  }

                  close $fh or reject("cannot close dump after reading");
                  reject("missing final newline") unless $last_ended_newline;
                  reject("unterminated COPY block") if $in_copy;
                  reject("missing cluster dump header") unless $header_seen;
                  reject("dump contains no SQL statements") unless $saw_sql;
                  reject("missing final cluster dump footer") unless $footer_seen;
                  print "Structural validation passed ($copy_blocks COPY blocks)\n";
                  PERL
                  rc=$?
                  set -e
                  if (( rc == 65 )); then
                    echo "Rejected candidate (exit 65): structural validation failed; previous backup.sql kept" >&2
                    exit 65
                  elif (( rc != 0 )); then
                    echo "Validator error (exit $rc); previous backup.sql kept" >&2
                    exit "$rc"
                  fi

                  mv -f -- "$tmp" "$backup_dir/backup.sql"
                  tmp=
                  sync "$backup_dir"
                  echo "Accepted structurally valid backup.sql"
                  ls -lah "$backup_dir"
          restartPolicy: Never
