---
# Since #1043 the dump connects straight to the DB Service with
# pg_dumpall, so the backup Job needs no Kubernetes API access at all.
# The Role (and its RoleBinding, which each app patches) stays so the
# per-app overlays keep building; it grants nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role-psql-backup
rules: []
