default:
  app:
    enabled: true
    enableAutoSync: true
    autoSyncPrune: true
    project: cluster-config
    labels:
      app-source: sakaar
      repo: cluster-config
    destination:
      namespace: openshift-gitops
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/pixeljonas/home-ops.git
      targetRevision: HEAD

applications:
  external-secrets-doppler:
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    destination:
      namespace: external-secrets-operator
    source:
      path: components-infra/external-secrets-store-doppler/overlays/sakaar

  cert-manager-operator:
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    destination:
      namespace: cert-manager-operator
    source:
      path: components-infra/cert-manager-operator/aggregate/overlays/letsencrypt

  certificates:
    annotations:
      argocd.argoproj.io/sync-wave: "3"
    destination:
      namespace: cert-manager-operator
    source:
      path: components-infra/certificates/overlays/sakaar

  volsync:
    annotations:
      argocd.argoproj.io/sync-wave: "22"
      argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    source:
      path: components-infra/volsync

  restic-rest-server:
    annotations:
      argocd.argoproj.io/sync-wave: "22"
    destination:
      namespace: restic-rest
    source:
      path: components-infra/restic-rest-server/overlays/sakaar

  claude-admin:
    annotations:
      argocd.argoproj.io/sync-wave: "11"
    source:
      path: components-infra/claude-admin/base

  hermes-infra-agent:
    annotations:
      argocd.argoproj.io/sync-wave: "11"
    source:
      path: components-infra/hermes-infra-agent/base

  hermes-upgrade-agent:
    annotations:
      argocd.argoproj.io/sync-wave: "11"
    source:
      path: components-infra/hermes-upgrade-agent/base

  hermes-argocd-agent:
    annotations:
      argocd.argoproj.io/sync-wave: "11"
    source:
      path: components-infra/hermes-argocd-agent/base

  rbac:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: "11"
    source:
      path: components-infra/rbac/base

  openshift-oauth-htpasswd:
    annotations:
      argocd.argoproj.io/sync-wave: "3"
    destination:
      namespace: openshift-config
    source:
      path: components-infra/openshift-oauth-htpasswd/overlays/sakaar

  actions-runner-controller:
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    destination:
      namespace: actions-runner-system
    source:
      path: components-infra/actions-runner-controller/base

  gha-runners-shared:
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    destination:
      namespace: arc-runners
    source:
      path: components-infra/gha-runners-shared

  gha-runner-scale-set-palbuddy:
    annotations:
      argocd.argoproj.io/sync-wave: "3"
    destination:
      namespace: arc-runners
    source:
      path: components-infra/gha-runner-scale-set-palbuddy/base

  gha-runner-scale-set-tymeslot:
    annotations:
      argocd.argoproj.io/sync-wave: "3"
    destination:
      namespace: arc-runners
    source:
      path: components-infra/gha-runner-scale-set-tymeslot/base

  gha-runner-scale-set-taxbuddy:
    annotations:
      argocd.argoproj.io/sync-wave: "3"
    destination:
      namespace: arc-runners
    source:
      path: components-infra/gha-runner-scale-set-taxbuddy/base

  gha-runner-scale-set-devland:
    annotations:
      argocd.argoproj.io/sync-wave: "3"
    destination:
      namespace: arc-runners
    source:
      path: components-infra/gha-runner-scale-set-devland/base

  gha-runner-scale-set-recordbuddy:
    annotations:
      argocd.argoproj.io/sync-wave: "3"
    destination:
      namespace: arc-runners
    source:
      path: components-infra/gha-runner-scale-set-recordbuddy/base

  gha-runner-scale-set-devland-editor-agent:
    annotations:
      argocd.argoproj.io/sync-wave: "3"
    destination:
      namespace: arc-runners
    source:
      path: components-infra/gha-runner-scale-set-devland-editor-agent/base

  tailscale-operator:
    annotations:
      argocd.argoproj.io/sync-wave: "3"
    destination:
      namespace: tailscale
    source:
      path: components-infra/tailscale-operator/base
    syncOptions:
      - CreateNamespace=true
    extraFields: |
      ignoreDifferences:
        - group: ""
          kind: Service
          name: litellm-egress
          namespace: tailscale
          jsonPointers:
            - /spec/externalName

  devland:
    annotations:
      argocd.argoproj.io/sync-wave: "4"
    destination:
      namespace: devland
    source:
      path: components-apps/devland/base

  devland-editor-agent:
    annotations:
      argocd.argoproj.io/sync-wave: "4"
    destination:
      namespace: devland
    source:
      path: components-apps/devland-editor-agent/base

  registry:
    annotations:
      argocd.argoproj.io/sync-wave: "5"
    destination:
      namespace: openshift-image-registry
    source:
      path: components-infra/registry-sno/overlays/sakaar
