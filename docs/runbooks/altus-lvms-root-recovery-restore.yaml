# Restore the encrypted snapshot-derived artifact to a separate scratch Block PVC.
# Requires the root-safety support objects and a unique reviewed ARTIFACT.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowhere-root-recovery
  namespace: gb18-knowhere
  labels:
    lvms-migration-test: gate-b
    consistency: crash-consistent
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Block
  storageClassName: synology-iscsi-storage
  resources:
    requests:
      storage: 322122547200
---
apiVersion: v1
kind: Pod
metadata:
  name: knowhere-root-recovery-restore
  namespace: gb18-knowhere
  labels:
    lvms-migration-test: gate-b
    app: knowhere-root-recovery-restore
spec:
  restartPolicy: Never
  serviceAccountName: lvms-migration-helper
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 0
  containers:
    - name: qemu
      image: registry.redhat.io/container-native-virtualization/virt-launcher-rhel9@sha256:2131d3d24616971b92d7e986635673b6dc731da3d43cae46540882993d36596f
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command: ["/bin/bash", "-ec"]
      args:
        - |
          set -o pipefail
          umask 077
          test -b /dev/target
          ARTIFACT="B18-knowhere-root-safety-YYYYMMDDTHHMMSSZ"
          sha256sum -c "/backup/$ARTIFACT.qcow2.sha256"
          QCOW2_OPTS="driver=qcow2,file.driver=file,file.filename=/backup/$ARTIFACT.qcow2,encrypt.format=luks,encrypt.key-secret=rootkey"
          qemu-img check \
            --object secret,id=rootkey,file=/run/secrets/migration/root-luks.passphrase \
            --image-opts "$QCOW2_OPTS"
          qemu-img convert \
            --object secret,id=rootkey,file=/run/secrets/migration/root-luks.passphrase \
            -p --image-opts -O raw -S 4k "$QCOW2_OPTS" /dev/target
      volumeDevices:
        - name: target
          devicePath: /dev/target
      volumeMounts:
        - name: backup
          mountPath: /backup
        - name: encryption
          mountPath: /run/secrets/migration
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: target
      persistentVolumeClaim:
        claimName: knowhere-root-recovery
    - name: backup
      nfs:
        server: 10.10.10.40
        path: /volume1/pmb-backup/altus-lvms-migration
    - name: encryption
      secret:
        secretName: altus-lvms-knowhere-root-encryption
        defaultMode: 0400
        items:
          - key: passphrase
            path: root-luks.passphrase
    - name: tmp
      emptyDir: {}
