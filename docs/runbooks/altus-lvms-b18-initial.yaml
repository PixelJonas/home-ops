# B18 initial disposable resources. Apply once only after Gate A and B00-B17.
# Requires the retained gb18-knowhere-lan NAD. Do not change/reapply between legs.
apiVersion: v1
kind: Namespace
metadata:
  name: gb18-knowhere
  labels:
    lvms-migration-test: gate-b
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: knowhere-rootdisk
  namespace: gb18-knowhere
spec:
  source:
    registry:
      url: docker://quay.io/containerdisks/fedora@sha256:1217dcc8c58dbc3ca08e0323929b86f609506121adb01d0fd892232f2c0544f6
      pullMethod: node
  storage:
    accessModes:
      - ReadWriteOnce
    volumeMode: Block
    resources:
      requests:
        storage: 300Gi
    storageClassName: lvms-vg1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowhere-projects
  namespace: gb18-knowhere
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: lvms-vg1
  resources:
    requests:
      storage: "136579960013"
---
apiVersion: v1
kind: Secret
metadata:
  name: gb18-cloudinit
  namespace: gb18-knowhere
type: Opaque
stringData:
  networkData: |
    version: 2
    ethernets:
      enp1s0:
        dhcp4: true
        dhcp6: false
  userData: |
    #cloud-config
    hostname: gb18-knowhere-live
    manage_etc_hosts: true
    users:
      - default
    ssh_pwauth: false
    package_update: false
    packages:
      - python3
      - qemu-guest-agent
    mounts:
      - [ /dev/disk/by-id/virtio-projectsdisk, /mnt/projects, ext4, defaults, "0", "2" ]
    write_files:
      - path: /usr/local/sbin/gb18-writer
        owner: root:root
        permissions: "0755"
        content: |
          #!/usr/bin/python3
          import json
          import os
          import pathlib
          import sys
          import time

          path = pathlib.Path(sys.argv[1])
          boot_id = pathlib.Path("/proc/sys/kernel/random/boot_id").read_text().strip()
          sequence = 0

          with path.open("a", encoding="utf-8", buffering=1) as stream:
              while True:
                  started = time.monotonic()
                  sequence += 1
                  record = {
                      "sequence": sequence,
                      "boot_id": boot_id,
                      "monotonic_ns": time.monotonic_ns(),
                      "realtime_ns": time.time_ns(),
                  }
                  stream.write(json.dumps(record, separators=(",", ":")) + "\n")
                  stream.flush()
                  os.fsync(stream.fileno())
                  time.sleep(max(0.0, 1.0 - (time.monotonic() - started)))

      - path: /usr/local/sbin/gb18-probe
        owner: root:root
        permissions: "0755"
        content: |
          #!/usr/bin/python3
          import json
          import os
          import pathlib
          import socket
          import subprocess
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          ROOT_LOG = pathlib.Path("/var/lib/gb18/root.jsonl")
          PROJECTS_LOG = pathlib.Path("/mnt/projects/gb18-writer/projects.jsonl")

          def last_record(path):
              line = subprocess.check_output(["tail", "-n", "1", str(path)], text=True)
              return json.loads(line)

          def status():
              return {
                  "realtime_ns": time.time_ns(),
                  "boot_id": pathlib.Path("/proc/sys/kernel/random/boot_id").read_text().strip(),
                  "uptime_seconds": float(pathlib.Path("/proc/uptime").read_text().split()[0]),
                  "hostname": socket.gethostname(),
                  "projects_mounted": os.path.ismount("/mnt/projects"),
                  "projectsdisk_present": pathlib.Path("/dev/disk/by-id/virtio-projectsdisk").exists(),
                  "root_writer": last_record(ROOT_LOG),
                  "projects_writer": last_record(PROJECTS_LOG),
              }

          class Handler(BaseHTTPRequestHandler):
              def send_bytes(self, code, body, content_type):
                  self.send_response(code)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  try:
                      if self.path == "/status":
                          body = json.dumps(status(), separators=(",", ":")).encode() + b"\n"
                          self.send_bytes(200, body, "application/json")
                      elif self.path == "/root.jsonl":
                          self.send_bytes(200, ROOT_LOG.read_bytes(), "application/x-ndjson")
                      elif self.path == "/projects.jsonl":
                          self.send_bytes(200, PROJECTS_LOG.read_bytes(), "application/x-ndjson")
                      else:
                          self.send_error(404)
                  except Exception as error:
                      self.send_error(503, str(error))

              def log_message(self, *args):
                  pass

          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

      - path: /etc/systemd/system/gb18-root-writer.service
        owner: root:root
        permissions: "0644"
        content: |
          [Unit]
          Description=GB18 fsyncing root-disk sequence writer
          After=local-fs.target

          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/gb18-writer /var/lib/gb18/root.jsonl
          Restart=no

          [Install]
          WantedBy=multi-user.target

      - path: /etc/systemd/system/gb18-projects-writer.service
        owner: root:root
        permissions: "0644"
        content: |
          [Unit]
          Description=GB18 fsyncing projects-disk sequence writer
          Requires=mnt-projects.mount
          After=mnt-projects.mount

          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/gb18-writer /mnt/projects/gb18-writer/projects.jsonl
          Restart=no

          [Install]
          WantedBy=multi-user.target

      - path: /etc/systemd/system/gb18-probe.service
        owner: root:root
        permissions: "0644"
        content: |
          [Unit]
          Description=GB18 non-secret guest status and writer-log endpoint
          After=network-online.target gb18-root-writer.service gb18-projects-writer.service
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/gb18-probe
          Restart=no

          [Install]
          WantedBy=multi-user.target

    runcmd:
      - mkdir -p /var/lib/gb18 /mnt/projects/gb18-writer
      - systemctl disable --now sshd.service
      - systemctl enable --now qemu-guest-agent.service
      - systemctl daemon-reload
      - systemctl enable --now gb18-root-writer.service gb18-projects-writer.service
      - systemctl enable --now gb18-probe.service
      - |
        if command -v firewall-cmd >/dev/null 2>&1; then
          firewall-cmd --permanent --add-port=8080/tcp
          firewall-cmd --reload
        fi
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: knowhere-live-migration-test
  namespace: gb18-knowhere
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: knowhere-live-migration-test
        lvms-migration-test: gate-b
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
          limits:
            memory: 4Gi
        firmware:
          uuid: b18b18b1-8b18-4b18-8b18-b18b18b18b18
        devices:
          rng: {}
          disks:
            - name: rootdisk
              disk:
                bus: virtio
              serial: gb18rootdisk
            - name: projectsdisk
              disk:
                bus: virtio
              serial: projectsdisk
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: lan
              bridge: {}
              macAddress: "02:42:0a:18:00:18"
      networks:
        - name: lan
          multus:
            networkName: gb18-knowhere-lan
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: knowhere-rootdisk
        - name: projectsdisk
          persistentVolumeClaim:
            claimName: knowhere-projects
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: gb18-cloudinit
            networkDataSecretRef:
              name: gb18-cloudinit
