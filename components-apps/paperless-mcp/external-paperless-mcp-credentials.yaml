apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-mcp-credentials
  namespace: paperless-mcp
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: paperless-mcp-credentials
  data:
    # Token of the dedicated view-only Paperless user (never an admin token).
    - secretKey: PAPERLESS_MCP_API_TOKEN
      remoteRef:
        key: PAPERLESS_MCP_API_TOKEN
    # Public https URL of this MCP (external-url + OAuth callback base).
    - secretKey: PAPERLESS_MCP_EXTERNAL_URL
      remoteRef:
        key: PAPERLESS_MCP_EXTERNAL_URL
    # Public Authelia discovery URL (https://<sso-host>/.well-known/openid-configuration).
    - secretKey: PAPERLESS_MCP_OIDC_CONFIGURATION_URL
      remoteRef:
        key: PAPERLESS_MCP_OIDC_CONFIGURATION_URL
    - secretKey: PAPERLESS_MCP_OIDC_CLIENT_ID
      remoteRef:
        key: PAPERLESS_MCP_OIDC_CLIENT_ID
    - secretKey: PAPERLESS_MCP_OIDC_CLIENT_SECRET
      remoteRef:
        key: PAPERLESS_MCP_OIDC_CLIENT_SECRET
    # Comma-separated emails allowed through (matched against userinfo /email).
    - secretKey: PAPERLESS_MCP_ALLOWED_USERS
      remoteRef:
        key: PAPERLESS_MCP_ALLOWED_USERS
    # Public Paperless URL used for document links in tool output.
    - secretKey: PAPERLESS_MCP_PUBLIC_URL
      remoteRef:
        key: PAPERLESS_MCP_PUBLIC_URL
