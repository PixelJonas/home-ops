apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-db
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  instances: 1
  enablePDB: false

  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: paperless-db-paperless-secret

  storage:
    size: 20Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Loosen probe timeouts so transient node contention on Altus (CPU/IO
  # pressure from other workloads) doesn't trip the liveness probe and
  # force a full postgres pod restart. Defaults are timeoutSeconds: 5,
  # failureThreshold derived from livenessProbeTimeout=30s (~3 failures).
  probes:
    liveness:
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 5
