apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-paperless-workflows-credentials
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: paperless-workflows-credentials
  data:
    # Shared, referenced-not-created (ingestbuddy#7 per infra-ops#61): the
    # same Paperless API token ingestbuddy#6 already wired into its own
    # ingestbuddy-credentials Secret. Used here to authenticate the
    # paperless-workflows-apply Job's calls to Paperless's own REST API
    # (tag + workflow upsert) -- never create or overwrite this key.
    - secretKey: api-token
      remoteRef:
        key: PAPERLESS_API_TOKEN
    # The shared secret ingestbuddy's webhook receiver
    # (pipeline_api.webhooks, ingestbuddy#5) compares against
    # `x-paperless-webhook-secret` via hmac.compare_digest. Also already
    # created by ingestbuddy#6 (ingestbuddy-credentials' PAPERLESS_WEBHOOK_SECRET
    # key, same Doppler value) -- injected here too because the live
    # Workflow object's webhook action header has to be set to this value
    # at apply time (Paperless has no mechanism to reference a Secret from
    # a Workflow, so the real value has to be written into the object via
    # the API -- see workflows/pipeline-intake.workflow.json's
    # __PAPERLESS_WEBHOOK_SECRET__ placeholder and apply.py).
    - secretKey: webhook-secret
      remoteRef:
        key: INGESTBUDDY_PAPERLESS_WEBHOOK_SECRET
