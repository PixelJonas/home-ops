apiVersion: apps/v1
kind: Deployment
metadata:
  name: devland-editor-agent
  namespace: devland
  labels:
    app.kubernetes.io/name: devland-editor-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devland-editor-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devland-editor-agent
    spec:
      # No explicit fsGroup: this cluster's restricted-v2/v3 SCCs reject
      # fsGroup: 0 outright ("0 is not an allowed group"). Leaving
      # securityContext unset lets OpenShift auto-assign a consistent
      # (runAsUser, fsGroup) pair from this namespace's allowed ranges —
      # the auto-assigned fsGroup is applied as a supplemental group to the
      # container process AND used to chown the freshly-mounted PVC, so
      # write access works regardless of the image's own baked-in UID/GID.
      imagePullSecrets:
        - name: devland-editor-agent-ghcr-pull-secret
      # Pins litellm.app.janz.digital to the Tailscale egress ProxyGroup's
      # backing Service ClusterIP (tailscale namespace, "litellm-egress"
      # Service / egress-proxies ProxyGroup) instead of relying on DNS —
      # Sakaar's pod network has no path to resolve or reach this hostname
      # otherwise. This IP is the ClusterIP of the operator-managed Service
      # tailscale.com generates for the ProxyGroup and is stable as long as
      # that Service object isn't deleted/recreated; verify with
      # `oc get svc -n tailscale -l tailscale.com/parent-resource=litellm-egress`
      # if this ever needs re-pinning.
      hostAliases:
        - ip: "172.30.147.240"
          hostnames:
            - "litellm.app.janz.digital"
      containers:
        - name: app
          image: ghcr.io/pixeljonas/devland-editor-agent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DEVLAND_REMOTE_URL
              value: https://github.com/PixelJonas/devland-2027.git
            - name: CHECKOUT_ROOT
              value: /data/checkouts
            # SQLite conversation-history store (replaces the Agent SDK's own
            # file-based session store, removed along with the SDK itself —
            # see devland-editor-agent's LiteLLM migration plan). Its own
            # dedicated PVC (history-db-pvc.yaml), same rationale as the old
            # claude-config PVC it replaces: kept off the checkouts volume so
            # it isn't visible as a stray child directory there.
            - name: HISTORY_DB_PATH
              value: /data/history/history.db
            # LiteLLM OpenAI-compatible endpoint, replacing the direct
            # Vertex-native Claude auth this app used to hold its own GCP
            # credential for. Model swappable via LITELLM_MODEL_NAME alone —
            # a future self-hosted Qwen model needs no app code change, just
            # a LiteLLM model registration and this env var. See
            # externalsecret.yaml for LITELLM_API_KEY.
            #
            # Reaches LiteLLM (on the separate Altus cluster) via the
            # tailnet: Sakaar pods have no route to Altus's *.janz.digital
            # DNS or network directly, only through the Tailscale egress
            # ProxyGroup added in home-ops#227/#228, which forwards to the
            # Synology's Caddy reverse proxy over the tailnet. The hostname
            # here must stay the real Caddy-facing one (litellm.app.janz.digital,
            # not litellm.apps.altus.janz.digital) since hostAliases below
            # pins it to the egress Service's ClusterIP, and Caddy's TLS/Host
            # routing depends on seeing that exact SNI/Host.
            - name: LITELLM_BASE_URL
              value: https://litellm.app.janz.digital/v1
            - name: LITELLM_MODEL_NAME
              value: claude-sonnet-5
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-secrets
                  key: litellm_api_key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-secrets
                  key: github_token
            - name: NTFY_URL
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-secrets
                  key: ntfy_url
            - name: UPLOADS_ROOT
              value: /data/uploads
            # Mastra agent loop (see devland-editor-agent's Mastra migration
            # plan, docs/superpowers/plans/2026-08-03-mastra-migration.md).
            # USE_MASTRA_AGENT gates EditorAgentSession (default, unset)
            # vs. MastraEditorAgentSession — flipping it to "true" here
            # switches all editor traffic to the Mastra-based loop.
            # MASTRA_STORAGE_URL backs Mastra's Memory/Observational Memory
            # via the devland-editor-agent-db CNPG cluster (postgresql-
            # database.yaml) — composed from the CNPG-generated read-write
            # Service DNS name (<cluster-name>-rw, same namespace, no FQDN
            # needed) and the ExternalSecret-provisioned password. The
            # generated password (see docs/mastra-evaluation.md's
            # "Infrastructure placement") deliberately excludes
            # =, +, / (openssl base64 output stripped of those chars) so it
            # embeds directly in this URI without percent-encoding.
            - name: MASTRA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-db-devland-secret
                  key: password
            - name: MASTRA_STORAGE_URL
              value: postgres://devland_editor_agent:$(MASTRA_DB_PASSWORD)@devland-editor-agent-db-rw:5432/devland_editor_agent
            - name: USE_MASTRA_AGENT
              value: "true"
            # The runtime image's npm cache ($HOME/.npm) is populated at
            # build time by the image's own build-stage UID and is only
            # owner-writable (not group-writable), while this Deployment
            # sets no fsGroup/runAsUser so OpenShift assigns a different
            # arbitrary UID per pod — every GitWorkspace.ensureDependencies()
            # `npm ci` call (i.e. every chat turn against an uncached
            # checkout) failed with EACCES writing into that stale cache.
            # Redirecting the cache into the container's writable ephemeral
            # storage sidesteps the ownership mismatch entirely; losing the
            # cache across pod restarts only costs one slower `npm ci`.
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm-cache
          volumeMounts:
            - name: checkouts
              mountPath: /data/checkouts
            - name: history-db
              mountPath: /data/history
            - name: uploads
              mountPath: /data/uploads
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: checkouts
          persistentVolumeClaim:
            claimName: devland-editor-agent-checkouts
        - name: history-db
          persistentVolumeClaim:
            claimName: devland-editor-agent-history-db
        - name: uploads
          persistentVolumeClaim:
            claimName: devland-uploads
