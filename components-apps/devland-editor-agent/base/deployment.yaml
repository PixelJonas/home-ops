apiVersion: apps/v1
kind: Deployment
metadata:
  name: devland-editor-agent
  namespace: devland-editor-agent
  labels:
    app.kubernetes.io/name: devland-editor-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devland-editor-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devland-editor-agent
    spec:
      # No explicit fsGroup: this cluster's restricted-v2/v3 SCCs reject
      # fsGroup: 0 outright ("0 is not an allowed group"). Leaving
      # securityContext unset lets OpenShift auto-assign a consistent
      # (runAsUser, fsGroup) pair from this namespace's allowed ranges —
      # the auto-assigned fsGroup is applied as a supplemental group to the
      # container process AND used to chown the freshly-mounted PVC, so
      # write access works regardless of the image's own baked-in UID/GID.
      imagePullSecrets:
        - name: devland-editor-agent-ghcr-pull-secret
      containers:
        - name: app
          image: ghcr.io/pixeljonas/devland-editor-agent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DEVLAND_REMOTE_URL
              value: https://github.com/PixelJonas/devland-2027.git
            - name: CHECKOUT_ROOT
              value: /data/checkouts
            # Vertex-native Claude auth, reusing litellm's own GCP project —
            # no separate Anthropic API key. See externalsecret.yaml.
            - name: CLAUDE_CODE_USE_VERTEX
              value: "1"
            - name: ANTHROPIC_VERTEX_PROJECT_ID
              value: itpc-gcp-global-revenue-claude
            - name: CLOUD_ML_REGION
              value: global
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/gcp/credentials.json
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-secrets
                  key: github_token
            - name: NTFY_URL
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-secrets
                  key: ntfy_url
          volumeMounts:
            - name: checkouts
              mountPath: /data/checkouts
            - name: gcp-credentials
              mountPath: /secrets/gcp
              readOnly: true
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: checkouts
          persistentVolumeClaim:
            claimName: devland-editor-agent-checkouts
        - name: gcp-credentials
          secret:
            secretName: devland-editor-agent-secrets
            items:
              - key: gcp_credentials.json
                path: credentials.json
