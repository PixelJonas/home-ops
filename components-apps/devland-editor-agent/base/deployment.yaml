apiVersion: apps/v1
kind: Deployment
metadata:
  name: devland-editor-agent
  namespace: devland-editor-agent
  labels:
    app.kubernetes.io/name: devland-editor-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devland-editor-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devland-editor-agent
    spec:
      containers:
        - name: app
          image: ghcr.io/pixeljonas/devland-editor-agent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DEVLAND_REMOTE_URL
              value: https://github.com/PixelJonas/devland-2027.git
            - name: CHECKOUT_ROOT
              value: /data/checkouts
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-secrets
                  key: anthropic_api_key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-secrets
                  key: github_token
            - name: NTFY_URL
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-secrets
                  key: ntfy_url
          volumeMounts:
            - name: checkouts
              mountPath: /data/checkouts
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: checkouts
          persistentVolumeClaim:
            claimName: devland-editor-agent-checkouts
