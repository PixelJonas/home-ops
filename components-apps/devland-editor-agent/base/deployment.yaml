apiVersion: apps/v1
kind: Deployment
metadata:
  name: devland-editor-agent
  namespace: devland
  labels:
    app.kubernetes.io/name: devland-editor-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devland-editor-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devland-editor-agent
    spec:
      # No explicit fsGroup: this cluster's restricted-v2/v3 SCCs reject
      # fsGroup: 0 outright ("0 is not an allowed group"). Leaving
      # securityContext unset lets OpenShift auto-assign a consistent
      # (runAsUser, fsGroup) pair from this namespace's allowed ranges —
      # the auto-assigned fsGroup is applied as a supplemental group to the
      # container process AND used to chown the freshly-mounted PVC, so
      # write access works regardless of the image's own baked-in UID/GID.
      imagePullSecrets:
        - name: devland-editor-agent-ghcr-pull-secret
      containers:
        - name: app
          image: ghcr.io/pixeljonas/devland-editor-agent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DEVLAND_REMOTE_URL
              value: https://github.com/PixelJonas/devland-2027.git
            - name: CHECKOUT_ROOT
              value: /data/checkouts
            # SQLite conversation-history store (replaces the Agent SDK's own
            # file-based session store, removed along with the SDK itself —
            # see devland-editor-agent's LiteLLM migration plan). Its own
            # dedicated PVC (history-db-pvc.yaml), same rationale as the old
            # claude-config PVC it replaces: kept off the checkouts volume so
            # it isn't visible as a stray child directory there.
            - name: HISTORY_DB_PATH
              value: /data/history/history.db
            # LiteLLM OpenAI-compatible endpoint, replacing the direct
            # Vertex-native Claude auth this app used to hold its own GCP
            # credential for. Model swappable via LITELLM_MODEL_NAME alone —
            # a future self-hosted Qwen model needs no app code change, just
            # a LiteLLM model registration and this env var. See
            # externalsecret.yaml for LITELLM_API_KEY.
            #
            # MUST be the external URL, not litellm-app.litellm.svc's
            # in-cluster DNS: devland-editor-agent runs on the Sakaar
            # cluster, while litellm-app runs on the separate Altus cluster
            # — in-cluster Kubernetes service DNS never resolves across
            # clusters. (Caught post-merge: the in-cluster form was wrongly
            # assumed from taxbuddy-hermes's config, which — unlike this
            # app — actually is colocated with litellm-app on Altus.)
            - name: LITELLM_BASE_URL
              value: https://litellm.apps.altus.janz.digital/v1
            - name: LITELLM_MODEL_NAME
              value: claude-sonnet-5
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-secrets
                  key: litellm_api_key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-secrets
                  key: github_token
            - name: NTFY_URL
              valueFrom:
                secretKeyRef:
                  name: devland-editor-agent-secrets
                  key: ntfy_url
            - name: UPLOADS_ROOT
              value: /data/uploads
          volumeMounts:
            - name: checkouts
              mountPath: /data/checkouts
            - name: history-db
              mountPath: /data/history
            - name: uploads
              mountPath: /data/uploads
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: checkouts
          persistentVolumeClaim:
            claimName: devland-editor-agent-checkouts
        - name: history-db
          persistentVolumeClaim:
            claimName: devland-editor-agent-history-db
        - name: uploads
          persistentVolumeClaim:
            claimName: devland-uploads
