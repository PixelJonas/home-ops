apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devland-editor-agent-ghcr-pull-secret
  namespace: devland-editor-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: devland-editor-agent-ghcr-pull-secret
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"PixelJonas","password":"{{ .token }}","auth":"{{ printf "PixelJonas:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: DEVLAND_EDITOR_AGENT_GITHUB_TOKEN
