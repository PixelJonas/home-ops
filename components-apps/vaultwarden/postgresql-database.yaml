apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vaultwarden-db
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  instances: 1
  enablePDB: false

  superuserSecret:
    name: vaultwarden-db-postgres-secret

  bootstrap:
    initdb:
      database: vaultwarden
      owner: vaultwarden
      secret:
        name: vaultwarden-db-vaultwarden-secret

  storage:
    size: 2Gi

  # Loosen probe timeouts so transient node contention on Altus (CPU/IO
  # pressure from other workloads) doesn't trip the liveness probe and
  # force a full postgres pod restart. Defaults are timeoutSeconds: 5,
  # failureThreshold derived from livenessProbeTimeout=30s (~3 failures).
  probes:
    liveness:
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 5
