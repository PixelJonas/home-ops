apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "111"
  name: docling-serve-app
  namespace: openshift-gitops
spec:
  destination:
    namespace: docling-serve
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.2.1
    helm:
      values: |-
        controllers:
          docling-serve:
            containers:
              docling-serve:
                image:
                  # NOTE: the CPU variant is a separate GHCR repository
                  # (docling-serve-cpu), not a "-cpu" tag suffix on
                  # docling-serve as originally assumed — see Task 1 PR
                  # description for details.
                  repository: ghcr.io/docling-project/docling-serve-cpu
                  digest: "sha256:693aa883e999894ae2efdf7acd89d8fc14abddfc0af3b9fcdd42b7c1b23e1d25"
                  pullPolicy: IfNotPresent
                env:
                  DOCLING_SERVE_ENABLE_UI: "false"
                  # The image's HF cache ($HOME/.cache/huggingface) is owned
                  # by the build user and not group-writable, so under
                  # OpenShift's arbitrary UID the HybridChunker can't
                  # download its tokenizer (BAAI/bge-m3): docling-jobkit
                  # logs a PermissionError and returns success with zero
                  # chunks (ingestbuddy#8 canary). Point the HF cache at the
                  # writable docling-cache PVC instead. Docling's own models
                  # stay baked in via DOCLING_SERVE_ARTIFACTS_PATH.
                  HF_HOME: /.cache/huggingface
                  DOCLING_SERVE_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: docling-serve-credentials
                        key: DOCLING_SERVE_API_KEY
                resources:
                  # ingestbuddy#40: a 151-page A4 statics document (paperless
                  # 422, text layer, accurate tables) never finished at 2
                  # CPU / 8Gi. Over 2026-10-04 20:30Z..10-05 04:00Z the
                  # container sat at its 2-CPU limit with 90% of CFS periods
                  # throttled and working set at 7-8Gi (8.00Gi peak = limit);
                  # every docling task exceeded ingestbuddy's 1500s per-task
                  # timeout. The image sets OMP_NUM_THREADS=4 and docling's
                  # threaded pipeline runs layout + table stages in parallel,
                  # so 6 CPU lets one conversion run unthrottled. Idle working
                  # set is ~4.8Gi (models loaded in both orchestrator workers).
                  requests:
                    cpu: 2000m
                    memory: 6Gi
                  limits:
                    cpu: 6000m
                    # Bumped from 4Gi: OOMKilled on large/complex documents
                    # (e.g. an 18-page contract, a 5.4MB scanned letter)
                    # during tax-agent P1-T07's 20-document live
                    # verification — pod memory climbed to ~3.9Gi before
                    # each kill. Node has ample headroom (93Gi allocatable).
                    # Bumped 8Gi -> 12Gi for ingestbuddy#40 (see above): the
                    # 151-page conversion peaked at the 8Gi limit.
                    memory: 12Gi
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 5001
                      initialDelaySeconds: 30
                      periodSeconds: 15
                      # The 1s default timed out while a conversion pinned
                      # the CPU limit: 4 liveness failures around
                      # 2026-10-05T02:37Z got the container SIGKILLed (exit
                      # 137, not OOM) mid-conversion (ingestbuddy#40).
                      timeoutSeconds: 5
                      failureThreshold: 6
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 5001
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5

        service:
          docling-serve:
            controller: docling-serve
            ports:
              http:
                port: 5001

        persistence:
          docling-cache:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: lvms-vg1
            size: 5Gi
            advancedMounts:
              docling-serve:
                docling-serve:
                  - path: /.cache

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
