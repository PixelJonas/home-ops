apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: library-
namespace: immich

resources:
  - ../../../../templates/volsync/rest

patches:
  - target:
      group: volsync.backube
      version: v1alpha1
      kind: ReplicationSource
      name: backup
    path: local.yaml

  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: external-restic-config
    path: local-secret.yaml

  # Backup slot 05:07 UTC (non-iSCSI grid), see docs/volsync-schedules.md.
  - target:
      group: volsync.backube
      version: v1alpha1
      kind: ReplicationSource
      name: backup
    patch: |-
      - op: replace
        path: /spec/trigger/schedule
        value: "7 5 * * *"
