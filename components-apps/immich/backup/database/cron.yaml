- op: replace
  path: /spec/jobTemplate/spec/template/spec/volumes/0/persistentVolumeClaim/claimName
  value: database-syno-db-backup

- op: replace
  path: /spec/jobTemplate/spec/template/spec/containers/0/env
  value:
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: immich-credentials
          key: user
    - name: POSTGRES_POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: immich-credentials
          key: password

- op: replace
  path: /spec/jobTemplate/spec/template/spec/containers/0/args
  value:
    - |-
      set -e

      echo -----------------------------------
      echo "Backing up $POSTGRES_USER database"
      # Dump to a temp file and only replace backup.sql on success: a failed
      # dump used to truncate the last good backup.sql, and VolSync then backed
      # up a 0-byte file (immich, 2026-09-28 03:00 while the app was paused).
      kubectl exec deploy/immich-app-database -c database -- /bin/bash -c "PGPASSWORD=$POSTGRES_POSTGRES_PASSWORD pg_dumpall -U postgres" > /backup/backup.sql.tmp
      test -s /backup/backup.sql.tmp
      mv -f /backup/backup.sql.tmp /backup/backup.sql
      echo -----------------------------------
        ls -lah /backup
      echo -----------------------------------
