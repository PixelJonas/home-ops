# Suspended 2026-09-28: immich-app-database is scaled to 0 (see immich-chart.yaml
# comment) while Altus is resource-constrained ahead of a second node -- with no
# database pod to exec into, this job was failing every night and dragging the
# immich ArgoCD Application into Degraded. Un-suspend when replicas go back to 1.
- op: add
  path: /spec/suspend
  value: true

- op: replace
  path: /spec/jobTemplate/spec/template/spec/volumes/0/persistentVolumeClaim/claimName
  value: database-syno-db-backup

- op: replace
  path: /spec/jobTemplate/spec/template/spec/containers/0/env
  value:
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: immich-credentials
          key: user
    - name: POSTGRES_POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: immich-credentials
          key: password

- op: replace
  path: /spec/jobTemplate/spec/template/spec/containers/0/args
  value:
    - |-
      set -e

      echo -----------------------------------
      echo "Backing up $POSTGRES_USER database"
      kubectl exec deploy/immich-app-database -c database -- /bin/bash -c "PGPASSWORD=$POSTGRES_POSTGRES_PASSWORD pg_dumpall -U postgres" > /backup/backup.sql
      echo -----------------------------------
        ls -lah /backup
      echo -----------------------------------
