apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-app
  annotations:
    argocd.argoproj.io/sync-wave: "51"
spec:
  destination:
    namespace: immich
    server: https://kubernetes.default.svc
  project: cluster-apps
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.2.1
    helm:
      values: |-

        controllers:
          server:
            # Scaled to 0 2026-09-26: temporary node-capacity relief while
            # Altus (single-node) is thermally/resource constrained and a
            # second node is being added -- not needed for day-to-day UX
            # for a few days. Scale replicas back to 1 to resume; data on
            # existingClaim PVCs is untouched.
            replicas: 0
            containers:
              server:
                image:
                  repository: ghcr.io/immich-app/immich-server
                  tag: v3.2.2
                  pullPolicy: IfNotPresent
                env:
                  DB_DATABASE_NAME: immich
                  IMMICH_IGNORE_MOUNT_CHECK_ERRORS: true
                  REDIS_HOSTNAME: immich-app-redis.immich.svc.cluster.local
                  DB_HOSTNAME: immich-app-database.immich.svc.cluster.local
                  DB_USERNAME:
                    valueFrom:
                      secretKeyRef:
                        name: immich-credentials
                        key: user
                  DB_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-credentials
                        key: password
          machine-learning:
            replicas: 0
            containers:
              machine-learning:
                image:
                  repository: ghcr.io/immich-app/immich-machine-learning
                  tag: v3.1.0
                  pullPolicy: IfNotPresent
                env:
                  REDIS_HOSTNAME: immich-app-redis.immich.svc.cluster.local
          redis:
            replicas: 0
            containers:
              redis:
                image:
                  repository: ghcr.io/valkey-io/valkey
                  tag: 9.2
                  pullPolicy: IfNotPresent
          database:
            replicas: 0
            containers:
              database:
                image:
                  repository: ghcr.io/immich-app/postgres
                  tag: 17-vectorchord0.3.0-pgvectors0.3.0
                  pullPolicy: IfNotPresent
                env:
                  POSTGRES_DB: immich
                  POSTGRES_INITDB_ARGS: '--data-checksums'
                  POSTGRES_USER:
                    valueFrom:
                      secretKeyRef:
                        name: immich-credentials
                        key: user
                  POSTGRES_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-credentials
                        key: password

        service:
          database:
            controller: database
            ports:
              http:
                port: 5432
          server:
            controller: server
            ports:
              http:
                port: 2283
          redis:
            controller: redis
            ports:
              http:
                port: 6379
          machine-learning:
            controller: machine-learning
            ports:
              http:
                port: 3003

        ingress:
          immich:
            enabled: true
            className: openshift-default
            annotations:
              route.openshift.io/termination: "edge"
            hosts:
              - host: immich.apps.altus.janz.digital
                paths:
                  - path: /
                    service:
                      identifier: server
                      port: http


        persistence:
          library:
            enabled: true
            advancedMounts:
              server:
                server:
                  - path: /data
            existingClaim: immich-app-library
          cache:
            enabled: true
            globalMounts:
              - path: /cache
            existingClaim: immich-app-cache
          database:
            enabled: true
            globalMounts:
              - path: /var/lib/postgresql/data
            accessMode: ReadWriteOnce
            storageClass: lvms-vg1
            size: 20Gi

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
