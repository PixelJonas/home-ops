apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actual-budget-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: actual-budget
    server: "https://kubernetes.default.svc"
  project: cluster-apps
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.1.0
    helm:
      values: |-

        defaultPodOptions:
          securityContext:
            # The actual-server image creates user `actual` (UID/GID 1001)
            # and chowns /data to it, but has no USER directive. Pin the
            # UID/GID here (anyuid SCC granted via anyuid-rolebinding.yaml)
            # so the PVC stays writable.
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: "OnRootMismatch"

        controllers:
          actual:
            containers:
              actual:
                image:
                  repository: actualbudget/actual-server
                  tag: 26.9.0@sha256:552beab3dec8c93d46b8b9245612d63c3f123b8a45063a474f53e229b17621d3
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                resources:
                  requests:
                    cpu: 10m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 5006
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 5006
                      initialDelaySeconds: 5
                      periodSeconds: 10

        service:
          actual:
            controller: actual
            ports:
              http:
                port: 5006

        ingress:
          actual:
            className: openshift-default
            annotations:
              route.openshift.io/termination: "edge"
              # First budget download on a new client replays the whole
              # change log, and bank-sync setup uses server-side
              # long-polling — both can exceed the default 30s Route
              # timeout (same class of issue as the eb-spike 504s, see
              # taxbuddy docs/spikes/p0-banking.md).
              haproxy.router.openshift.io/timeout: 300s
            hosts:
              - host: actual.apps.altus.janz.digital
                paths:
                  - path: /
                    service:
                      identifier: actual
                      port: http

        persistence:
          data:
            # Explicit suffix so the PVC is `actual-budget-app-data` —
            # without it app-template v5 names a lone PVC after the release
            # (`actual-budget-app`), which would NOT match the volsync
            # backup sourcePVC (verified via helm template against
            # app-template 5.1.0).
            suffix: data
            storageClass: lvms-vg1
            accessMode: ReadWriteOnce
            globalMounts:
              - path: /data
            size: 5Gi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
