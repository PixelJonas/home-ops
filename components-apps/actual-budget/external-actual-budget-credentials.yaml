apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-actual-budget-credentials
  namespace: actual-budget
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: actual-budget-credentials
  data:
    # Server login password. NOT consumable via env/config (Actual has no
    # ACTUAL_PASSWORD setting — the password is set once via the UI on first
    # boot and stored hashed in server-files/account.sqlite). Provisioned
    # here as the single source of truth; the owner sets the UI password to
    # this value, and later API integrations (matching engine via
    # @actual-app/api / actualpy) read it from this Secret.
    - secretKey: ACTUAL_BUDGET_PASSWORD
      remoteRef:
        key: ACTUAL_BUDGET_PASSWORD
    # Enable Banking application credentials from taxbuddy P0-T02 (App ID
    # 5dc31083-c482-40fd-aea9-039d76d03765). Not mounted into the pod — the
    # native bank-sync setup is a UI flow (paste App ID, upload RSA key
    # file). Provisioned in-namespace for later use by automated bank-sync
    # tooling.
    - secretKey: EB_APP_ID
      remoteRef:
        key: TAXBUDDY_EB_APP_ID
    - secretKey: EB_PRIVATE_KEY
      remoteRef:
        key: TAXBUDDY_EB_PRIVATE_KEY
