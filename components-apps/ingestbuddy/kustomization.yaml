apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - anyuid-rolebinding.yaml
  - external-ingestbuddy-credentials.yaml
  - external-ingestbuddy-db.yaml
  - external-ingestbuddy-db-connection.yaml
  - external-ingestbuddy-ghcr-pull.yaml
  - migration-sa.yaml
  - migration-job.yaml
  - postgresql-database.yaml
  - ingestbuddy-app.yaml
  - backup
  # networkpolicy.yaml intentionally NOT included, matching
  # components-apps/taxbuddy/kustomization.yaml — see tax-agent's ADR-007:
  # OVN-Kubernetes on this cluster doesn't reliably allow NetworkPolicy
  # egress to the Kubernetes API server. No other app in this repo has one
  # either.
