apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - anyuid-rolebinding.yaml
  - external-ingestbuddy-credentials.yaml
  - external-ingestbuddy-db.yaml
  - external-ingestbuddy-db-connection.yaml
  - external-ingestbuddy-ghcr-pull.yaml
  - migration-sa.yaml
  - migration-job.yaml
  - postgresql-database.yaml
  - ingestbuddy-inbox-pvc.yaml
  - ingestbuddy-app.yaml
  - servicemonitor.yaml
  - backup
  # Ingress only. There are no egress rules, matching
  # components-apps/taxbuddy/kustomization.yaml (tax-agent's ADR-007:
  # OVN-Kubernetes on this cluster doesn't reliably allow NetworkPolicy
  # egress to the Kubernetes API server).
  - networkpolicy.yaml

configMapGenerator:
  # ingestbuddy#63 D4: the owner's config, out of the image. The name has no
  # hash suffix because ingestbuddy-app.yaml references it from inside the
  # Application's helm values, which kustomize can't rewrite. So an edit
  # doesn't roll the pods: restart api and worker after it syncs (README).
  - name: ingestbuddy-config
    namespace: ingestbuddy
    files:
      - ingestbuddy.yaml=config/ingestbuddy.yaml
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "30"
