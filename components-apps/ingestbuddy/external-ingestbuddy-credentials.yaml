apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-ingestbuddy-credentials
  namespace: ingestbuddy
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: ingestbuddy-credentials
  data:
    # Shared, referenced-not-duplicated (infra-ops#61): the same Paperless
    # API token TAXBUDDY_PAPERLESS_TOKEN currently holds — copied into this
    # app-neutral key by #6 so neither app owns the other's copy. taxbuddy
    # migrates its own ExternalSecret to reference this key at cutover
    # (#9); TAXBUDDY_PAPERLESS_TOKEN retires then.
    - secretKey: PAPERLESS_API_TOKEN
      remoteRef:
        key: PAPERLESS_API_TOKEN
    - secretKey: PAPERLESS_WEBHOOK_SECRET
      remoteRef:
        key: INGESTBUDDY_PAPERLESS_WEBHOOK_SECRET
    # Not actually sensitive (an edge-route hostname), but it's an
    # *.apps.altus.janz.digital URL, not an in-cluster one — per the
    # repo's Doppler-vs-inline convention (docs/adding-apps.md; also see
    # taxbuddy's own TAXBUDDY_PAPERLESS_URL), external hostnames live in
    # Doppler while in-cluster Service DNS names go inline in
    # ingestbuddy-app.yaml. Used only to build human-clickable doc links
    # (ingest_core.sinks.taxbuddy.TaxbuddySink's doc_url) — separate from
    # PAPERLESS_API_URL, which is the in-cluster address actually used for
    # API calls.
    - secretKey: PAPERLESS_PUBLIC_URL
      remoteRef:
        key: INGESTBUDDY_PAPERLESS_PUBLIC_URL
    - secretKey: DOCLING_SERVE_API_KEY
      remoteRef:
        key: INGESTBUDDY_DOCLING_SERVE_API_KEY
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: INGESTBUDDY_LITELLM_KEY
    # Shared, referenced-not-duplicated: the single QDrant instance's one
    # API key (components-apps/qdrant), not an ingestbuddy-owned secret.
    - secretKey: QDRANT_API_KEY
      remoteRef:
        key: QDRANT_API_KEY
    # Outbound auth for ingest_core.sinks.taxbuddy.TaxbuddySink's
    # X-Ingestbuddy-Signature header — taxbuddy's own intake endpoint
    # (taxbuddy#109) is not built yet, so there is nothing on the taxbuddy
    # side consuming this value today. Generated fresh by #6 under a
    # taxbuddy-side-convention name (TAXBUDDY_<source>_WEBHOOK_SECRET,
    # matching TAXBUDDY_PAPERLESS_WEBHOOK_SECRET) so whoever implements
    # #109 finds and reuses it rather than minting a second, mismatched
    # value. See ingestbuddy-app.yaml's TAXBUDDY_INTAKE_URL comment for the
    # matching provisional-URL half of this.
    - secretKey: TAXBUDDY_WEBHOOK_SECRET
      remoteRef:
        key: TAXBUDDY_INGESTBUDDY_WEBHOOK_SECRET
