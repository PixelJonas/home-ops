apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingestbuddy-db-connection
  namespace: ingestbuddy
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: ingestbuddy-db-connection
    template:
      engineVersion: v2
      data:
        uri: "postgresql://ingestbuddy:{{ .password }}@ingestbuddy-db-rw.ingestbuddy.svc:5432/ingestbuddy"
  data:
    - secretKey: password
      remoteRef:
        key: INGESTBUDDY_POSTGRES_PASSWORD
