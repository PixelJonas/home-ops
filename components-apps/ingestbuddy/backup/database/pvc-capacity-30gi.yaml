apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syno-db-backup-capacity-30gi
  namespace: ingestbuddy
  annotations:
    argocd.argoproj.io/sync-wave: "200"
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: synology-iscsi-storage
  resources:
    requests:
      storage: 30Gi
