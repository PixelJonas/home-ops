# NFS scan inbox for the ingestbuddy api's NFS poller (ingestbuddy#9).
# Points at the `inbox/` subdirectory of the share Paperless used to watch
# (\\statesman\configs\paperless\consume\inbox); Paperless itself now only
# sees the sibling `legacy/` subdirectory (components-apps/paperless).
# Static PV pre-bound to the PVC below via claimRef + volumeName, mirroring
# components-apps/paperless/paperless-consume-pvc.yaml.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-ingestbuddy-inbox
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Gi
  nfs:
    path: /volume1/configs/paperless/consume/inbox
    server: 10.10.10.40
  mountOptions:
    - nfsvers=4
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-custom
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: nfs-ingestbuddy-inbox
    namespace: ingestbuddy
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-ingestbuddy-inbox
  namespace: ingestbuddy
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs-custom
  volumeMode: Filesystem
  volumeName: pv-ingestbuddy-inbox
