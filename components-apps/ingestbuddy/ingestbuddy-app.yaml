apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingestbuddy-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: ingestbuddy
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.3.0
    helm:
      values: |-
        defaultPodOptions:
          imagePullSecrets:
            - name: ingestbuddy-ghcr-pull-secret

        controllers:
          api:
            replicas: 1
            containers:
              api:
                image:
                  repository: ghcr.io/pixeljonas/ingestbuddy/pipeline_api
                  digest: "sha256:539e839487fec4f897b25587528a1799a636a062ae2b7aebcdf42e646ec6f6f5"
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  # ingestbuddy#60/#101 (ADR-0007): plugin enable flags and the
                  # PLUGINS_<NAME>_<KEY> names below sit alongside the old flat
                  # names until the config loader (#102) ships; the old names
                  # go in #108. INGESTBUDDY_CONFIG stays unset (image default
                  # /app/ingestbuddy.yaml); PLUGINS_QDRANT_ENABLED defaults true.
                  PLUGINS_TAX_ENABLED: "true"
                  PLUGINS_VEHICLE_ENABLED: "true"
                  # ingestbuddy#62 C4: taxbuddy is a named instance of the
                  # generic webhook plugin (was the taxbuddy plugin). The
                  # instance name is the sink name, so it must stay
                  # `taxbuddy` (sink_dispatches history, re-OCR callback).
                  # Never also set PLUGINS_TAXBUDDY_ENABLED: both at once fail
                  # boot on the duplicate `taxbuddy` sink.
                  PLUGINS_WEBHOOK_ENABLED: "true"
                  PLUGINS_WEBHOOK_INSTANCES__TAXBUDDY__REQUIRES_NAMESPACE: tax
                  # taxbuddy's review marker: never offered as a topic tag.
                  PLUGINS_WEBHOOK_INSTANCES__TAXBUDDY__MACHINERY_TAGS: reviewed
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://ingestbuddy-app-valkey:6379/0
                  # In-cluster Service DNS (confirmed via `oc get svc`) —
                  # inline per infra-ops#61: only *.apps.altus.janz.digital
                  # (external) URLs and real secrets go through Doppler.
                  DOCLING_SERVE_URL: http://docling-serve-app.docling-serve.svc.cluster.local:5001
                  DOCLING_SERVE_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: DOCLING_SERVE_API_KEY
                  LITELLM_BASE_URL: http://litellm-app.litellm.svc.cluster.local:4000
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: LITELLM_API_KEY
                  PLUGINS_PAPERLESS_API_URL: http://paperless-ng.paperless.svc.cluster.local:8000
                  PLUGINS_PAPERLESS_API_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_API_TOKEN
                  PLUGINS_PAPERLESS_PUBLIC_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_PUBLIC_URL
                  # Verifies the x-paperless-webhook-secret header on
                  # POST /v1/webhooks/paperless (ingestbuddy#9). Same Doppler
                  # key (INGESTBUDDY_PAPERLESS_WEBHOOK_SECRET) the
                  # paperless-workflows-apply Job injects into the
                  # "pipeline:eingang intake" workflow's webhook header.
                  PLUGINS_PAPERLESS_WEBHOOK_SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_WEBHOOK_SECRET
                  # x-reocr-secret for taxbuddy's re-OCR requests
                  # (ingestbuddy#36); same Doppler key taxbuddy's
                  # agent_runtime reads as INGESTBUDDY_REOCR_SECRET.
                  REOCR_SHARED_SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: REOCR_SHARED_SECRET
                  # x-ocr-queue-secret for the OCR-queue admin API
                  # (ingestbuddy ADR-0005).
                  OCR_QUEUE_ADMIN_SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: OCR_QUEUE_ADMIN_SECRET
                  # Midgard-aware OCR queue (ingestbuddy ADR-0005): turns the
                  # queue on. Supervisor /healthz on midgard (LAN, no auth).
                  # Without it ingestbuddy never calls the `local: true`
                  # models. Must match the worker's value.
                  MIDGARD_HEALTH_URL: http://10.42.0.5:18080/healthz
                  # Deterministic local-read failure cap (ingestbuddy #77,
                  # ADR-0005): after 2 failures that every local model hit
                  # (schema/json_invalid, context overflow, 422) a job goes
                  # remote, or with the fallback off it keeps its slow
                  # recheck. Enabled 2026-11-03 once the backfill had
                  # drained. Must match the worker's value.
                  MIDGARD_LOCAL_READ_CAP: "2"
                  # Phase B pins (ingestbuddy#61): today's behaviour, set here
                  # BEFORE the releases that add these options and later flip
                  # the public defaults (dry-run write-back, if_unchanged
                  # titles, English tags/OCR/prompts). Today's code ignores
                  # them. Keep api and worker identical.
                  PLUGINS_PAPERLESS_WRITEBACK_MODE: apply
                  PLUGINS_PAPERLESS_WRITEBACK_FIELDS: title,correspondent,document_type,created,tags
                  PLUGINS_PAPERLESS_TITLE_POLICY: always
                  PLUGINS_PAPERLESS_TAG_INBOX: "ingestbuddy:eingang"
                  PLUGINS_PAPERLESS_TAG_DONE: "ingestbuddy:verarbeitet"
                  PLUGINS_PAPERLESS_TAG_DUPLICATE: "ingestbuddy:duplicate"
                  PLUGINS_QDRANT_DENSE_SIZE: "1024"
                  PLUGINS_QDRANT_PHYSICAL_COLLECTION: ingestbuddy_documents_v1
                  OCR_LANG: de
                  PROMPT_LOCALE: de
                  # Home Assistant event webhooks (wake/shutdown logic lives in
                  # HA). The URL embeds the webhook id, so it comes from
                  # Doppler via url_env; only pipeline-api emits events.
                  HA_MIDGARD_OCR_WEBHOOK_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: HA_MIDGARD_OCR_WEBHOOK_URL
                  OCR_QUEUE_WEBHOOKS: >-
                    [{"url_env": "HA_MIDGARD_OCR_WEBHOOK_URL",
                    "events": ["ocr_queue.work_waiting", "ocr_queue.drained",
                    "ocr_queue.deadline_near", "ocr_queue.forced_fallback",
                    "midgard.unavailable_for", "midgard.available"],
                    "enabled": true}]
                  PLUGINS_QDRANT_URL: http://qdrant-app.qdrant.svc.cluster.local:6333
                  PLUGINS_QDRANT_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: QDRANT_API_KEY
                  # NFS scan inbox (ingestbuddy#9): the `inbox` PVC below,
                  # mounted on this controller only. pipeline_api's NFS
                  # poller ingests top-level files here (and <inbox>/vehicle
                  # for the vehicle domain) and deletes each after enqueue.
                  # NFS_POLL_INTERVAL_SECONDS left at its default.
                  NFS_INBOX_PATH: /inbox
                  # Deletion sweep (ingestbuddy#54, ADR-0003): delete QDrant
                  # points and mark bundles of docs deleted in paperless.
                  # The code default is dry-run; apply was enabled after the
                  # first supervised --apply pass on 2026-10-10. Interval
                  # (6h), cap (25/pass) and ratio guard (0.9) use defaults.
                  DELETION_SWEEP_MODE: apply
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10

          worker:
            replicas: 1
            containers:
              worker:
                image:
                  repository: ghcr.io/pixeljonas/ingestbuddy/pipeline_worker
                  digest: "sha256:130e559c36309838c9203456a5ce353526e9171095f242318e721f22f9a7d2cc"
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  # ingestbuddy#60/#101 (ADR-0007): plugin enable flags and the
                  # PLUGINS_<NAME>_<KEY> names below sit alongside the old flat
                  # names until the config loader (#102) ships; the old names
                  # go in #108. INGESTBUDDY_CONFIG stays unset (image default
                  # /app/ingestbuddy.yaml); PLUGINS_QDRANT_ENABLED defaults true.
                  PLUGINS_TAX_ENABLED: "true"
                  PLUGINS_VEHICLE_ENABLED: "true"
                  # ingestbuddy#62 C4: taxbuddy is a named instance of the
                  # generic webhook plugin (was the taxbuddy plugin). The
                  # instance name is the sink name, so it must stay
                  # `taxbuddy` (sink_dispatches history, re-OCR callback).
                  # Never also set PLUGINS_TAXBUDDY_ENABLED: both at once fail
                  # boot on the duplicate `taxbuddy` sink.
                  PLUGINS_WEBHOOK_ENABLED: "true"
                  PLUGINS_WEBHOOK_INSTANCES__TAXBUDDY__REQUIRES_NAMESPACE: tax
                  # taxbuddy's review marker: never offered as a topic tag.
                  PLUGINS_WEBHOOK_INSTANCES__TAXBUDDY__MACHINERY_TAGS: reviewed
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://ingestbuddy-app-valkey:6379/0
                  DOCLING_SERVE_URL: http://docling-serve-app.docling-serve.svc.cluster.local:5001
                  DOCLING_SERVE_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: DOCLING_SERVE_API_KEY
                  LITELLM_BASE_URL: http://litellm-app.litellm.svc.cluster.local:4000
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: LITELLM_API_KEY
                  # Sink dispatch (ingest_core.sinks / pipeline_worker.tasks,
                  # infra-ops#66, merged to ingestbuddy main ahead of this
                  # ticket's own Doppler-key list): the worker hard-requires
                  # every one of these to even build its resource singleton
                  # on the first job — process_document itself would raise
                  # RuntimeError without them, not just the dispatch step.
                  PLUGINS_PAPERLESS_API_URL: http://paperless-ng.paperless.svc.cluster.local:8000
                  PLUGINS_PAPERLESS_API_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_API_TOKEN
                  PLUGINS_PAPERLESS_PUBLIC_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_PUBLIC_URL
                  PLUGINS_QDRANT_URL: http://qdrant-app.qdrant.svc.cluster.local:6333
                  PLUGINS_QDRANT_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: QDRANT_API_KEY
                  # taxbuddy's ingestion-api POST /intake/ingestbuddy
                  # (taxbuddy#109/#148), worker only. Auth is the static
                  # X-Ingestbuddy-Signature header carrying
                  # TAXBUDDY_WEBHOOK_SECRET (Doppler
                  # TAXBUDDY_INGESTBUDDY_WEBHOOK_SECRET, the same key
                  # taxbuddy's INGESTBUDDY_INTAKE_SECRET reads). The re-OCR
                  # callback (ingestbuddy#36) goes to the same URL.
                  # Keep byte-identical to taxbuddy's INGESTBUDDY_REOCR_CALLBACK_URL
                  # (components-apps/taxbuddy/taxbuddy-app.yaml, ingestbuddy#62 C9).
                  PLUGINS_WEBHOOK_INSTANCES__TAXBUDDY__URL: http://taxbuddy-app-ingestion-api.taxbuddy.svc.cluster.local:8000/intake/ingestbuddy
                  PLUGINS_WEBHOOK_INSTANCES__TAXBUDDY__SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: TAXBUDDY_WEBHOOK_SECRET
                  # Midgard-aware OCR queue (ingestbuddy ADR-0005): the worker
                  # routes escalation/re-OCR pages by this probe. Must match
                  # the api's value.
                  MIDGARD_HEALTH_URL: http://10.42.0.5:18080/healthz
                  # Deterministic local-read failure cap (ingestbuddy #77,
                  # ADR-0005): after 2 failures that every local model hit
                  # (schema/json_invalid, context overflow, 422) a job goes
                  # remote, or with the fallback off it keeps its slow
                  # recheck. Enabled 2026-11-03 once the backfill had
                  # drained. Must match the api's value.
                  MIDGARD_LOCAL_READ_CAP: "2"
                  # Phase B pins (ingestbuddy#61): today's behaviour, set here
                  # BEFORE the releases that add these options and later flip
                  # the public defaults (dry-run write-back, if_unchanged
                  # titles, English tags/OCR/prompts). Today's code ignores
                  # them. Keep api and worker identical.
                  PLUGINS_PAPERLESS_WRITEBACK_MODE: apply
                  PLUGINS_PAPERLESS_WRITEBACK_FIELDS: title,correspondent,document_type,created,tags
                  PLUGINS_PAPERLESS_TITLE_POLICY: always
                  PLUGINS_PAPERLESS_TAG_INBOX: "ingestbuddy:eingang"
                  PLUGINS_PAPERLESS_TAG_DONE: "ingestbuddy:verarbeitet"
                  PLUGINS_PAPERLESS_TAG_DUPLICATE: "ingestbuddy:duplicate"
                  PLUGINS_QDRANT_DENSE_SIZE: "1024"
                  PLUGINS_QDRANT_PHYSICAL_COLLECTION: ingestbuddy_documents_v1
                  OCR_LANG: de
                  PROMPT_LOCALE: de
                  # Vehicle domain shadow run (ingestbuddy#13): routing +
                  # extraction run and land in bundles.domain_metadata, but
                  # PLUGINS_VEHICLE_SINK_URL/SECRET stay unset, so no draft reaches
                  # vehicle-pipeline while its legacy intake is still live.
                  # PLUGINS_VEHICLE_TAGS mirrors components-apps/vehicle-pipeline's
                  # VEHICLE_TAGS
                  # value; keep the two in sync until the legacy poll retires.
                  PLUGINS_VEHICLE_REGISTRY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: MYGARAGE_VEHICLES
                  PLUGINS_VEHICLE_TAGS: >-
                    {"multivan": ["Fahrzeug:Multivan", "Fahrzeug:Multivan-auto"],
                    "id4": ["Fahrzeug:ID4", "Fahrzeug:ID4-auto"]}
                probes:
                  # The RQ worker has no HTTP listener — exec
                  # pipeline_worker.healthcheck instead. liveness is
                  # process-level only (no valkey dependency, so a valkey
                  # outage can't get healthy workers killed); readiness
                  # pings QUEUE_URL.
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - pipeline_worker.healthcheck
                          - liveness
                      initialDelaySeconds: 15
                      periodSeconds: 15
                      timeoutSeconds: 10
                      failureThreshold: 6
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - pipeline_worker.healthcheck
                          - readiness
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 10

          valkey:
            containers:
              valkey:
                image:
                  repository: valkey/valkey
                  tag: 9.1.3
                  pullPolicy: IfNotPresent
                args:
                  - valkey-server
                  - --appendonly
                  - "yes"
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 5

        service:
          api:
            controller: api
            ports:
              http:
                port: 8000
          valkey:
            controller: valkey
            ports:
              redis:
                port: 6379

        persistence:
          valkey-data:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: lvms-vg1
            size: 1Gi
            advancedMounts:
              valkey:
                valkey:
                  - path: /data
          # NFS scan inbox (ingestbuddy#9) -- static PV/PVC in
          # ingestbuddy-inbox-pvc.yaml, NAS path
          # /volume1/configs/paperless/consume/inbox. api controller only:
          # the worker never touches the inbox.
          inbox:
            enabled: true
            existingClaim: nfs-ingestbuddy-inbox
            advancedMounts:
              api:
                api:
                  - path: /inbox

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
