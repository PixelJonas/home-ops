apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingestbuddy-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: ingestbuddy
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.2.1
    helm:
      values: |-
        defaultPodOptions:
          imagePullSecrets:
            - name: ingestbuddy-ghcr-pull-secret

        controllers:
          api:
            replicas: 1
            containers:
              api:
                image:
                  repository: ghcr.io/pixeljonas/ingestbuddy/pipeline_api
                  digest: "sha256:151d35c1b841fdd5cbd13949f9ef70e2758ef0c17df4880ee870518670e6208e"
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://ingestbuddy-app-valkey:6379/0
                  # In-cluster Service DNS (confirmed via `oc get svc`) —
                  # inline per infra-ops#61: only *.apps.altus.janz.digital
                  # (external) URLs and real secrets go through Doppler.
                  DOCLING_SERVE_URL: http://docling-serve-app.docling-serve.svc.cluster.local:5001
                  DOCLING_SERVE_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: DOCLING_SERVE_API_KEY
                  LITELLM_BASE_URL: http://litellm-app.litellm.svc.cluster.local:4000
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: LITELLM_API_KEY
                  PAPERLESS_API_URL: http://paperless-ng.paperless.svc.cluster.local:8000
                  PAPERLESS_API_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_API_TOKEN
                  PAPERLESS_PUBLIC_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_PUBLIC_URL
                  # Verifies the x-paperless-webhook-secret header on
                  # POST /v1/webhooks/paperless (ingestbuddy#9). Same Doppler
                  # key (INGESTBUDDY_PAPERLESS_WEBHOOK_SECRET) the
                  # paperless-workflows-apply Job injects into the
                  # "pipeline:eingang intake" workflow's webhook header.
                  PAPERLESS_WEBHOOK_SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_WEBHOOK_SECRET
                  QDRANT_URL: http://qdrant-app.qdrant.svc.cluster.local:6333
                  QDRANT_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: QDRANT_API_KEY
                  # NFS scan inbox (ingestbuddy#9): the `inbox` PVC below,
                  # mounted on this controller only. pipeline_api's NFS
                  # poller ingests top-level files here (and <inbox>/vehicle
                  # for the vehicle domain) and deletes each after enqueue.
                  # NFS_POLL_INTERVAL_SECONDS left at its default.
                  NFS_INBOX_PATH: /inbox
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10

          worker:
            replicas: 1
            containers:
              worker:
                image:
                  repository: ghcr.io/pixeljonas/ingestbuddy/pipeline_worker
                  digest: "sha256:934b09c7974a009d3827d7a58c32e412b2d91f15ee2eb870ecbd1bf6b9b1f429"
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://ingestbuddy-app-valkey:6379/0
                  DOCLING_SERVE_URL: http://docling-serve-app.docling-serve.svc.cluster.local:5001
                  DOCLING_SERVE_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: DOCLING_SERVE_API_KEY
                  LITELLM_BASE_URL: http://litellm-app.litellm.svc.cluster.local:4000
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: LITELLM_API_KEY
                  # Sink dispatch (ingest_core.sinks / pipeline_worker.tasks,
                  # infra-ops#66, merged to ingestbuddy main ahead of this
                  # ticket's own Doppler-key list): the worker hard-requires
                  # every one of these to even build its resource singleton
                  # on the first job — process_document itself would raise
                  # RuntimeError without them, not just the dispatch step.
                  PAPERLESS_API_URL: http://paperless-ng.paperless.svc.cluster.local:8000
                  PAPERLESS_API_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_API_TOKEN
                  PAPERLESS_PUBLIC_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_PUBLIC_URL
                  QDRANT_URL: http://qdrant-app.qdrant.svc.cluster.local:6333
                  QDRANT_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: QDRANT_API_KEY
                  # taxbuddy's ingestion-api POST /intake/ingestbuddy
                  # (taxbuddy#109, shipped in taxbuddy#148). Auth is the
                  # shared ingestbuddy push-transport header
                  # X-Ingestbuddy-Signature carrying TAXBUDDY_WEBHOOK_SECRET
                  # (Doppler TAXBUDDY_INGESTBUDDY_WEBHOOK_SECRET — the same
                  # key taxbuddy's INGESTBUDDY_INTAKE_SECRET reads). Known
                  # remaining gap: TaxbuddySink's envelope is not yet the
                  # #139 IngestBundle taxbuddy validates, so deliveries 422
                  # until ingestbuddy grows tax-domain extraction; failures
                  # are recorded per-bundle as failed SinkDispatches, not
                  # worker crashes.
                  TAXBUDDY_INTAKE_URL: http://taxbuddy-app-ingestion-api.taxbuddy.svc.cluster.local:8000/intake/ingestbuddy
                  TAXBUDDY_WEBHOOK_SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: TAXBUDDY_WEBHOOK_SECRET
                probes:
                  # The RQ worker has no HTTP listener — exec
                  # pipeline_worker.healthcheck instead. liveness is
                  # process-level only (no valkey dependency, so a valkey
                  # outage can't get healthy workers killed); readiness
                  # pings QUEUE_URL.
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - pipeline_worker.healthcheck
                          - liveness
                      initialDelaySeconds: 15
                      periodSeconds: 15
                      timeoutSeconds: 10
                      failureThreshold: 6
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - pipeline_worker.healthcheck
                          - readiness
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 10

          valkey:
            containers:
              valkey:
                image:
                  repository: valkey/valkey
                  tag: 9.1.1
                  pullPolicy: IfNotPresent
                args:
                  - valkey-server
                  - --appendonly
                  - "yes"
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 5

        service:
          api:
            controller: api
            ports:
              http:
                port: 8000
          valkey:
            controller: valkey
            ports:
              redis:
                port: 6379

        persistence:
          valkey-data:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: lvms-vg1
            size: 1Gi
            advancedMounts:
              valkey:
                valkey:
                  - path: /data
          # NFS scan inbox (ingestbuddy#9) -- static PV/PVC in
          # ingestbuddy-inbox-pvc.yaml, NAS path
          # /volume1/configs/paperless/consume/inbox. api controller only:
          # the worker never touches the inbox.
          inbox:
            enabled: true
            existingClaim: nfs-ingestbuddy-inbox
            advancedMounts:
              api:
                api:
                  - path: /inbox

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
