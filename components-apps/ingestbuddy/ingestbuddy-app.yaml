apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingestbuddy-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: ingestbuddy
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.2.1
    helm:
      values: |-
        defaultPodOptions:
          imagePullSecrets:
            - name: ingestbuddy-ghcr-pull-secret

        controllers:
          api:
            replicas: 1
            containers:
              api:
                image:
                  repository: ghcr.io/pixeljonas/ingestbuddy/pipeline_api
                  digest: "sha256:e6af6b41a5586dcedddc1ddc55db2f4e490a71f454e119d9d915623c23efec88"
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://ingestbuddy-app-valkey:6379/0
                  # In-cluster Service DNS (confirmed via `oc get svc`) —
                  # inline per infra-ops#61: only *.apps.altus.janz.digital
                  # (external) URLs and real secrets go through Doppler.
                  DOCLING_SERVE_URL: http://docling-serve-app.docling-serve.svc.cluster.local:5001
                  DOCLING_SERVE_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: DOCLING_SERVE_API_KEY
                  LITELLM_BASE_URL: http://litellm-app.litellm.svc.cluster.local:4000
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: LITELLM_API_KEY
                  PAPERLESS_API_URL: http://paperless-ng.paperless.svc.cluster.local:8000
                  PAPERLESS_API_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_API_TOKEN
                  PAPERLESS_PUBLIC_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_PUBLIC_URL
                  QDRANT_URL: http://qdrant-app.qdrant.svc.cluster.local:6333
                  QDRANT_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: QDRANT_API_KEY
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10

          worker:
            replicas: 1
            containers:
              worker:
                image:
                  repository: ghcr.io/pixeljonas/ingestbuddy/pipeline_worker
                  digest: "sha256:d85f84b19c080df92508bbfd314eb354ad55b9cdb7246df577badff8dc238d16"
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://ingestbuddy-app-valkey:6379/0
                  DOCLING_SERVE_URL: http://docling-serve-app.docling-serve.svc.cluster.local:5001
                  DOCLING_SERVE_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: DOCLING_SERVE_API_KEY
                  LITELLM_BASE_URL: http://litellm-app.litellm.svc.cluster.local:4000
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: LITELLM_API_KEY
                  # Sink dispatch (ingest_core.sinks / pipeline_worker.tasks,
                  # infra-ops#66, merged to ingestbuddy main ahead of this
                  # ticket's own Doppler-key list): the worker hard-requires
                  # every one of these to even build its resource singleton
                  # on the first job — process_document itself would raise
                  # RuntimeError without them, not just the dispatch step.
                  PAPERLESS_API_URL: http://paperless-ng.paperless.svc.cluster.local:8000
                  PAPERLESS_API_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_API_TOKEN
                  PAPERLESS_PUBLIC_URL:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: PAPERLESS_PUBLIC_URL
                  QDRANT_URL: http://qdrant-app.qdrant.svc.cluster.local:6333
                  QDRANT_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: QDRANT_API_KEY
                  # PROVISIONAL — taxbuddy's own intake endpoint
                  # (ingest_core.sinks.taxbuddy.TaxbuddySink's target,
                  # taxbuddy#109) is not built yet; #109 is still open with
                  # no path decided. This points at taxbuddy's real
                  # in-cluster ingestion-api Service (confirmed via
                  # `oc get svc -n taxbuddy`: taxbuddy-app-ingestion-api,
                  # port 8000) plus a guessed path. Every dispatch to this
                  # sink will fail (connection refused / 404) until #109
                  # ships and this URL is corrected to match — that failure
                  # is caught per-bundle by dispatch_to_sink's own
                  # try/except and recorded as a failed SinkDispatch, not a
                  # worker crash, so this does not block deploying the rest
                  # of the pipeline. Update this value (and confirm the
                  # TAXBUDDY_WEBHOOK_SECRET key in
                  # external-ingestbuddy-credentials.yaml is what #109
                  # actually reads) once #109 lands.
                  TAXBUDDY_INTAKE_URL: http://taxbuddy-app-ingestion-api.taxbuddy.svc.cluster.local:8000/webhooks/ingestbuddy
                  TAXBUDDY_WEBHOOK_SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: ingestbuddy-credentials
                        key: TAXBUDDY_WEBHOOK_SECRET
                probes:
                  # The RQ worker has no HTTP listener — exec a redis ping
                  # against QUEUE_URL instead (pipeline_worker.healthcheck),
                  # same shape as taxbuddy's doc-pipeline exec probe.
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - pipeline_worker.healthcheck
                      initialDelaySeconds: 15
                      periodSeconds: 15
                      timeoutSeconds: 10
                      failureThreshold: 6
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - pipeline_worker.healthcheck
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 10

          valkey:
            containers:
              valkey:
                image:
                  repository: valkey/valkey
                  tag: 9.1.1
                  pullPolicy: IfNotPresent
                args:
                  - valkey-server
                  - --appendonly
                  - "yes"
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 5
                      periodSeconds: 5

        service:
          api:
            controller: api
            ports:
              http:
                port: 8000
          valkey:
            controller: valkey
            ports:
              redis:
                port: 6379

        persistence:
          valkey-data:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: lvms-vg1
            size: 1Gi
            advancedMounts:
              valkey:
                valkey:
                  - path: /data

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
