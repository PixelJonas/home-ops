apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "111"
  name: litellm-app
  namespace: openshift-gitops
spec:
  destination:
    namespace: litellm
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.3.0
    helm:
      values: |-

        defaultPodOptions:
          securityContext:
            runAsUser: 0
            runAsGroup: 0

        controllers:
          litellm:
            containers:
              litellm:
                # Tag + digest: the digest pins the content (a repushed tag
                # can't drift the image), the -lts tag lets Renovate's
                # app-template regex follow the LTS line. No automerge (LiteLLM
                # packageRule in .github/renovate/base.json5): the proxy runs
                # its Prisma migrations at startup; take a DB dump before each bump.
                image:
                  repository: ghcr.io/berriai/litellm
                  tag: v1.108.13-lts@sha256:65a9631f79329779a3371f4bdf185c3a4a93653254743b8722c5cbd9b9dd8a65
                  pullPolicy: IfNotPresent
                args:
                  - "--config"
                  - "/etc/litellm/config.yaml"
                  - "--port"
                  - "4000"
                env:
                  GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-credentials.json
                  STORE_MODEL_IN_DB: "true"
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: litellm-credentials
                        key: DATABASE_URL
                  LITELLM_MASTER_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: litellm-credentials
                        key: LITELLM_MASTER_KEY
                  VERTEX_PROJECT_ID:
                    valueFrom:
                      secretKeyRef:
                        name: litellm-credentials
                        key: VERTEX_PROJECT_ID
                  NVIDIA_NIM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: litellm-credentials
                        key: NVIDIA_NIM_API_KEY

        persistence:
          config:
            type: configMap
            name: litellm-config
            globalMounts:
              - path: /etc/litellm
                readOnly: true
          secrets:
            type: secret
            name: litellm-credentials
            globalMounts:
              - path: /secrets
                readOnly: true

        service:
          litellm:
            controller: litellm
            ports:
              http:
                port: 4000

        ingress:
          litellm:
            enabled: true
            className: openshift-default
            annotations:
              route.openshift.io/termination: "edge"
              # Without this, the default ~30s HAProxy server timeout can
              # kill a completion call whose first token is slow to arrive
              # (e.g. a large accumulated tool-call history needing a long
              # prefill), well before LiteLLM/the backend model actually
              # fails -- confirmed live 2026-08-03 (an agent turn got a 504
              # from this Route after ~50 prior tool calls in the same turn).
              haproxy.router.openshift.io/timeout: 600s
            hosts:
              - host: litellm.apps.altus.janz.digital
                paths:
                  - path: /
                    service:
                      identifier: litellm
                      port: http

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
