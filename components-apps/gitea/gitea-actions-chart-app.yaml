apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-actions-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "112"
spec:
  destination:
    namespace: gitea
    server: "https://kubernetes.default.svc"
  source:
    chart: actions
    repoURL: https://dl.gitea.com/charts
    targetRevision: 0.1.2
    helm:
      values: |-
        enabled: true
        giteaRootURL: "http://gitea-app-http.gitea.svc.cluster.local:3000"
        existingSecret: "gitea-actions-runner-token"
        existingSecretKey: "token"
        statefulset:
          replicas: 3
          serviceAccountName: gitea-actions-runner
          persistence:
            size: 5Gi
          # dind's layer store and the runner's action cache live on per-pod
          # generic ephemeral LVMS volumes (thin pool on sda + NVMe), not
          # emptyDir/rootfs on altus' sdb: that disk also holds etcd and the
          # root fs, and CI write bursts (then vfs, which copies a whole image
          # rootfs per container) stalled etcd. Volumes are deleted with the
          # pod, like the emptyDir was. Thin-provisioned, so size is a cap, not
          # usage; the docker-prune sidecar below keeps the store bounded.
          extraVolumes:
            - name: dind-storage
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    storageClassName: lvms-vg1
                    resources:
                      requests:
                        storage: 250Gi
            - name: runner-cache
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    storageClassName: lvms-vg1
                    resources:
                      requests:
                        storage: 10Gi
          # Requests only, no limits: unset = BestEffort, which starves dind's
          # 1s exec liveness probe under CI load; a cap would OOM-kill job builds.
          # Runner/dind write-up: infra-ops repo .claude/rules/kubernetes-argocd.md
          runner:
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
            # Whole-dir mount + DOCKER_HOST, not the chart's subPath docker.sock
            # mount (pinned at start -> dead socket after a dind restart). Same
            # path in dind so socket bind mounts into job containers resolve.
            extraVolumeMounts:
              - name: docker-socket
                mountPath: /docker-sock
              # act's action clones (~/.cache/act), else on the rootfs (sdb)
              - name: runner-cache
                mountPath: /root/.cache
            extraEnvs:
              - name: DOCKER_HOST
                value: unix:///docker-sock/docker.sock
          dind:
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
            extraVolumeMounts:
              - name: dind-storage
                mountPath: /var/lib/docker
              - name: docker-socket
                mountPath: /docker-sock
            extraArgs:
              - --mtu=1400
              # overlay2 on the xfs (ftype=1) ephemeral volume: no
              # overlay-on-overlay (the store isn't on CRI-O's rootfs), so
              # #429's vfs workaround is moot; its download hangs were MTU
              # (fixed by the two MTU flags here).
              - --storage-driver=overlay2
              - --default-network-opt=bridge=com.docker.network.driver.mtu=1400
              # Pod ndots:5 + search domains make musl apk/wget fail ("DNS: no
              # address for host") on 2-dot names; ndots:1 resolves FQDNs as-is.
              - --dns-opt=ndots:1
        # Native sidecar (restartPolicy: Always, starts after dind): prunes
        # unused images/containers/networks/build cache older than 7 days once
        # a day, or older than 24h whenever the store is >=70% full. `until`
        # only matches objects no container uses, so running jobs are safe.
        postExtraInitContainers:
          - name: docker-prune
            image: docker.io/library/docker:29.5.2-cli # renovate
            restartPolicy: Always
            env:
              - name: DOCKER_HOST
                value: unix:///docker-sock/docker.sock
            command: ["/bin/sh", "-c"]
            args:
              - |
                last=0
                while true; do
                  sleep 600
                  docker info >/dev/null 2>&1 || continue
                  used=$(df -P /var/lib/docker | awk 'NR==2 {sub("%", "", $5); print $5}')
                  now=$(date +%s)
                  if [ "${used:-0}" -ge 70 ]; then age=24h
                  elif [ $((now - last)) -ge 86400 ]; then age=168h
                  else continue; fi
                  echo "$(date -Iseconds) store ${used}% used, pruning until=${age}"
                  docker system prune -af --filter "until=${age}" | tail -1
                  docker builder prune -af --filter "until=${age}" | tail -1
                  df -P /var/lib/docker | awk 'NR==2 {print "after: " $5 " used"}'
                  last=$now
                done
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
            volumeMounts:
              - name: docker-socket
                mountPath: /docker-sock
              - name: dind-storage
                mountPath: /var/lib/docker
                readOnly: true

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
