apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nextcloud-exporter
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/instance: nextcloud-app
      app.kubernetes.io/component: metrics
  namespaceSelector:
    matchNames:
      - nextcloud
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
