# Lets the job's ServiceAccount (database-psql-backup) `kubectl exec` into the Nextcloud pod
# for `occ maintenance:mode`. Same rules as templates/mariadb-backup/role.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextcloud-maintenance-exec
rules:
  - apiGroups: ["", "extensions", "apps"]
    resources:
      [
        "deployments",
        "replicasets",
        "statefulsets",
        "pods",
        "pods/attach",
        "pods/exec",
        "pods/log",
      ]
    verbs: ["list", "get", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextcloud-maintenance-exec
subjects:
  - kind: ServiceAccount
    name: database-psql-backup
    namespace: nextcloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nextcloud-maintenance-exec
