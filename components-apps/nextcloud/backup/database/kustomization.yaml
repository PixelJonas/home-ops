apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: database-
namespace: nextcloud

resources:
  - ../../../../templates/mariadb-backup
  - ../../../../templates/volsync/rest
  - ../../../../templates/volsync/backblaze

patches:
  - target:
      group: volsync.backube
      version: v1alpha1
      kind: ReplicationSource
      name: backup
    path: local.yaml

  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: external-restic-config
    path: local-secret.yaml

  - target:
      group: volsync.backube
      version: v1alpha1
      kind: ReplicationSource
      name: backup-b2
    path: backblaze.yaml

  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: external-restic-config-b2
    path: backblaze-secret.yaml

  - target:
      group: batch
      version: v1
      kind: CronJob
      name: mariadb-backup
    path: cron.yaml

  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: mariadb-backup
    path: rolebinding.yaml
