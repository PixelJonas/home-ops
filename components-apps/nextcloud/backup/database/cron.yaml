- op: replace
  path: /spec/jobTemplate/spec/template/spec/volumes/0/persistentVolumeClaim/claimName
  value: database-syno-db-backup

# containers/0 is the mariadb-dump container (containers/1 is maintenance-mode).
- op: replace
  path: /spec/jobTemplate/spec/template/spec/containers/0/env
  value:
    - name: MARIADB_HOST
      value: nextcloud-app-mariadb
    - name: MARIADB_ROOT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nextcloud-mariadb
          key: mariadb-root-password
