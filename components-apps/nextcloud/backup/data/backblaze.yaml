- op: replace
  path: /spec/sourcePVC
  value: nextcloud-app-nextcloud

- op: replace
  path: /spec/restic/repository
  value: restic-config-data-b2

# Coordinated with the mariadb-backup CronJob's 03:00 schedule (see
# templates/mariadb-backup/cronjob.yaml) instead of the template's default
# 05:00 — both backups need to happen inside the same maintenance-mode
# window for point-in-time consistency between the DB dump and the app-data
# snapshot. See docs/runbooks/nextcloud-restore.md for the actual resulting
# guarantee.
- op: replace
  path: /spec/trigger/schedule
  value: "10 3 * * *"

# Fleet-wide follow-up to PR #370: copyMethod: Direct mounts the live
# source PVC into the backup mover pod, which can trigger an SELinux
# relabel and cause permission/IO-contention issues against the live
# workload. This StorageClass genuinely supports CSI snapshots
# (confirmed via `oc get csidriver`/`oc get volumesnapshotclass` on
# altus), so switch to Snapshot to avoid ever touching the live PVC.
- op: add
  path: /spec/restic/copyMethod
  value: Snapshot
- op: add
  path: /spec/restic/volumeSnapshotClassName
  value: lvms-vg1
