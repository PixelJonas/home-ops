apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: nextcloud
    server: "https://kubernetes.default.svc"
  source:
    chart: nextcloud
    repoURL: https://nextcloud.github.io/helm/
    targetRevision: 9.2.6
    helm:
      values: |-
        nextcloud:
          host: nextcloud.apps.altus.janz.digital
          existingSecret:
            enabled: true
            secretName: nextcloud-admin
            usernameKey: nextcloud-username
            passwordKey: nextcloud-password
            # nextcloud-exporter auth token (Task 2/3 of the monitoring plan)
            # -- read by the chart's own templates/metrics/deployment.yaml
            # as NEXTCLOUD_AUTH_TOKEN, out of this SAME existingSecret since
            # the template only supports one secret name for the whole
            # nextcloud.existingSecret block, not a per-key override.
            tokenKey: nextcloud-token
          trustedDomains:
            - nextcloud.apps.altus.janz.digital
            - nextcloud.janz.digital
          extraEnv:
            - name: TRUSTED_PROXIES
              # cloudflared's in-cluster pod CIDR + the OpenShift router's
              # internal network - confirm exact CIDR against the live
              # cluster during rollout (see Task 3 Step 6), this is a
              # placeholder needing verification, not a copy-pasteable
              # final value.
              value: "10.128.0.0/14"
            - name: OVERWRITEHOST
              value: "nextcloud.janz.digital"
            - name: OVERWRITECLIURL
              value: "https://nextcloud.janz.digital"
          podSecurityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
          securityContext:
            runAsUser: 0
          ## SMTP via the household's existing Fastmail account, sending
          ## as cloud@famjanz.de. host/name/password come from the same
          ## nextcloud-admin existingSecret above (smtp-host/smtp-username/
          ## smtp-password keys, ExternalSecret-synced from Doppler
          ## MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD in homelab/home).
          mail:
            enabled: true
            fromAddress: cloud
            domain: famjanz.de
            smtp:
              secure: ssl
              port: 465
              authtype: LOGIN

        phpClientHttpsFix:
          enabled: true
          protocol: https

        # The chart's own MYSQL_HOST/USER/PASSWORD env-var wiring (used by
        # both the main container and the mariadb-isalive init container)
        # is gated on internalDatabase.enabled, not mariadb.enabled -- it
        # defaults to true (SQLite) and silently wins over the bundled
        # MariaDB subchart unless explicitly disabled here. externalDatabase
        # .existingSecret is still the correct place for credentials even
        # though we're using the bundled subchart, not a real external DB --
        # that's simply where this chart's template always reads them from.
        internalDatabase:
          enabled: false

        externalDatabase:
          existingSecret:
            secretName: nextcloud-mariadb
            usernameKey: mariadb-username
            passwordKey: mariadb-password

        # Background jobs hardening: chart default (cronjob.enabled: false)
        # leaves Nextcloud on its weakest "ajax" trigger mode (background
        # jobs only run opportunistically off page-load traffic, no crond
        # sidecar or CronJob exists otherwise). Use a real Kubernetes
        # CronJob instead of the sidecar type -- sidecar needs crond running
        # as root in the main pod, cronjob type runs `php -f cron.php` as a
        # separate Job on the existing schedule/volumes, consistent with
        # how this chart's docs recommend doing it on Kubernetes. Nextcloud
        # itself still needs `occ background:cron` run once (see hardening
        # notes) to flip config.php's backgroundjobs_mode from the ajax
        # default to cron -- this chart value alone only creates the
        # CronJob, it doesn't flip that setting.
        cronjob:
          enabled: true
          type: cronjob
          cronjob:
            schedule: "*/5 * * * *"
            # The chart's cronjob-type container does NOT inherit the
            # Deployment's podSecurityContext/securityContext above (those
            # are only wired to the main app pod template) -- confirmed
            # live: first run failed with "Console has to be executed with
            # the user that owns the file config/config.php. Current user
            # id: 0, Owner id of config.php: 33" because this container
            # otherwise defaults to root, same as the main pod. Pin it to
            # www-data (33) explicitly, matching config.php's real on-disk
            # owner, so cron.php's own UID check passes.
            securityContext:
              runAsUser: 33
              runAsGroup: 33

        persistence:
          enabled: true
          storageClass: lvms-vg1
          accessMode: ReadWriteOnce
          size: 20Gi
          # User file storage (nextcloud.datadir, /var/www/html/data) split
          # onto its own PVC backed by the Synology NAS via the existing
          # nfs-subdir-external-provisioner setup (same synology-nfs-storage
          # StorageClass already used by paperless/resilio-sync/restic-rest-
          # server) -- webroot/config/custom_apps/themes above stay on
          # lvms-vg1. Done ahead of real usage so the family's growing file
          # storage lands on the NAS's much larger volume instead of local
          # NVMe, without needing another live migration later. Size is
          # nominal -- nfs-subdir-external-provisioner doesn't enforce PVC
          # quota, the real ceiling is the shared Synology volume's free
          # space.
          nextcloudData:
            enabled: true
            storageClass: synology-nfs-storage
            accessMode: ReadWriteOnce
            size: 100Gi

        mariadb:
          enabled: true
          auth:
            database: nextcloud
            username: nextcloud
            existingSecret: nextcloud-mariadb
          primary:
            persistence:
              enabled: true
              storageClass: lvms-vg1
              size: 10Gi
          global:
            compatibility:
              openshift:
                adaptSecurityContext: force

        redis:
          enabled: true
          auth:
            enabled: true
            existingSecret: nextcloud-redis
            existingSecretPasswordKey: redis-password
          master:
            persistence:
              enabled: true
              storageClass: lvms-vg1
              size: 2Gi
          replica:
            persistence:
              enabled: true
              storageClass: lvms-vg1
              size: 2Gi
          global:
            compatibility:
              openshift:
                adaptSecurityContext: force

        ingress:
          enabled: true
          className: openshift-default
          annotations:
            route.openshift.io/termination: "edge"
          path: /
          pathType: Prefix

        # nextcloud-exporter, deployed via the chart's own dedicated
        # metrics.* mechanism (a purpose-built Deployment + Service for
        # xperimental/nextcloud-exporter, not a generic sidecar) --
        # preferred over hand-rolling extraSidecarContainers because it
        # already wires NEXTCLOUD_SERVER, the /ocs/.../serverinfo path, and
        # NEXTCLOUD_AUTH_TOKEN (via nextcloud.existingSecret.tokenKey above)
        # correctly out of the box. See monitoring-report.md for details.
        metrics:
          enabled: true
          image:
            repository: xperimental/nextcloud-exporter
            tag: 0.9.1
          info:
            # nextcloud_system_update_available metric (dashboard panel 7)
            update: true

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
