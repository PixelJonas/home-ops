apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-bootstrap
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "150"
    # 2026-08-11: no-op annotation bump to force ArgoCD to re-evaluate
    # this Application after a prior sync attempt hard-failed with
    # "Job.batch nextcloud-bootstrap ... field is immutable" (the
    # already-applied Job object blocked the SERVERINFO_TOKEN fix from
    # landing). The blocking Job has since been manually deleted, so
    # this commit's only purpose is to give ArgoCD a new git revision
    # to sync against -- no functional change to the Job spec itself.
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: nextcloud-bootstrap
      restartPolicy: OnFailure
      volumes:
        - name: bootstrap-script
          configMap:
            name: nextcloud-bootstrap-script
            defaultMode: 0755
      containers:
        - name: nextcloud-bootstrap
          image: quay.io/openshift/origin-cli:4.22
          command: ["/bin/bash", "/scripts/bootstrap.sh"]
          env:
            - name: JONAS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-bootstrap-credentials
                  key: jonas-password
            - name: JULIA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-bootstrap-credentials
                  key: julia-password
            # Explicit internal Service DNS name + port, verified against
            # the live cluster (oc get svc -n nextcloud) rather than assumed:
            # the Helm release name is "nextcloud-app", not "nextcloud", so
            # the Service is nextcloud-app.nextcloud.svc.cluster.local,
            # listening on 8080 (targetPort 80 on the pod).
            - name: NEXTCLOUD_SERVICE_HOST
              value: "nextcloud-app.nextcloud.svc.cluster.local"
            - name: NEXTCLOUD_SERVICE_PORT
              value: "8080"
            # Same nextcloud-token key nextcloud-exporter itself consumes as
            # NEXTCLOUD_AUTH_TOKEN (see nextcloud-app.yaml's metrics.* values
            # and external-nextcloud-admin.yaml) -- registering it here via
            # `occ config:app:set serverinfo token` is what makes that token
            # actually valid server-side. Without this the exporter's every
            # scrape 401s. See bootstrap.sh's serverinfo section for the full
            # writeup.
            - name: SERVERINFO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nextcloud-admin
                  key: nextcloud-token
          volumeMounts:
            - name: bootstrap-script
              mountPath: /scripts
