apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-db-nextcloud-secret
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: nextcloud-db-nextcloud-secret
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "nextcloud"
        password: "{{ .password }}"

  data:
    - secretKey: password
      remoteRef:
        key: NEXTCLOUD_POSTGRES_USER_PASSWORD
