- op: replace
  path: /spec/sourcePVC
  value: resilio-sync-app-config

- op: replace
  path: /spec/restic/repository
  value: restic-config-config-b2

# config moved to local-xandar 2026-10-17 (static local PV, no CSI snapshot
# support), so the PR #370 Snapshot copyMethod no longer applies here --
# back to the base template's copyMethod: Direct. cacheStorageClassName
# follows it so the mover pod can schedule on xandar, and
# moverSecurityContext matches resilio's PUID/PGID (1024:100) so the mover
# can read the source files it owns.
- op: replace
  path: /spec/restic/cacheStorageClassName
  value: local-xandar
# No fsGroup (backup strategy 1.9, 2026-11-02): with copyMethod Direct the
# mover mounts the LIVE PVC, so an fsGroup makes kubelet chgrp/chmod the
# live config on every run. Every file is owned by uid 1024 (gid 100), so
# runAsUser alone can read it; the cache PVC stays writable via gid 100.
# anyuid (fsGroup RunAsAny) injects no fsGroup. Verified 2026-11-02: manual
# sync Successful, uid:gid:mode of all entries unchanged. CRI-O still
# relabels the live PVC to the namespace MCS on each mover start (same
# label, but every entry's ctime changes); the influxdb3 spc_t SCC pattern
# would avoid that if it ever matters.
- op: add
  path: /spec/restic/moverSecurityContext
  value:
    runAsUser: 1024
    runAsGroup: 100
