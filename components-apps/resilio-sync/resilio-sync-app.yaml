apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resilio-sync-app
  annotations:
    argocd.argoproj.io/sync-wave: "101"
spec:
  destination:
    namespace: resilio-sync
    server: "https://kubernetes.default.svc"
  project: cluster-apps
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.2.1
    helm:
      values: |-

        defaultPodOptions:
          securityContext:
            runAsUser: 0
            runAsGroup: 0

        controllers:
          resilio:
            # Scaled to 0 2026-09-26: temporary node-capacity relief while
            # Altus (single-node) is thermally/resource constrained and a
            # second node is being added -- not needed for day-to-day UX
            # for a few days. Scale replicas back to 1 to resume.
            replicas: 0
            containers:
              resilio:
                image:
                  repository: ghcr.io/linuxserver/resilio-sync
                  tag: 3.1.2
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  PUID: "1024"
                  PGID: "100"
                securityContext:
                  privileged: true

        service:
          resilio:
            controller: resilio
            ports:
              http:
                port: 8888

        ingress:
          resilio:
            className: openshift-default
            annotations:
              route.openshift.io/termination: "edge"
            hosts:
              - host: sync.apps.altus.janz.digital
                paths:
                  - path: /
                    service:
                      identifier: resilio
                      port: http


        persistence:
          config:
            storageClass: lvms-vg1
            accessMode: ReadWriteOnce
            globalMounts:
              - path: /config
            size: 5Gi
          media:
            storageClass: synology-nfs-storage
            accessMode: ReadWriteOnce
            size: 10Gi
            globalMounts:
              - path: /media
          downloads:
            storageClass: synology-nfs-storage
            accessMode: ReadWriteOnce
            globalMounts:
              - path: /downloads
            size: 10Gi
          sync:
            storageClass: synology-nfs-storage
            accessMode: ReadWriteOnce
            globalMounts:
              - path: /sync
            size: 10Gi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
