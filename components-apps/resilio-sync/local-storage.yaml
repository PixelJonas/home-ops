# Static local storage on xandar for resilio-sync's sync/downloads/media
# volumes, moved off synology-nfs-storage 2026-10-17: rslsync polling-rescans
# its /sync tree (which contains large .git trees; inotify doesn't work over
# NFS), hammering the NAS with ~3-4k GETATTR/s 24/7. Local disk removes the
# NAS from the hot path.
#
# config also moved here in the same change: it was on lvms-vg1, which
# TopoLVM pins to node altus (no LVM volume group on xandar) -- keeping it
# there while pinning the pod to xandar made the pod unschedulable on either
# node. See backup/config/{local,backblaze}.yaml for the matching VolSync
# copyMethod change (Snapshot -> Direct; local-xandar has no CSI snapshot
# support).
#
# StorageClass local-xandar is owned by components-apps/influxdb3
# (local-storage.yaml) and referenced here by name only -- not redeclared,
# to avoid two Applications owning the same cluster-scoped resource.
#
# Host dirs: /var/mnt/resilio-sync/{sync,downloads,media,config,
# volsync-cache,volsync-cache-b2}, created manually, owned 1024:100 to
# match the container's PUID/PGID (volsync-cache* dirs are restic mover
# scratch space, rebuilt automatically -- no data migration needed there).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: resilio-sync-app-config
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-xandar
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /var/mnt/resilio-sync/config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - xandar
  claimRef:
    namespace: resilio-sync
    name: resilio-sync-app-config
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: volsync-src-config-backup-cache
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-xandar
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /var/mnt/resilio-sync/volsync-cache
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - xandar
  claimRef:
    namespace: resilio-sync
    name: volsync-src-config-backup-cache
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: volsync-src-config-backup-b2-cache
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-xandar
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /var/mnt/resilio-sync/volsync-cache-b2
  nodeAffinity:
    required:
