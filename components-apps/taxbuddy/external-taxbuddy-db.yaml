apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taxbuddy-db-app-secret
  namespace: taxbuddy
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: taxbuddy-db-app-secret
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "taxbuddy"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: TAXBUDDY_POSTGRES_PASSWORD
