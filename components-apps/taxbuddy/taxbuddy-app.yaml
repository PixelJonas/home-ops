apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taxbuddy-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: taxbuddy
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.2.1
    helm:
      values: |-
        defaultPodOptions:
          imagePullSecrets:
            - name: taxbuddy-ghcr-pull-secret

        controllers:
          ingestion-api:
            replicas: 1
            containers:
              ingestion-api:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/ingestion_api
                  digest: "sha256:bfd9832f6bed9c91a98d7f6916c30e2781866669a33ab49497ba16126f8dbdaf"   # PLACEHOLDER — Task 3 / release.yml updates this once real images exist
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://taxbuddy-app-valkey:6379/0
                  POLL_INTERVAL: 15m
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_URL
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_TOKEN
                  PAPERLESS_WEBHOOK_SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_WEBHOOK_SECRET
                  LITELLM_BASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_BASE_URL
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_API_KEY
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10

          doc-pipeline:
            replicas: 1
            containers:
              doc-pipeline:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/doc_pipeline
                  digest: "sha256:ade467b6405ac55deb2aacc052fce7f8b8651272e0d55aa1fa6dd32b7877b09c"   # PLACEHOLDER — Task 3 / release.yml updates this once real images exist
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://taxbuddy-app-valkey:6379/0
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_URL
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_TOKEN
                  DOCLING_URL: http://docling-serve-app.docling-serve.svc.cluster.local:5001
                  DOCLING_SERVE_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: DOCLING_SERVE_API_KEY
                  LITELLM_BASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_BASE_URL
                  TAXBUDDY_LLMCLIENT_LITELLM_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: TAXBUDDY_LLMCLIENT_LITELLM_KEY
                  # Required at startup with no default (doc_pipeline's
                  # Settings.from_env(), per
                  # services/doc_pipeline/src/doc_pipeline/config.py in the
                  # taxbuddy repo) — added as part of Task 6 to close the
                  # home-ops gap left by taxbuddy Task 4's HONCHO_* env
                  # vars. Same in-cluster Honcho service as
                  # taxbuddy-hermes's honcho.json (honcho-app-honcho, not
                  # honcho-app — see taxbuddy-hermes-config.yaml).
                  HONCHO_BASE_URL: http://honcho-app-honcho.honcho.svc:8000
                  HONCHO_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: HONCHO_API_KEY
                  HONCHO_WORKSPACE: taxbuddy
                  HONCHO_OWNER_PEER_ID: jjanz
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - doc_pipeline.healthcheck
                      initialDelaySeconds: 15
                      periodSeconds: 15
                      # taxbuddy#129: process_document jobs now legitimately
                      # run up to 15min (large docling OCR). Under node memory
                      # pressure the exec probe (cold python start + valkey
                      # ping) timed out 3x and kubelet SIGKILLed the worker
                      # mid-job twice in one afternoon — an abandoned-job
                      # limbo RQ retries don't cover. A batch worker that is
                      # slow to answer a ping for a minute is not dead.
                      timeoutSeconds: 10
                      failureThreshold: 6
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - doc_pipeline.healthcheck
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 10

          agent-runtime:
            replicas: 1
            pod:
              # app-template's chart default is false. This controller's
              # startup lifespan calls `oc exec deploy/taxbuddy-hermes-app`
              # (via agent_hermes/adapter.py, to register its cron trigger)
              # using the pod's own in-cluster token -- with no token
              # mounted at all, that call fails at authentication before
              # RBAC is even evaluated, crash-looping the pod on every
              # restart. See taxbuddy/agent-runtime-hermes-exec-rbac.yaml
              # for the matching RBAC grant this token needs.
              automountServiceAccountToken: true
            containers:
              agent-runtime:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/agent_runtime
                  digest: "sha256:844e42e81a62103fa387fa8ba5ce87922ffef814639d4472b1415c3a5b6107df"
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  AGENT_RUNTIME: hermes
                  QUEUE_URL: redis://taxbuddy-app-valkey:6379/0
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_URL
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_TOKEN
                  # P4-T01 [STEUERPAKET] kanban delivery (taxbuddy #67):
                  # base URL used to render the pack Markdown/PDF/ZIP
                  # export links in the kanban task. The owner clicks these
                  # from outside the cluster, so it's the edge-terminated
                  # route, not the in-cluster service.
                  KNOWLEDGE_SERVICE_URL: https://taxbuddy-knowledge.apps.altus.janz.digital
                  HERMES_NAMESPACE: taxbuddy-hermes
                  HERMES_DEPLOYMENT: taxbuddy-hermes-app
                  # taxbuddy P3-T04 (weekly digest): optional cloud-rendered
                  # Kurzüberblick. The narrator receives only structured
                  # aggregates (counts, category labels, statutory deadline
                  # titles/dates, public BMF titles) — never raw documents
                  # or personal line items. llm.yaml ships inside the
                  # agent_runtime image at its WORKDIR (LLMConfig.load()'s
                  # default path). Same secret keys doc_pipeline already
                  # consumes. If LiteLLM is unreachable the digest still
                  # ships without the Kurzüberblick.
                  WEEKLY_DIGEST_LLM_ENABLED: "true"
                  LITELLM_BASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_BASE_URL
                  TAXBUDDY_LLMCLIENT_LITELLM_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: TAXBUDDY_LLMCLIENT_LITELLM_KEY
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10

          # HARD-T02 (taxbuddy #101, ADR-013): scheduled in-cluster
          # extraction-accuracy self-benchmark. Scores the versioned
          # synthetic corpus baked into the image against the real
          # extract/classify stages via in-cluster LiteLLM, checks against
          # the baked-in baseline, and delivers the outcome to the
          # taxbuddy-hermes kanban board (flagged task on regression,
          # heartbeat-only otherwise). Runs under the chart's default
          # taxbuddy-app ServiceAccount, which already holds pods/exec in
          # the taxbuddy-hermes namespace (agent-runtime-hermes-exec-rbac.yaml)
          # — the kanban path shells out via `oc exec`.
          self-benchmark:
            type: cronjob
            cronjob:
              schedule: "23 5 * * 1"
              timeZone: Europe/Berlin
              concurrencyPolicy: Forbid
              successfulJobsHistory: 3
              failedJobsHistory: 5
            pod:
              # Same rationale as agent-runtime above: kanban delivery
              # shells out via `oc exec deploy/taxbuddy-hermes-app` using
              # the pod's own in-cluster token.
              automountServiceAccountToken: true
            containers:
              self-benchmark:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/self_benchmark
                  digest: "sha256:acd2e960805645a0a9ab6a7616149348c93090bcb543b9757085e05616c9d6fb"   # PLACEHOLDER — release.yml pins the real digest on the first taxbuddy main build that includes the self_benchmark image (HARD-T02)
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  LITELLM_BASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_BASE_URL
                  TAXBUDDY_LLMCLIENT_LITELLM_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: TAXBUDDY_LLMCLIENT_LITELLM_KEY
                  # Isolated eval workspace only — the runner refuses to
                  # seed synthetic profiles or fall back to the synthetic
                  # default peer against any other workspace
                  # (self_benchmark.evaluate.require_eval_workspace).
                  HONCHO_BASE_URL: http://honcho-app-honcho.honcho.svc:8000
                  # Workspace-scoped key: in-cluster Honcho runs with
                  # AUTH_USE_AUTH=true (JWTs are per-workspace), so the
                  # doc-pipeline key (scoped to "taxbuddy") cannot touch
                  # the taxbuddy-eval workspace. Separate Doppler key
                  # TAXBUDDY_EVAL_HONCHO_API_KEY scoped to taxbuddy-eval.
                  HONCHO_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: HONCHO_EVAL_API_KEY
                  HONCHO_WORKSPACE: taxbuddy-eval
                  HERMES_NAMESPACE: taxbuddy-hermes
                  HERMES_DEPLOYMENT: taxbuddy-hermes-app
                  # Baseline-unchanged runs post a create+immediately-closed
                  # heartbeat task instead of staying fully silent.
                  SELF_BENCHMARK_HEARTBEAT: "true"

          # P3-T02 (taxbuddy #62): BMF-Schreiben watcher. Polls the BMF
          # "Steuern" RSS topic feed (BMF-Schreiben identified by the
          # /BMF_Schreiben/ URL prefix), classifies relevance via the
          # `classification` LLM role, writes relevant Schreiben as
          # knowledge candidates with status=proposed (never
          # auto-published, owner-confirm gate per taxbuddy #56), and posts
          # one [WISSEN] summary task to the taxbuddy-hermes kanban
          # (kanban-only delivery per taxbuddy #59) — same pods/exec RBAC
          # and oc-exec path as self-benchmark above. 2x/day is ample: the
          # feed publishes 1-3 Schreiben/week and carries ~20 items.
          # Manual re-trigger:
          #   oc create job --from=cronjob/taxbuddy-app-bmf-watcher \
          #     bmf-watcher-manual-$(date +%s) -n taxbuddy
          bmf-watcher:
            type: cronjob
            cronjob:
              schedule: "23 6,18 * * *"
              timeZone: Europe/Berlin
              concurrencyPolicy: Forbid
              successfulJobsHistory: 3
              failedJobsHistory: 5
              backoffLimit: 1
            pod:
              # Kanban delivery shells out via
              # `oc exec deploy/taxbuddy-hermes-app` using the pod's own
              # in-cluster token (same rationale as agent-runtime above).
              automountServiceAccountToken: true
            containers:
              bmf-watcher:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/knowledge_service
                  digest: "sha256:07694b93e89438d4ebcc9cfcc5816e8439cc0006492ef6cbf5534820dddc9dfc"   # PLACEHOLDER — release.yml pins the real digest on the first taxbuddy main build that includes the watcher (P3-T02)
                  pullPolicy: IfNotPresent
                # The image's default CMD is the HTTP service; the watcher
                # is a one-shot module entry point.
                command:
                  - python
                  - -m
                  - knowledge_service.watchers.bmf_rss
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  LITELLM_BASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_BASE_URL
                  TAXBUDDY_LLMCLIENT_LITELLM_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: TAXBUDDY_LLMCLIENT_LITELLM_KEY
                  HERMES_NAMESPACE: taxbuddy-hermes
                  HERMES_DEPLOYMENT: taxbuddy-hermes-app
                resources:
                  requests:
                    cpu: 10m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi

          # OPS-T01 (taxbuddy #118): knowledge-service HTTP API. Serves
          # GET /knowledge/items (the bmf-watcher's proposed candidates,
          # P3-T02) and the per-Anlage pack endpoints (JSON overview,
          # Belegverzeichnis MD/PDF, Paperless ZIP bundle) from P4-T01.
          # Same image as the bmf-watcher CronJob — its default CMD is
          # this HTTP service. release.yml's digest regex replaces ALL
          # `repository:` + `digest:` occurrences of the knowledge_service
          # image in this file, so both blocks stay on the same digest
          # without a #100-style regex extension.
          knowledge-service:
            replicas: 1
            containers:
              knowledge-service:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/knowledge_service
                  digest: "sha256:07694b93e89438d4ebcc9cfcc5816e8439cc0006492ef6cbf5534820dddc9dfc"   # taxbuddy@04e4d97 (release run 35530978907); release.yml bumps on subsequent main builds
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  # Only the pack ZIP bundle endpoint
                  # (/packs/<jahr>/<anlage>/belege.zip) and the Beleg links
                  # in the indexes call Paperless; generation itself runs
                  # off the DB mirror.
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_URL
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_TOKEN
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10

          web-ui:
            replicas: 1
            containers:
              web-ui:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/web_ui
                  digest: "sha256:a738036eb9b5ad9e2cb4fd1d9639420f0523b90bbd8fae8a4c1afceaf79cf2cf"   # taxbuddy@880356a (P3-T07 merge, release run 35509422405); later bumps come from release.yml
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10

          valkey:
            containers:
              valkey:
                image:
                  repository: valkey/valkey
                  tag: 9.1.1
                  pullPolicy: IfNotPresent
                args:
                  - valkey-server
                  - --appendonly
                  - "yes"
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 5
                      periodSeconds: 5

          # Daily Actual Budget -> tax.transactions mirror sync (taxbuddy
          # repo services/sync_worker, ADR-0020 / P2-T04). One-shot pod; the
          # app exits non-zero if any bank fails, so the CronJob records the
          # failure. 05:15 Berlin — offset from the actual-budget volsync
          # backup at 05:00. PSD2's 4x/day background cap is safely met.
          # Manual re-trigger:
          #   oc create job --from=cronjob/taxbuddy-app-sync-worker \
          #     taxbuddy-sync-manual-$(date +%s) -n taxbuddy
          # Digest: same placeholder convention as the other controllers —
          # taxbuddy's release.yml regex-matches `repository:` + `digest:`
          # for sync_worker in this file and opens an auto-merging bump PR
          # against home-ops on every taxbuddy main build.
          sync-worker:
            type: cronjob
            cronjob:
              schedule: "15 5 * * *"
              timeZone: Europe/Berlin
              concurrencyPolicy: Forbid
              successfulJobsHistory: 3
              failedJobsHistory: 3
              backoffLimit: 1
            containers:
              sync-worker:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/sync_worker
                  digest: "sha256:d0a72eaf3837a922365703d282d0abd6a648b383381246b6eadd86bf3fc43e6f"   # sync_worker image built from taxbuddy@6828175 (release run 35439547642); release.yml bumps on subsequent main builds
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  # In-cluster service of the actual-budget app (cross-
                  # namespace; no route round-trip). Service name is
                  # `actual-budget-app` (bjw-s app-template release name) —
                  # verified via in-cluster DNS resolution.
                  ACTUAL_SERVER_URL: http://actual-budget-app.actual-budget.svc:5006
                  ACTUAL_PASSWORD_FILE: /secrets/actual-sync/password
                  # Budget sync ID — from the ESO-managed secret; sourced
                  # from Doppler key ACTUAL_BUDGET_SYNC_ID (see
                  # external-taxbuddy-actual-sync.yaml).
                  ACTUAL_SYNC_ID:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-actual-sync
                        key: ACTUAL_SYNC_ID
                  # The CLI downloads a local budget replica per call —
                  # keep it on the (writable) emptyDir-backed /tmp, not in
                  # $HOME assumptions of the UBI9 image.
                  ACTUAL_DATA_DIR: /tmp/actual-data
                resources:
                  requests:
                    cpu: 10m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi

        service:
          ingestion-api:
            controller: ingestion-api
            ports:
              http:
                port: 8000
          knowledge-service:
            controller: knowledge-service
            ports:
              http:
                port: 8000
          web-ui:
            controller: web-ui
            ports:
              http:
                port: 8000
          valkey:
            controller: valkey
            ports:
              redis:
                port: 6379

        ingress:
          web-ui:
            enabled: true
            className: openshift-default
            annotations:
              route.openshift.io/termination: "edge"
            hosts:
              - host: taxbuddy.apps.altus.janz.digital
                paths:
                  - path: /
                    service:
                      identifier: web-ui
                      port: http
          # Edge-terminated like web-ui: the pack export links the
          # agent-runtime renders into [STEUERPAKET] kanban tasks
          # (KNOWLEDGE_SERVICE_URL) must resolve from outside the cluster.
          knowledge-service:
            enabled: true
            className: openshift-default
            annotations:
              route.openshift.io/termination: "edge"
            hosts:
              - host: taxbuddy-knowledge.apps.altus.janz.digital
                paths:
                  - path: /
                    service:
                      identifier: knowledge-service
                      port: http

        persistence:
          valkey-data:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: lvms-vg1
            size: 1Gi
            advancedMounts:
              valkey:
                valkey:
                  - path: /data
          # ACTUAL_BUDGET_PASSWORD mounted as a file for the sync worker's
          # ACTUAL_PASSWORD_FILE (CLI 26.9.0 has no working _FILE support;
          # the actual_client wrapper reads the file itself).
          actual-sync-credentials:
            enabled: true
            type: secret
            name: taxbuddy-actual-sync
            items:
              - key: ACTUAL_BUDGET_PASSWORD
                path: password
            advancedMounts:
              sync-worker:
                sync-worker:
                  - path: /secrets/actual-sync
                    readOnly: true

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
