apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taxbuddy-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: taxbuddy
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.1.0
    helm:
      values: |-
        defaultPodOptions:
          imagePullSecrets:
            - name: taxbuddy-ghcr-pull-secret

        controllers:
          ingestion-api:
            replicas: 1
            containers:
              ingestion-api:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/ingestion_api
                  digest: "sha256:1ac15fc43cd7519f7ca1e5305af60ea14a72be304e2e3ed8f9f9f74439267b1e"   # PLACEHOLDER — Task 3 / release.yml updates this once real images exist
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://taxbuddy-app-valkey:6379/0
                  POLL_INTERVAL: 15m
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_URL
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_TOKEN
                  PAPERLESS_WEBHOOK_SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_WEBHOOK_SECRET
                  LITELLM_BASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_BASE_URL
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_API_KEY
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10

          doc-pipeline:
            replicas: 1
            containers:
              doc-pipeline:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/doc_pipeline
                  digest: "sha256:acb377cd5049cbf40558b46df4b21d9ba85da2bc69230bc5f1e6b15ccf90c44d"   # PLACEHOLDER — Task 3 / release.yml updates this once real images exist
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://taxbuddy-app-valkey:6379/0
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_URL
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_TOKEN
                  DOCLING_URL: http://docling-serve-app.docling-serve.svc.cluster.local:5001
                  DOCLING_SERVE_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: DOCLING_SERVE_API_KEY
                  LITELLM_BASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_BASE_URL
                  TAXBUDDY_LLMCLIENT_LITELLM_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: TAXBUDDY_LLMCLIENT_LITELLM_KEY
                  # Required at startup with no default (doc_pipeline's
                  # Settings.from_env(), per
                  # services/doc_pipeline/src/doc_pipeline/config.py in the
                  # taxbuddy repo) — added as part of Task 6 to close the
                  # home-ops gap left by taxbuddy Task 4's HONCHO_* env
                  # vars. Same in-cluster Honcho service as
                  # taxbuddy-hermes's honcho.json (honcho-app-honcho, not
                  # honcho-app — see taxbuddy-hermes-config.yaml).
                  HONCHO_BASE_URL: http://honcho-app-honcho.honcho.svc:8000
                  HONCHO_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: HONCHO_API_KEY
                  HONCHO_WORKSPACE: taxbuddy
                  HONCHO_OWNER_PEER_ID: jjanz
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - doc_pipeline.healthcheck
                      initialDelaySeconds: 15
                      periodSeconds: 15
                      timeoutSeconds: 5
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - doc_pipeline.healthcheck
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5

          agent-runtime:
            replicas: 1
            pod:
              # app-template's chart default is false. This controller's
              # startup lifespan calls `oc exec deploy/taxbuddy-hermes-app`
              # (via agent_hermes/adapter.py, to register its cron trigger)
              # using the pod's own in-cluster token -- with no token
              # mounted at all, that call fails at authentication before
              # RBAC is even evaluated, crash-looping the pod on every
              # restart. See taxbuddy/agent-runtime-hermes-exec-rbac.yaml
              # for the matching RBAC grant this token needs.
              automountServiceAccountToken: true
            containers:
              agent-runtime:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/agent_runtime
                  digest: "sha256:b51d505a7fbbea878fe99d0c4df31af892cb23750317e8e14360845f8bb923e6"
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  AGENT_RUNTIME: hermes
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_URL
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_TOKEN
                  HERMES_NAMESPACE: taxbuddy-hermes
                  HERMES_DEPLOYMENT: taxbuddy-hermes-app
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10

          valkey:
            containers:
              valkey:
                image:
                  repository: valkey/valkey
                  tag: 9.1.1
                  pullPolicy: IfNotPresent
                args:
                  - valkey-server
                  - --appendonly
                  - "yes"
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 5
                      periodSeconds: 5

        service:
          ingestion-api:
            controller: ingestion-api
            ports:
              http:
                port: 8000
          valkey:
            controller: valkey
            ports:
              redis:
                port: 6379

        persistence:
          valkey-data:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: lvms-vg1
            size: 1Gi
            advancedMounts:
              valkey:
                valkey:
                  - path: /data

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
