apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taxbuddy-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: taxbuddy
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 4.6.2
    helm:
      values: |-
        defaultPodOptions:
          imagePullSecrets:
            - name: taxbuddy-ghcr-pull-secret

        controllers:
          ingestion-api:
            replicas: 1
            containers:
              ingestion-api:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/ingestion_api
                  digest: "sha256:42d59f483b3d882afbc00631988809bdd10f0113c6b744d5a6a58bb36dd4f03c"   # PLACEHOLDER — Task 3 / release.yml updates this once real images exist
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://taxbuddy-app-valkey:6379/0
                  POLL_INTERVAL: 15m
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_URL
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_TOKEN
                  PAPERLESS_WEBHOOK_SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_WEBHOOK_SECRET
                  LITELLM_BASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_BASE_URL
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_API_KEY
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10

          doc-pipeline:
            replicas: 1
            containers:
              doc-pipeline:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/doc_pipeline
                  digest: "sha256:b8cbd16818e5f29d19a4cfc6ca8db160f169f6a04a6d246f950b6a05cb41b609"   # PLACEHOLDER — Task 3 / release.yml updates this once real images exist
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  QUEUE_URL: redis://taxbuddy-app-valkey:6379/0
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_URL
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_TOKEN
                  DOCLING_URL: http://docling-serve-app.docling-serve.svc.cluster.local:5001
                  DOCLING_SERVE_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: DOCLING_SERVE_API_KEY
                  LITELLM_BASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: LITELLM_BASE_URL
                  TAXBUDDY_LLMCLIENT_LITELLM_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: TAXBUDDY_LLMCLIENT_LITELLM_KEY
                  # Required at startup with no default (doc_pipeline's
                  # Settings.from_env(), per
                  # services/doc_pipeline/src/doc_pipeline/config.py in the
                  # taxbuddy repo) — added as part of Task 6 to close the
                  # home-ops gap left by taxbuddy Task 4's HONCHO_* env
                  # vars. Same in-cluster Honcho service as
                  # taxbuddy-hermes's honcho.json (honcho-app-honcho, not
                  # honcho-app — see taxbuddy-hermes-config.yaml).
                  HONCHO_BASE_URL: http://honcho-app-honcho.honcho.svc:8000
                  HONCHO_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: HONCHO_API_KEY
                  HONCHO_WORKSPACE: taxbuddy
                  HONCHO_OWNER_PEER_ID: jjanz
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - doc_pipeline.healthcheck
                      initialDelaySeconds: 15
                      periodSeconds: 15
                      timeoutSeconds: 5
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - python3
                          - -m
                          - doc_pipeline.healthcheck
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5

          agent-runtime:
            replicas: 1
            containers:
              agent-runtime:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/agent_runtime
                  digest: "sha256:1d877ce1eb201454bd6cb840cf521f5e451d3a7ecd3d823901344a720e1d1469"
                  pullPolicy: IfNotPresent
                env:
                  TZ: Europe/Berlin
                  AGENT_RUNTIME: hermes
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-db-connection
                        key: uri
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_URL
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-credentials
                        key: PAPERLESS_TOKEN
                  HERMES_NAMESPACE: taxbuddy-hermes
                  HERMES_DEPLOYMENT: taxbuddy-hermes-app
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10

          valkey:
            containers:
              valkey:
                image:
                  repository: valkey/valkey
                  tag: 8.1.9
                  pullPolicy: IfNotPresent
                args:
                  - valkey-server
                  - --appendonly
                  - "yes"
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - valkey-cli
                          - ping
                      initialDelaySeconds: 5
                      periodSeconds: 5

        service:
          ingestion-api:
            controller: ingestion-api
            ports:
              http:
                port: 8000
          valkey:
            controller: valkey
            ports:
              redis:
                port: 6379

        persistence:
          valkey-data:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: lvms-vg1
            size: 1Gi
            advancedMounts:
              valkey:
                valkey:
                  - path: /data

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
