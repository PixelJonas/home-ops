apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taxbuddy-agent-runtime-hermes-exec
  namespace: taxbuddy-hermes
  annotations:
    argocd.argoproj.io/sync-wave: "30"
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taxbuddy-agent-runtime-hermes-exec
  namespace: taxbuddy-hermes
  annotations:
    argocd.argoproj.io/sync-wave: "30"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: taxbuddy-agent-runtime-hermes-exec
subjects:
  - kind: ServiceAccount
    name: taxbuddy-app
    namespace: taxbuddy
