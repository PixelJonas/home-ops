apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-taxbuddy-credentials
  namespace: taxbuddy
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: taxbuddy-credentials
  data:
    - secretKey: PAPERLESS_URL
      remoteRef:
        key: TAXBUDDY_PAPERLESS_URL
    - secretKey: PAPERLESS_TOKEN
      remoteRef:
        key: TAXBUDDY_PAPERLESS_TOKEN
    - secretKey: LITELLM_BASE_URL
      remoteRef:
        key: TAXBUDDY_LITELLM_BASE_URL
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: TAXBUDDY_DOCPIPELINE_LITELLM_KEY
    - secretKey: PAPERLESS_WEBHOOK_SECRET
      remoteRef:
        key: TAXBUDDY_PAPERLESS_WEBHOOK_SECRET
    # Shared secret for taxbuddy's POST /intake/ingestbuddy (taxbuddy#109).
    # Deliberately the SAME Doppler key ingestbuddy already sends as its
    # TAXBUDDY_WEBHOOK_SECRET (components-apps/ingestbuddy) — one value,
    # both sides. Setting it enables the endpoint (unset → 503).
    - secretKey: INGESTBUDDY_INTAKE_SECRET
      remoteRef:
        key: TAXBUDDY_INGESTBUDDY_WEBHOOK_SECRET
    - secretKey: DOCLING_SERVE_API_KEY
      remoteRef:
        key: TAXBUDDY_DOCLING_SERVE_API_KEY
    - secretKey: TAXBUDDY_LLMCLIENT_LITELLM_KEY
      remoteRef:
        key: TAXBUDDY_LLMCLIENT_LITELLM_KEY
    # lookup-mcp (taxbuddy#154): read-only Qdrant key, bge-m3-only LiteLLM
    # key (one key per consumer), and the bearer token Hermes presents.
    - secretKey: QDRANT_READ_ONLY_API_KEY
      remoteRef:
        key: QDRANT_READ_ONLY_API_KEY
    - secretKey: LOOKUP_MCP_LITELLM_KEY
      remoteRef:
        key: TAXBUDDY_LOOKUP_MCP_LITELLM_KEY
    - secretKey: LOOKUP_MCP_TOKEN
      remoteRef:
        key: TAXBUDDY_LOOKUP_MCP_TOKEN
    - secretKey: HONCHO_API_KEY
      remoteRef:
        key: TAXBUDDY_DOCPIPELINE_HONCHO_API_KEY
    # Scoped to the isolated taxbuddy-eval Honcho workspace (in-cluster
    # Honcho runs AUTH_USE_AUTH=true with per-workspace JWTs) — consumed
    # only by the self-benchmark CronJob (HARD-T02), which must not use
    # the production-workspace key above.
    - secretKey: HONCHO_EVAL_API_KEY
      remoteRef:
        key: TAXBUDDY_EVAL_HONCHO_API_KEY
