apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: taxbuddy-db
  namespace: taxbuddy
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  instances: 1
  enablePDB: false
  bootstrap:
    initdb:
      database: taxbuddy
      owner: taxbuddy
      secret:
        name: taxbuddy-db-app-secret
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  storage:
    size: 10Gi
    storageClass: lvms-vg1

  # Loosen probe timeouts so transient node contention on Altus (CPU/IO
  # pressure from other workloads) doesn't trip the liveness probe and
  # force a full postgres pod restart. Defaults are timeoutSeconds: 5,
  # failureThreshold derived from livenessProbeTimeout=30s (~3 failures).
  probes:
    liveness:
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 5
