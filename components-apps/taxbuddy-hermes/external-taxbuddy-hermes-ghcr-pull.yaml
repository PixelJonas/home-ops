apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taxbuddy-hermes-ghcr-pull-secret
  namespace: taxbuddy-hermes
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: taxbuddy-hermes-ghcr-pull-secret
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"PixelJonas","password":"{{ .token }}","auth":"{{ printf "PixelJonas:%s" .token | b64enc }}"}}}
  # Same Doppler key as components-apps/taxbuddy/external-taxbuddy-ghcr-pull.yaml
  # — the token is a package-scoped GHCR pull token, not namespace-scoped.
  # Needed because ghcr.io/pixeljonas/taxbuddy-hermes-tools is private (new
  # GHCR packages default to private).
  data:
    - secretKey: token
      remoteRef:
        key: TAXBUDDY_GHCR_PULL_TOKEN
