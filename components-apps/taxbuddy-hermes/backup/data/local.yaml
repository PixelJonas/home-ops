- op: replace
  path: /spec/sourcePVC
  value: taxbuddy-hermes-app
- op: replace
  path: /spec/restic/repository
  value: restic-config-data

# lvms-vg1 supports CSI snapshots (VolumeSnapshotClass lvms-vg1), so back
# up from a point-in-time snapshot instead of mounting the live RWO PVC
# (same fleet convention as tymeslot/actual-budget data-backup).
- op: add
  path: /spec/restic/copyMethod
  value: Snapshot
- op: add
  path: /spec/restic/volumeSnapshotClassName
  value: lvms-vg1

# /opt/data is owned by the hermes user (uid/gid 10000) with mode 0700, so
# the mover must run as that uid to read it. The mover ServiceAccount
# (volsync-src-data-backup) is granted anyuid in ../../anyuid-rolebinding.yaml.
# No fsGroup (backup strategy 1.9, 2026-11-02): every file is owned by uid
# 10000, so runAsUser alone reads it, and an fsGroup walk would rewrite
# group/mode/setgid bits in the snapshot clone and so in the backup. anyuid
# (fsGroup RunAsAny) injects none.
- op: add
  path: /spec/restic/moverSecurityContext
  value:
    runAsUser: 10000
    runAsGroup: 10000
