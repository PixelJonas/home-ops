apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taxbuddy-hermes-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: taxbuddy-hermes
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.3.0
    helm:
      values: |-
        controllers:
          hermes:
            replicas: 1
            pod:
              # Live finding (2026-10-01): hermes lazy-installs optional
              # dependencies with uv, a static musl binary. With the default
              # ndots:5, "pypi.org"
              # is first tried with search suffixes, and
              # pypi.org.altus.janz.digital answers NOERROR/NODATA — glibc
              # moves on, musl stops ("Name has no usable address"). ndots:1
              # makes external names resolve as absolute first; in-cluster
              # names like litellm-app.litellm.svc still fall back to the
              # search list (verified with a throwaway pod).
              dnsConfig:
                options:
                  - name: ndots
                    value: "1"
              # ghcr.io/pixeljonas/taxbuddy-hermes-tools is private; the
              # pull secret comes from external-taxbuddy-hermes-ghcr-pull.yaml.
              imagePullSecrets:
                - name: taxbuddy-hermes-ghcr-pull-secret
              # The tools sidecar keeps kubectl + this token for ad-hoc
              # admin panes (kubectl exec into the hermes container for
              # debugging; RBAC: tools-exec-rbac.yaml). The Hermes TUI
              # itself runs natively in the tools container — see the
              # tools container comment below.
              automountServiceAccountToken: true
            initContainers:
              # Live finding (2026-07-28, Task B verification): mounting
              # the ConfigMap's config.yaml directly onto
              # /opt/data/config.yaml (even without `readOnly: true`) is
              # inherently immutable — Kubernetes ConfigMap volumes are
              # always read-only at the projected-volume level regardless
              # of the volumeMount's readOnly field. Hermes's own startup
              # runs a config-schema migrator that rewrites config.yaml in
              # place on every boot; with the file ConfigMap-mounted this
              # failed every time with "ERROR: [Errno 30] Read-only file
              # system: '/opt/data/config.yaml'" (non-fatal — the gateway
              # still started and the config values still loaded — but it
              # would accumulate .bak-<timestamp> cruft forever and would
              # silently swallow any real future schema migration). Fixed
              # by seeding a real, writable copy onto the PVC from an
              # init container instead of mounting the ConfigMap directly
              # into the main container.
              init-config:
                image:
                  repository: nousresearch/hermes-agent
                  tag: v2026.9.24
                  pullPolicy: IfNotPresent
                command:
                  - /bin/sh
                  - -c
                # Seed SOUL.md alongside config.yaml as a writable PVC copy.
                args:
                  - >-
                    cp /opt/hermes-config-seed/config.yaml /opt/data/config.yaml &&
                    cp /opt/hermes-config-seed/SOUL.md /opt/data/SOUL.md
              # Publishes the static moshi-hook binary onto a shared
              # emptyDir so the moshi-hooks plugin running INSIDE the hermes
              # (and dashboard) container can exec it at the same absolute
              # path the plugin embedded at install time
              # (/opt/tools-bin/moshi-hook). The binary is fully static
              # (pure Go), so it runs fine on the hermes image's musl.
              # Also prepares shared-dir ownership the uid-10000 tools
              # container can't set itself: /run/moshi must be writable by
              # 10000 (moshi-hook socket is created there), /run/sshd must
              # exist root-owned (sshd privilege-separation dir). Runs as
              # root (anyuid SCC), same as init-config.
              tools-bin-init:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy-hermes-tools
                  tag: latest
                  pullPolicy: Always
                command:
                  - /bin/sh
                  - -c
                args:
                  - >-
                    cp /usr/local/bin/moshi-hook /opt/tools-bin/moshi-hook &&
                    chown 10000:10000 /run/moshi &&
                    mkdir -p /run/sshd
              # taxbuddy ADR-0028: installs the taxbuddy-inbox Hermes plugin
              # (Telegram notices, review buttons, reply routing) from the
              # agent_runtime image, which ships it at
              # /app/hermes-plugins/taxbuddy-inbox. Pin the SAME digest as
              # agent-runtime in components-apps/taxbuddy/taxbuddy-app.yaml and
              # bump both together. Runs as root (anyuid SCC) and chowns to
              # the hermes uid: agent_runtime's `oc exec` runs the hermes CLI
              # as root, so a root-written __pycache__ could otherwise be left
              # in the plugin dir and break a uid-10000 `rm -rf` on restart.
              install-taxbuddy-inbox:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy/agent_runtime
                  digest: "sha256:380f963eb462e4e2ec4e73fad16749022a8b88b0c30faa5954939529e45d828b"
                  pullPolicy: IfNotPresent
                command:
                  - /bin/sh
                  - -c
                args:
                  - >-
                    rm -rf /opt/data/plugins/taxbuddy-inbox &&
                    mkdir -p /opt/data/plugins &&
                    cp -r /app/hermes-plugins/taxbuddy-inbox /opt/data/plugins/taxbuddy-inbox &&
                    chown -R 10000:10000 /opt/data/plugins/taxbuddy-inbox
                securityContext:
                  runAsUser: 0
            containers:
              hermes:
                image:
                  repository: nousresearch/hermes-agent
                  tag: v2026.9.24
                  pullPolicy: IfNotPresent
                # The image's ENTRYPOINT is a fixed s6-overlay wrapper
                # (/init main-wrapper.sh); it needs an explicit `gateway
                # run` argument to boot the long-running gateway process
                # (confirmed against the image's real docker-run examples
                # in NousResearch/hermes-agent's docker.md) — the plan's
                # original draft omitted this and the pod would not have
                # started the right process without it.
                args:
                  - gateway
                  - run
                env:
                  TZ: Europe/Berlin
                  # HERMES_HOME already defaults to /opt/data in the
                  # official image (paired with HERMES_WRITE_SAFE_ROOT) —
                  # set explicitly here for clarity, not because the
                  # default is wrong. The plan's original HERMES_DATA_DIR
                  # var does not exist in the real image; corrected here.
                  HERMES_HOME: /opt/data
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: LITELLM_API_KEY
                  # Bearer token for the taxbuddy lookup-mcp server,
                  # interpolated as ${LOOKUP_MCP_TOKEN} in config.yaml's
                  # mcp_servers headers (taxbuddy#154).
                  LOOKUP_MCP_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: LOOKUP_MCP_TOKEN
                  # Points the moshi-hooks plugin's helper subprocess at the
                  # moshi-hook daemon's socket (shared emptyDir; the daemon
                  # itself runs in the tools sidecar). Verified upstream:
                  # the plugin execs its helper with the inherited process
                  # env, and the helper honors MOSHI_SOCKET_PATH.
                  # taxbuddy ADR-0028: Telegram gateway (long polling, owner-only).
                  TELEGRAM_BOT_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: TELEGRAM_BOT_TOKEN
                  TELEGRAM_ALLOWED_USERS:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: TELEGRAM_OWNER_ID
                  TELEGRAM_HOME_CHANNEL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: TELEGRAM_OWNER_ID
                  MOSHI_SOCKET_PATH: /run/moshi/moshi-hook.sock
                  # Voice-note STT through LiteLLM (model whisper-large-v3 ->
                  # asgard). Hermes reads STT_OPENAI_* once at import; without
                  # the base URL the OpenAI STT path targets api.openai.com.
                  # The key is the same LiteLLM virtual key (taxbuddy-hermes,
                  # allowed models include whisper-large-v3).
                  STT_OPENAI_BASE_URL: http://litellm-app.litellm.svc:4000/v1
                  STT_OPENAI_MODEL: whisper-large-v3
                  VOICE_TOOLS_OPENAI_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: LITELLM_API_KEY
              dashboard:
                # `hermes gateway run` does not start the web dashboard —
                # confirmed live (2026-07-29) via `hermes dashboard
                # --status` returning "No hermes dashboard processes
                # running" while the gateway itself was up. It's a
                # separate process (`hermes dashboard`, real CLI verified
                # live: --host/--port/--no-open, default port 9119).
                # Runs as a second container in the SAME pod as the
                # gateway (not a separate controller) because the
                # `hermes-data` PVC is ReadWriteOnce (lvms-vg1 storage
                # class) — kanban.db and other shared state can only be
                # mounted by one pod at a time, so both processes must
                # share this pod.
                image:
                  repository: nousresearch/hermes-agent
                  tag: v2026.9.24
                  pullPolicy: IfNotPresent
                args:
                  - dashboard
                  - --host
                  - "0.0.0.0"
                  - --port
                  - "9119"
                  - --no-open
                env:
                  TZ: Europe/Berlin
                  HERMES_HOME: /opt/data
                  # Real env var names confirmed live by reading
                  # /opt/hermes/plugins/dashboard_auth/basic/__init__.py
                  # in the running pod — NOT the DASHBOARD_PASSWORD shape
                  # the personal hermes-user1/2 instances' secret names
                  # suggested. `--insecure` is a no-op as of the June 2026
                  # hardening: a non-loopback bind always requires an
                  # auth provider.
                  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: jonas
                  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: DASHBOARD_PASSWORD
                  # Dashboard chats run the agent in THIS process, so it
                  # needs the same provider credentials as the gateway.
                  # Without them config.yaml's `key_env: LITELLM_API_KEY`
                  # resolves empty and Hermes sends its `no-key-required`
                  # placeholder -> LiteLLM 401 "Virtual Key expected".
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: LITELLM_API_KEY
                  # Bearer token for the taxbuddy lookup-mcp server,
                  # interpolated as ${LOOKUP_MCP_TOKEN} in config.yaml's
                  # mcp_servers headers (taxbuddy#154).
                  LOOKUP_MCP_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: LOOKUP_MCP_TOKEN
                  # ADR-0028: agent_runtime's `oc exec … hermes taxbuddy-inbox notify` lands in
                  # this (first) container, so the plugin CLI needs the bot env here too.
                  TELEGRAM_BOT_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: TELEGRAM_BOT_TOKEN
                  TELEGRAM_ALLOWED_USERS:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: TELEGRAM_OWNER_ID
                  TELEGRAM_HOME_CHANNEL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: TELEGRAM_OWNER_ID
                  # Same as on the hermes container: dashboard-spawned chat
                  # sessions load the moshi-hooks plugin too.
                  MOSHI_SOCKET_PATH: /run/moshi/moshi-hook.sock
              # Tools sidecar: sshd (2222, key-only) + `herdr server` +
              # `moshi-hook serve`. This turns the pod into its own
              # Moshi-paired host and a herdr "machine" reachable from
              # knowhere over the pod network (ClusterIP service `herdr`
              # below, no route). The image also ships hermes-agent itself:
              # herdr panes run the Hermes TUI as a NATIVE pane process
              # (/usr/local/bin/hermes-tui) sharing HERMES_HOME over the
              # PVC — a kubectl-exec'd TUI is invisible to herdr's
              # process-based agent detection (live finding 2026-10-02),
              # and the pane env natively carries HERDR_* for the
              # herdr-agent-state plugin. moshi-hook's verified-pane
              # approval bridge gets a local herdr pane to drive.
              # Runs as uid 10000 to match the hermes process: the
              # moshi-hook socket is 0600 owner-only, and /opt/data is
              # 0700 hermes:hermes.
              tools:
                image:
                  repository: ghcr.io/pixeljonas/taxbuddy-hermes-tools
                  tag: latest
                  pullPolicy: Always
                command:
                  - /opt/tools/entrypoint.sh
                securityContext:
                  runAsUser: 10000
                  runAsGroup: 10000
                env:
                  TZ: Europe/Berlin
                  # HOME, moshi state and ssh host keys all live on the
                  # PVC so herdr session state and the Moshi pairing
                  # survive pod restarts.
                  HOME: /opt/data/tools/home
                  # Mounted at the same absolute path as in the hermes
                  # container on purpose: Chat View opens the
                  # plugin-reported $HERMES_HOME/state.db from THIS
                  # container's filesystem.
                  HERMES_HOME: /opt/data
                  # The official nousresearch/hermes-agent image sets a writable
                  # lazy-install target by default; this separate plain-Debian
                  # tools image does not. Keep optional dependencies on the
                  # existing PVC, and disable lazy installs in the tools container
                  # because its venv is root-owned and uid 10000 cannot write to it.
                  HERMES_LAZY_INSTALL_TARGET: /opt/data/lazy-packages
                  HERMES_DISABLE_LAZY_INSTALLS: "1"
                  MOSHI_SOCKET_PATH: /run/moshi/moshi-hook.sock
                  MOSHI_STATE_DIR: /opt/data/tools/moshi-state
                  MOSHI_CONFIG_DIR: /opt/data/tools/moshi-config
                  # The native TUI in this container runs the agent in THIS
                  # process, so it needs the same provider credentials as the
                  # gateway and dashboard — without them config.yaml's
                  # `key_env: LITELLM_API_KEY` resolves empty and Hermes
                  # sends its `no-key-required` placeholder -> LiteLLM 401
                  # "Virtual Key expected" (live finding 2026-10-02, same
                  # failure mode as the dashboard container above).
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: LITELLM_API_KEY
                  LOOKUP_MCP_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: LOOKUP_MCP_TOKEN
                  # ADR-0028: TUI sessions in this container load the taxbuddy-inbox plugin too.
                  TELEGRAM_BOT_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: TELEGRAM_BOT_TOKEN
                  TELEGRAM_ALLOWED_USERS:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: TELEGRAM_OWNER_ID
                  TELEGRAM_HOME_CHANNEL:
                    valueFrom:
                      secretKeyRef:
                        name: taxbuddy-hermes-credentials
                        key: TELEGRAM_OWNER_ID

        persistence:
          hermes-data:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: lvms-vg1
            size: 5Gi
            advancedMounts:
              hermes:
                hermes:
                  - path: /opt/data
                init-config:
                  - path: /opt/data
                install-taxbuddy-inbox:
                  - path: /opt/data
                dashboard:
                  - path: /opt/data
                tools:
                  - path: /opt/data
          hermes-config:
            enabled: true
            type: configMap
            name: taxbuddy-hermes-config
            advancedMounts:
              hermes:
                init-config:
                  - path: /opt/hermes-config-seed
                    readOnly: true
          # moshi-hook daemon socket, shared between the tools sidecar
          # (runs the daemon) and the hermes/dashboard containers (the
          # moshi-hooks plugin's helper connects here). emptyDir — a
          # socket does not belong on the PVC.
          moshi-socket:
            enabled: true
            type: emptyDir
            advancedMounts:
              hermes:
                tools-bin-init:
                  - path: /run/moshi
                hermes:
                  - path: /run/moshi
                dashboard:
                  - path: /run/moshi
                tools:
                  - path: /run/moshi
          # sshd's privilege-separation directory — must exist and be
          # root-owned, so it's a dedicated emptyDir (the tools container
          # runs as uid 10000 and couldn't create it under /run itself).
          sshd-run:
            enabled: true
            type: emptyDir
            advancedMounts:
              hermes:
                tools-bin-init:
                  - path: /run/sshd
                tools:
                  - path: /run/sshd
          # Static moshi-hook binary, populated by the tools-bin-init
          # init container; read-only for consumers.
          tools-bin:
            enabled: true
            type: emptyDir
            advancedMounts:
              hermes:
                tools-bin-init:
                  - path: /opt/tools-bin
                hermes:
                  - path: /opt/tools-bin
                    readOnly: true
                dashboard:
                  - path: /opt/tools-bin
                    readOnly: true
                tools:
                  - path: /opt/tools-bin
                    readOnly: true
          tools-ssh:
            enabled: true
            type: configMap
            name: taxbuddy-hermes-tools-ssh
            advancedMounts:
              hermes:
                tools:
                  - path: /opt/tools-ssh
                    readOnly: true

        service:
          dashboard:
            controller: hermes
            ports:
              http:
                port: 9119
          # ClusterIP only, on purpose — knowhere's primary NIC sits on
          # the pod network (components-infra/knowhere VM, `pod: {}`
          # interface), so `herdr machine add` reaches this service
          # directly and sshd is never exposed outside OpenShift.
          herdr:
            controller: hermes
            ports:
              ssh:
                port: 2222

        ingress:
          dashboard:
            enabled: true
            className: openshift-default
            annotations:
              route.openshift.io/termination: "edge"
            hosts:
              - host: taxbuddy-hermes.apps.altus.janz.digital
                paths:
                  - path: /
                    service:
                      identifier: dashboard
                      port: http

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
