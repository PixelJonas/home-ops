apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-taxbuddy-hermes-credentials
  namespace: taxbuddy-hermes
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: taxbuddy-hermes-credentials
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: TAXBUDDY_HERMES_LITELLM_KEY
    - secretKey: DASHBOARD_PASSWORD
      remoteRef:
        key: TAXBUDDY_HERMES_DASHBOARD_PASSWORD
    - secretKey: LOOKUP_MCP_TOKEN
      remoteRef:
        key: TAXBUDDY_LOOKUP_MCP_TOKEN
    # Read-only token for vehicle-pipeline (its ADR 0005); only the hash is
    # configured there.
    - secretKey: VEHICLE_PIPELINE_TOKEN
      remoteRef:
        key: TAXBUDDY_HERMES_VEHICLE_PIPELINE_TOKEN
    # taxbuddy ADR-0028: Telegram second inbox. The owner's Telegram user id
    # lives in Doppler too (this repo is public); it feeds both the gateway
    # allowlist and the home channel.
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: TAXBUDDY_TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_OWNER_ID
      remoteRef:
        key: TAXBUDDY_TELEGRAM_OWNER_ID
