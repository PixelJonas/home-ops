apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-happier-credentials
  namespace: happier
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: happier-credentials
  data:
    # Server master secret (env name kept from upstream Happy).
    # The light flavor would otherwise auto-generate it into a 0600 file
    # under /data, which a later UID change (e.g. restricted-v2 -> anyuid
    # fallback) could no longer read. Keeping it in Doppler also means a
    # VolSync restore of /data always has its matching secret.
    - secretKey: HANDY_MASTER_SECRET
      remoteRef:
        key: HAPPIER_MASTER_SECRET
