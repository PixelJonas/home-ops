apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vehicle-pipeline-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: vehicle-pipeline
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.1.0
    helm:
      values: |-
        defaultPodOptions:
          imagePullSecrets:
            - name: vehicle-pipeline-ghcr-pull-secret

        controllers:
          app:
            replicas: 1
            containers:
              app:
                image:
                  repository: ghcr.io/pixeljonas/vehicle-pipeline
                  tag: latest
                  pullPolicy: Always
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: vehicle-pipeline-db-app-secret
                        key: uri
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: PAPERLESS_URL}
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: PAPERLESS_TOKEN}
                  PAPERLESS_WEBHOOK_SECRET:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: PAPERLESS_WEBHOOK_SECRET}
                  LITELLM_BASE_URL:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: LITELLM_BASE_URL}
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: LITELLM_API_KEY}
                  MYGARAGE_URL: https://mygarage.apps.altus.janz.digital
                  MYGARAGE_USERNAME:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: MYGARAGE_USERNAME}
                  MYGARAGE_PASSWORD:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: MYGARAGE_PASSWORD}
                  MYGARAGE_VEHICLES:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: MYGARAGE_VEHICLES}
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet: {path: /healthz, port: 8000}
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet: {path: /healthz, port: 8000}
                      initialDelaySeconds: 5
                      periodSeconds: 10
        # Single service, no basic-auth sidecar: /review is intentionally
        # NOT on the public Ingress below. It's reachable only via the
        # Tailscale-operator-exposed Service (tailscale.com/expose),
        # mirroring pricing-tool's `pricing-tool` service (port 8080, no
        # auth sidecar -- "already gated by tailnet membership", per that
        # file's own comment). Caddy on the Synology (itself tailnet-joined)
        # reverse-proxies a public app.janz.digital domain to this
        # Tailscale-only address with Authelia forward-auth in front
        # (see infra-ops docs/authelia-sso-forward-auth-2026-08-31.md) --
        # so nothing outside the cluster can reach /review without going
        # through Authelia first. Only /webhooks and /healthz (which
        # Paperless and kubelet need to reach directly) stay on the public
        # OpenShift Route.
        service:
          app:
            controller: app
            annotations:
              tailscale.com/expose: "true"
              tailscale.com/hostname: "vehicle-pipeline"
            ports:
              http:
                port: 8000

        ingress:
          app:
            enabled: true
            className: openshift-default
            annotations:
              route.openshift.io/termination: "edge"
            hosts:
              - host: vehicle-pipeline.apps.altus.janz.digital
                paths:
                  - path: /webhooks
                    service: {identifier: app, port: http}
                  - path: /healthz
                    service: {identifier: app, port: http}

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
