apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vehicle-pipeline-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: vehicle-pipeline
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.1.0
    helm:
      values: |-
        defaultPodOptions:
          imagePullSecrets:
            - name: vehicle-pipeline-ghcr-pull-secret

        controllers:
          app:
            replicas: 1
            containers:
              app:
                image:
                  repository: ghcr.io/pixeljonas/vehicle-pipeline
                  tag: latest
                  pullPolicy: Always
                env:
                  TZ: Europe/Berlin
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: vehicle-pipeline-db-app-secret
                        key: uri
                  PAPERLESS_URL:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: PAPERLESS_URL}
                  PAPERLESS_TOKEN:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: PAPERLESS_TOKEN}
                  PAPERLESS_WEBHOOK_SECRET:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: PAPERLESS_WEBHOOK_SECRET}
                  LITELLM_BASE_URL:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: LITELLM_BASE_URL}
                  LITELLM_API_KEY:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: LITELLM_API_KEY}
                  MYGARAGE_URL: https://mygarage.apps.altus.janz.digital
                  MYGARAGE_USERNAME:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: MYGARAGE_USERNAME}
                  MYGARAGE_PASSWORD:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: MYGARAGE_PASSWORD}
                  MYGARAGE_VEHICLES:
                    valueFrom:
                      secretKeyRef: {name: vehicle-pipeline-credentials, key: MYGARAGE_VEHICLES}
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet: {path: /healthz, port: 8000}
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet: {path: /healthz, port: 8000}
                      initialDelaySeconds: 5
                      periodSeconds: 10
              # Basic-auth reverse-proxy sidecar in front of the app, for the
              # /review path only -- mirrors pricing-tool's proven
              # nginxinc/nginx-unprivileged + conf.d/default.conf shape
              # (components-apps/pricing-tool/pricing-tool-app.yaml), not a
              # freshly-invented pattern. Stock `nginx` (root-oriented image)
              # would fail under OpenShift's arbitrary-non-root-UID SCC; the
              # `-unprivileged` variant is built for that and already
              # listens on 8080.
              authproxy:
                image:
                  repository: nginxinc/nginx-unprivileged
                  tag: "1.27-alpine"
                  pullPolicy: IfNotPresent
                ports:
                  - name: authproxy
                    containerPort: 8080
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      tcpSocket: {port: 8080}
                      initialDelaySeconds: 5
                      periodSeconds: 30
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      tcpSocket: {port: 8080}
                      initialDelaySeconds: 3
                      periodSeconds: 10

        # Two services on the same controller: `app` (port 8000, the FastAPI
        # app itself -- serves /webhooks and /healthz unauthenticated) and
        # `app-review` (port 8080, routed through the authproxy sidecar --
        # serves /review behind nginx basic-auth). Port key names must be
        # unique per controller (bjw-s app-template matches service ports to
        # container ports by name) -- using "http" for both here would be
        # ambiguous, unlike pricing-tool's http/authproxy split.
        service:
          app:
            controller: app
            ports:
              http:
                port: 8000
          app-review:
            controller: app
            ports:
              authproxy:
                port: 8080

        persistence:
          nginx-conf:
            type: configMap
            name: vehicle-pipeline-nginx-basic-auth
            advancedMounts:
              app:
                authproxy:
                  - path: /etc/nginx/conf.d/default.conf
                    subPath: default.conf
                    readOnly: true
          basic-auth:
            type: secret
            name: vehicle-pipeline-basic-auth
            advancedMounts:
              app:
                authproxy:
                  - path: /etc/nginx/.htpasswd
                    subPath: htpasswd
                    readOnly: true

        ingress:
          app:
            enabled: true
            className: openshift-default
            annotations:
              route.openshift.io/termination: "edge"
            hosts:
              - host: vehicle-pipeline.apps.altus.janz.digital
                paths:
                  - path: /webhooks
                    service: {identifier: app, port: http}
                  - path: /healthz
                    service: {identifier: app, port: http}
                  - path: /review
                    service: {identifier: app-review, port: authproxy}

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
