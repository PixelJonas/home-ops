apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: firefly-backup-app
  namespace: openshift-gitops
spec:
  destination:
    namespace: firefly
    server: https://kubernetes.default.svc
  project: cluster-apps
  source:
    path: components-apps/firefly/backup
    repoURL: https://github.com/pixeljonas/home-ops.git
    targetRevision: master
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
