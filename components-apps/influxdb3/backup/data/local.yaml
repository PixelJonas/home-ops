- op: replace
  path: /spec/sourcePVC
  value: influxdb3-app-data
- op: replace
  path: /spec/restic/repository
  value: restic-config-data
- op: add
  path: /spec/restic/copyMethod
  value: Snapshot
- op: add
  path: /spec/restic/volumeSnapshotClassName
  value: lvms-vg1
- op: add
  path: /spec/restic/cacheCapacity
  value: 10Gi
- op: add
  path: /spec/restic/moverSecurityContext
  value:
    runAsUser: 1001140000
    runAsGroup: 1001140000
    fsGroup: 1001140000
    fsGroupChangePolicy: OnRootMismatch
