apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: influxdb3-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "111"
spec:
  destination:
    namespace: influxdb3
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.2.1
    helm:
      values: |-
        controllers:
          influxdb3:
            replicas: 0
            containers:
              influxdb3:
                image:
                  repository: docker.io/library/influxdb
                  tag: 3.11.4-core
                  pullPolicy: IfNotPresent
                args:
                  - serve
                  - --node-id=altus
                  - --object-store=file
                  - --data-dir=/var/lib/influxdb3/data
                  - --plugin-dir=/var/lib/influxdb3/plugins
                  - --query-file-limit=10000
                  - --checkpoint-interval=5m
                  - --wal-replay-concurrency-limit=4
                  - --force-snapshot-mem-size=40%
                  - --wal-files-per-snapshot=50
                env:
                  TZ: Europe/Berlin
                resources:
                  requests:
                    cpu: 500m
                    memory: 4Gi
                  limits:
                    cpu: "2"
                    memory: 24Gi
                probes:
                  startup:
                    enabled: true
                    custom: true
                    spec:
                      tcpSocket:
                        port: 8181
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 360
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      tcpSocket:
                        port: 8181
                      initialDelaySeconds: 15
                      periodSeconds: 20
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      tcpSocket:
                        port: 8181
                      initialDelaySeconds: 10
                      periodSeconds: 10

        service:
          influxdb3:
            controller: influxdb3
            ports:
              http:
                port: 8181
        ingress:
          influxdb3:
            enabled: true
            className: openshift-default
            annotations:
              route.openshift.io/termination: "edge"
            hosts:
              - host: influxdb3.apps.altus.janz.digital
                paths:
                  - path: /
                    service:
                      identifier: influxdb3
                      port: http

        persistence:
          data:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: lvms-vg1
            size: 100Gi
            globalMounts:
              - path: /var/lib/influxdb3/data
          plugins:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: lvms-vg1
            size: 1Gi
            globalMounts:
              - path: /var/lib/influxdb3/plugins

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
