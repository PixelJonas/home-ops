# Instance-level runner registration token. Its source of truth is altus'
# Secret gitea/gitea-actions-runner-token (written by the gitea bootstrap
# Job); the operator copies it into Doppler infra-ops/prd, which the
# doppler-infra store reads. Only needed for the first registration: the
# runner keeps its registration in /data/.runner on its PVC afterwards.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-actions-runner-token
  namespace: gitea-runners
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-infra
  target:
    name: gitea-actions-runner-token
  data:
    - secretKey: token
      remoteRef:
        key: GITEA_RUNNER_REGISTRATION_TOKEN
