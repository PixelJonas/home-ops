apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-coppermind-mcp-credentials
  namespace: coppermind-mcp
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: coppermind-mcp-credentials
  data:
    - secretKey: QDRANT_READ_ONLY_API_KEY
      remoteRef:
        key: QDRANT_READ_ONLY_API_KEY
    - secretKey: COPPERMIND_MCP_PLAYER_TOKEN
      remoteRef:
        key: COPPERMIND_MCP_PLAYER_TOKEN
    - secretKey: COPPERMIND_MCP_GM_TOKEN
      remoteRef:
        key: COPPERMIND_MCP_GM_TOKEN
