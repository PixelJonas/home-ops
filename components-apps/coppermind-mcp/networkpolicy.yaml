apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coppermind-mcp
  namespace: coppermind-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: coppermind-mcp-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The default router uses HostNetwork, so only the policy-group label matches it.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      # Policies see the pod port after DNAT: CoreDNS listens on 5353.
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qdrant
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: qdrant-app
      ports:
        - protocol: TCP
          port: 6333
