apiVersion: v1
kind: ConfigMap
metadata:
  name: honcho-config
  namespace: honcho
  annotations:
    argocd.argoproj.io/sync-wave: "30"
data:
  LOG_LEVEL: "INFO"
  AUTH_USE_AUTH: "true"
  CACHE_ENABLED: "true"
  CACHE_URL: "redis://honcho-app-redis.honcho.svc:6379/0"
  DERIVER_ENABLED: "true"
  DERIVER_WORKERS: "1"
  SUMMARY_ENABLED: "true"
  DREAM_ENABLED: "true"
  DREAM_MIN_HOURS_BETWEEN_DREAMS: "8"
  PEER_CARD_ENABLED: "true"
  METRICS_ENABLED: "false"
  SENTRY_ENABLED: "false"
  TELEMETRY_ENABLED: "false"
  EMBED_MESSAGES: "true"
  EMBEDDING_VECTOR_DIMENSIONS: "1024"
  LLM_OPENAI_BASE_URL: "http://litellm-app.litellm.svc:4000/v1"
  EMBEDDING_MODEL_CONFIG__TRANSPORT: "openai"
  # Model name must match vLLM's --served-model-name.
  EMBEDDING_MODEL_CONFIG__MODEL: "bge-m3"
  # Embeddings now go to the in-namespace vLLM bge-m3 server (CPU), not LiteLLM.
  EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://honcho-app-vllm-bge-m3.honcho.svc:8000/v1"
  EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE: "never"
  DERIVER_MODEL_CONFIG__TRANSPORT: "openai"
  DERIVER_MODEL_CONFIG__MODEL: "claude-sonnet-5"
  DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm-app.litellm.svc:4000/v1"
  SUMMARY_MODEL_CONFIG__TRANSPORT: "openai"
  SUMMARY_MODEL_CONFIG__MODEL: "claude-sonnet-5"
  SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm-app.litellm.svc:4000/v1"
  DREAM_DEDUCTION_MODEL_CONFIG__TRANSPORT: "openai"
  DREAM_DEDUCTION_MODEL_CONFIG__MODEL: "claude-sonnet-5"
  DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm-app.litellm.svc:4000/v1"
  DREAM_INDUCTION_MODEL_CONFIG__TRANSPORT: "openai"
  DREAM_INDUCTION_MODEL_CONFIG__MODEL: "claude-sonnet-5"
  DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm-app.litellm.svc:4000/v1"
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: "claude-sonnet-5"
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm-app.litellm.svc:4000/v1"
  DIALECTIC_LEVELS__low__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: "claude-sonnet-5"
  DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm-app.litellm.svc:4000/v1"
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: "claude-sonnet-5"
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm-app.litellm.svc:4000/v1"
  DIALECTIC_LEVELS__high__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: "claude-sonnet-5"
  DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm-app.litellm.svc:4000/v1"
  DIALECTIC_LEVELS__max__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: "claude-sonnet-5"
  DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm-app.litellm.svc:4000/v1"
