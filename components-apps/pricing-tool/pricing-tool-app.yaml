apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "111"
  name: pricing-tool-app
  namespace: openshift-gitops
spec:
  destination:
    namespace: pricing-tool
    server: "https://kubernetes.default.svc"
  source:
    chart: app-template
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.0.1
    helm:
      values: |-
        defaultPodOptions:
          imagePullSecrets:
            - name: pricing-tool-ghcr-pull-secret

        controllers:
          pricing-tool:
            containers:
              pricing-tool:
                image:
                  repository: ghcr.io/kounex/openshift-bare-metal-pricing-tool
                  tag: "1.1.0"
                  pullPolicy: IfNotPresent
                env:
                  SHOW_DISCLAIMER: "true"
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /
                        port: 8080
                      initialDelaySeconds: 5
                      periodSeconds: 30
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /
                        port: 8080
                      initialDelaySeconds: 3
                      periodSeconds: 10
              # Basic-auth reverse-proxy sidecar in front of the app, for the
              # public Route only (ocp-pricing.janz.cloud). The internal
              # Tailscale-only Service/port below bypasses this entirely —
              # it's already gated by tailnet membership.
              basic-auth:
                image:
                  repository: nginxinc/nginx-unprivileged
                  tag: "1.31.4
                  pullPolicy: IfNotPresent
                ports:
                  - name: authproxy
                    containerPort: 8081
                resources:
                  requests:
                    cpu: 5m
                    memory: 16Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      tcpSocket:
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 30
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      tcpSocket:
                        port: 8081
                      initialDelaySeconds: 3
                      periodSeconds: 10

        persistence:
          nginx-basic-auth-config:
            type: configMap
            name: pricing-tool-nginx-basic-auth
            advancedMounts:
              pricing-tool:
                basic-auth:
                  - path: /etc/nginx/conf.d/default.conf
                    subPath: default.conf
                    readOnly: true
          htpasswd:
            type: secret
            name: pricing-tool-basic-auth
            advancedMounts:
              pricing-tool:
                basic-auth:
                  - path: /etc/nginx/.htpasswd
                    subPath: .htpasswd
                    readOnly: true

        service:
          pricing-tool:
            controller: pricing-tool
            annotations:
              tailscale.com/expose: "true"
              tailscale.com/hostname: "pricing-tool"
            ports:
              http:
                port: 8080
          pricing-tool-public:
            controller: pricing-tool
            ports:
              authproxy:
                port: 8081

  project: cluster-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
